    async function uploadFile(file, folderName) {
      const base64 = await toBase64(file);

      const response = await fetch("https://script.google.com/macros/s/AKfycbzBuAZuk3tGCJoDUNhUUzly7-yeRX4dEV7h4jjUd_upMyE7_ZOV6f3Smk9m3xp25oc/exec", {

          file: base64.split(",")[1],
          type: file.type,
          name: file.name,

      });

      const result = await response.json();
      if (!result.success) throw new Error(result.error);

      return result.url;
    }

    // helper
    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
      });
    }

    async function fixImageOrientation(file) {
      return new Promise((resolve) => {
        const img = new Image();
        const url = URL.createObjectURL(file);

        img.onload = () => {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          canvas.width = img.width;
          canvas.height = img.height;

          ctx.drawImage(img, 0, 0);

          canvas.toBlob((blob) => {
            resolve(blob);
          }, file.type);
        };

        img.src = url;
      });
    }

    function doPost(e) {
      try {
        const data = e.parameter;

        const fileBlob = Utilities.newBlob(
          Utilities.base64Decode(data.file),
          data.type,
          data.name
        );

        const parentFolder = DriveApp.getFolderById("1pNiZ1MxxhQskMxib4k_ejAVVDqxTnAZd");

        // ✅ create/find folder properly
        let folder;
        const folders = parentFolder.getFoldersByName(data.folder);

        if (folders.hasNext()) {
          folder = folders.next();
        } else {
          folder = parentFolder.createFolder(data.folder);
        }

        const file = folder.createFile(fileBlob);

        return ContentService.createTextOutput(JSON.stringify({
          success: true,
          url: file.getUrl()
        })).setMimeType(ContentService.MimeType.JSON);

      } catch (err) {
        return ContentService.createTextOutput(JSON.stringify({
          success: false,
          error: err.toString()
        }));
      }
    }

    function calculateAge() {

  const dobValue = document.getElementById('Date_of_Birth').value;

  if (!dobValue) {
    return;
  }

  const dobDate = new Date(dobValue); // now works correctly
  const today = new Date();

  let age = today.getFullYear() - dobDate.getFullYear();

  const monthDiff = today.getMonth() - dobDate.getMonth();

  if (
    monthDiff < 0 ||
    (monthDiff === 0 && today.getDate() < dobDate.getDate())
  ) {
    age--;
  }

  document.getElementById("Age").value = age;
}

<script>
  (function () {
    var canonicalElem = document.querySelector('link[rel="canonical"]');
    var liveUrl = (window.location.protocol.indexOf('http') === 0)
      ? window.location.href
      : (canonicalElem ? canonicalElem.href : 'https://sikhsinindia.com');

    var rawTitle = document.title;
    var pageUrlEnc = encodeURIComponent(liveUrl);
    var pageTitleEnc = encodeURIComponent(rawTitle);

    var gsbWa = document.getElementById('gsbWhatsappShare');
    if (gsbWa) gsbWa.addEventListener('click', function () {
      window.open('https://api.whatsapp.com/send?text=' + pageTitleEnc + '%20' + pageUrlEnc, '_blank', 'noopener,noreferrer');
    });

    var gsbFb = document.getElementById('gsbFacebookShare');
    if (gsbFb) gsbFb.addEventListener('click', function () {
      window.open('https://www.facebook.com/sharer/sharer.php?u=' + pageUrlEnc, '_blank', 'noopener,noreferrer,width=600,height=400');
    });

    var gsbIg = document.getElementById('gsbInstagramShare');
    if (gsbIg) gsbIg.addEventListener('click', function () {
      if (navigator.share) {
        navigator.share({ title: rawTitle, url: liveUrl }).catch(function () {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(liveUrl).then(function () {
          alert('लिंक क्लिपबोर्ड पर कॉपी हो गया!\n\nअब आप इसे Instagram या किसी भी ऐप में पेस्ट कर सकते हैं।');
        }).catch(function () { alert('साझा करने के लिए लिंक: ' + liveUrl); });
      } else {
        alert('साझा करने के लिए लिंक: ' + liveUrl);
      }
    });
  })();
</script>
