  <header>
    <h1>Divine Reflection - Journey with our Gurus</h1>

  <!-- Guru Nanak Dev Ji Section with Navigation -->
  <section id="guru-angad-section">
    <h2 class="guru-title">Guru Angad Dev Ji</h2>
    <div class="gallery" style="flex-direction: column; align-items: center;">
      <div class="card" style="width: 300px;">
        <img id="guruAngadImg" alt="Guru Nanak Dev Ji" />
        <p id="guruAngadCaption"></p>
      </div>

      <div style="margin-top: 1rem;">
        <button class="button" onclick="prevImage()">&#9664; Previous</button>
        <button class="button" onclick="nextImage()">Next &#9654;</button>

<script>
  const guruAngadPhotos = [
 { src: "../pictures/100_Divine Reflections/02_Guru Angad Dev Ji/01-Guru Angad Dev Ji supporting the supportless.jpg", caption: "Guru Angad Dev Ji supporting the supportless" },
{ src: "../pictures/100_Divine Reflections/02_Guru Angad Dev Ji/02-Guru Angad Dev ji encouraged sport.jpg", caption: "Guru Angad Dev ji encouraged sport" },
{ src: "../pictures/100_Divine Reflections/02_Guru Angad Dev Ji/03-Guru Angad Dev Ji absorbed in teaching children enraged King.jpg", caption: "Guru Angad Dev Ji absorbed in teaching children enraged King" },
{ src: "../pictures/100_Divine Reflections/02_Guru Angad Dev Ji/04-Mata Khivi Jee.jpg", caption: "Mata Khivi Jee" },
{ src: "../pictures/100_Divine Reflections/02_Guru Angad Dev Ji/05-Mata Khivi Ji serving Kheer in Langar.jpg", caption: "Mata Khivi Ji serving Kheer in Langar" },
{ src: "../pictures/100_Divine Reflections/02_Guru Angad Dev Ji/06-Mata Khivi Ji - a pious lady.jpg", caption: "Mata Khivi Ji - a pious lady" },
{ src: "../pictures/100_Divine Reflections/02_Guru Angad Dev Ji/07-Mata Khivi Ji in Guru's Langar.jpg", caption: "Mata Khivi Ji in Guru's Langar" },

];


  let currentIndex = 0;

  function showImage(index) {
    const img = document.getElementById("guruAngadImg");
    const caption = document.getElementById("guruAngadCaption");

    img.src = guruAngadPhotos[index].src;
    caption.textContent =  guruAngadPhotos[index].caption ;
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % guruAngadPhotos.length;
    showImage(currentIndex);
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + guruAngadPhotos.length) % guruAngadPhotos.length;
    showImage(currentIndex);
  }
  document.addEventListener("DOMContentLoaded", () => showImage(0));
</script>
