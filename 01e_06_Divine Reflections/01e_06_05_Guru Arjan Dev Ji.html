<script>
  const guruArjanPhotos = [
{ src: "../pictures/100_Divine Reflections/05_Guru Arjan Dev Ji/01-Guru Arjan Dev Ji digging up a well in village.jpg", caption: "Guru Arjan Dev Ji digging up a well in village" },
{ src: "../pictures/100_Divine Reflections/05_Guru Arjan Dev Ji/02-Darbar Sahib with Guru Ji - Akbar comes to visit.jpg", caption: "Darbar Sahib with Guru Ji - Akbar comes to visit" },
{ src: "../pictures/100_Divine Reflections/05_Guru Arjan Dev Ji/03-Guru Arjan Dev Ji serves the lepers at Taran Taaran Sahib.jpg", caption: "Guru Arjan Dev Ji serves the lepers at Taran Taaran Sahib" },
{ src: "../pictures/100_Divine Reflections/05_Guru Arjan Dev Ji/04-Guru Arjan Dev Jee being tortured at Lahore.jpg", caption: "Guru Arjan Dev Jee being tortured at Lahore" },
{ src: "../pictures/100_Divine Reflections/05_Guru Arjan Dev Ji/05-The Guru's Word is the panacea for all ills.jpg", caption: "The Guru's Word is the panacea for all ills" },
{ src: "../pictures/100_Divine Reflections/05_Guru Arjan Dev Ji/06-Guru Granth Sahib Ji being carried to Harmandar Sahib.jpg", caption: "Guru Granth Sahib Ji being carried to Harmandar Sahib" },
{ src: "../pictures/100_Divine Reflections/05_Guru Arjan Dev Ji/07-Parkash.jpg", caption: "Parkash" },
{ src: "../pictures/100_Divine Reflections/05_Guru Arjan Dev Ji/08-Parkash-2.jpg", caption: "Parkash-2" },
{ src: "../pictures/100_Divine Reflections/05_Guru Arjan Dev Ji/09-Guru Arjan Dev Ji with Aad Granth Jee.jpg", caption: "Guru Arjan Dev Ji with Aad Granth Jee" },
{ src: "../pictures/100_Divine Reflections/05_Guru Arjan Dev Ji/10-Guru Granth is Guru, Guru Arjan Dev Ji sits next to the Guru.jpg", caption: "Guru Granth is Guru, Guru Arjan Dev Ji sits next to the Guru" },
{ src: "../pictures/100_Divine Reflections/05_Guru Arjan Dev Ji/11-Guru Ji recites the Aad Granth.jpg", caption: "Guru Ji recites the Aad Granth" },
{ src: "../pictures/100_Divine Reflections/05_Guru Arjan Dev Ji/12-Guru Arjan Dev Jee sitting on hot plate enduring torture wit.jpg", caption: "Guru Arjan Dev Jee sitting on hot plate enduring torture" },
{ src: "../pictures/100_Divine Reflections/05_Guru Arjan Dev Ji/13-Guru Arjan Jee boiled and tortured.jpg", caption: "Guru Arjan Jee boiled and tortured" },
{ src: "../pictures/100_Divine Reflections/05_Guru Arjan Dev Ji/14-Guru Arjan Dev Ji's Shaheedi.jpg", caption: "Guru Arjan Dev Ji's Shaheedi" },

];


  let currentIndex = 0;

  function showImage(index) {
    const img = document.getElementById("guruArjanImg");
    const caption = document.getElementById("guruArjanCaption");

    img.src = guruArjanPhotos[index].src;
    caption.textContent =  guruArjanPhotos[index].caption ;
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % guruArjanPhotos.length;
    showImage(currentIndex);
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + guruArjanPhotos.length) % guruArjanPhotos.length;
    showImage(currentIndex);
  }
  document.addEventListener("DOMContentLoaded", () => showImage(0));
</script>
