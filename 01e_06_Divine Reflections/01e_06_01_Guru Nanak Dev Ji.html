  let currentIndex = 0;

  function showImage(index) {
    const img = document.getElementById("guruNanakImg");
    const caption = document.getElementById("guruNanakCaption");

    img.src = guruNanakPhotos[index].src;
    caption.textContent =  guruNanakPhotos[index].caption ;
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % guruNanakPhotos.length;
    showImage(currentIndex);
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + guruNanakPhotos.length) % guruNanakPhotos.length;
    showImage(currentIndex);
  }
  document.addEventListener("DOMContentLoaded", () => showImage(0));
