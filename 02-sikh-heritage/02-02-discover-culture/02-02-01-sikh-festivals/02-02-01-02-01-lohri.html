    /* Styled 3D Gold Action Back Link */

  <div class="poster">

  <script>
    const lohriPhotos = [
      {
        src: "https://drive.google.com/thumbnail?id=1hpDOXb8HQriSykc-yMPlnhnTLDMiQQx_&sz=w1000",
        caption: "Relevance of Lohri and role of Dulla Bhatti"
      },
      {
        src: "https://drive.google.com/thumbnail?id=11R6zVADxAUSfrdoEZ1Lih0eV7hknU69t&sz=w1000",
        caption: "Relevance of Lohri and role of Dulla Bhatti"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1qA0UkA7OtD9CQ9wibsDOrNEkK-wL0scg&sz=w1000",
        caption: "Relevance of Lohri and role of Dulla Bhatti"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1aW2cSGKi0G9bpYd53t7d-bu62_yiSY65&sz=w1000",
        caption: "Relevance of Lohri and role of Dulla Bhatti"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1oEd77ityP30vyrZS_F-TAnamZOQvwlLN&sz=w1000",
        caption: "Relevance of Lohri and role of Dulla Bhatti"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1iQsN5ayakPO19doMWpgctQOOjLwPlMEE&sz=w1000",
        caption: "Relevance of Lohri and role of Dulla Bhatti"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1zKa6DINtjqWOAY-Yn7I4n4k0tXQUCkay&sz=w1000",
        caption: "Relevance of Lohri and role of Dulla Bhatti"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1RmhKgKVm2wcOgeT4uBN33U0CeRiV_hs-&sz=w1000",
        caption: "Relevance of Lohri and role of Dulla Bhatti"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1rEZRsr6C3Jc1vn6xCl-HjRcBPzhmlEuJ&sz=w1000",
        caption: "Why the Lohri Fire?"
      }
    ];

    let currentIndex = 0;

    function showImage(index) {
      const img = document.getElementById("lohriImg");
      if (!img) return;

      img.src = lohriPhotos[index].src;

      document.getElementById("lohriCaption").textContent =
        lohriPhotos[index].caption;

      document.getElementById("imageCounter").textContent =
        (index + 1) + " / " + lohriPhotos.length;
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % lohriPhotos.length;
      showImage(currentIndex);
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + lohriPhotos.length) % lohriPhotos.length;
      showImage(currentIndex);
    }

    // Event listener system ensures script runs after DOM is constructed
    document.addEventListener("DOMContentLoaded", () => showImage(0));
  </script>
