  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
      authDomain: "sikhsinindia-67a6b.firebaseapp.com",
      projectId: "sikhsinindia-67a6b",
      storageBucket: "sikhsinindia-67a6b.appspot.com",
      messagingSenderId: "622603668882",
      appId: "1:622603668882:web:953c6a07864b235fdd054b",
      measurementId: "G-LHNTFNW14H"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allEvents = [];

    function formatEventDate(dateVal) {
      if (!dateVal) return '';
      const dt = dateVal.toDate ? dateVal.toDate() : new Date(dateVal);
      if (isNaN(dt.getTime())) return '';
      const day = String(dt.getDate()).padStart(2, '0');
      const month = dt.toLocaleString('default', { month: 'short' });
      const year = dt.getFullYear();
      let hours = dt.getHours();
      const minutes = String(dt.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      if (hours === 0) hours = 12;
      return `${day} ${month} ${year}, ${hours}:${minutes} ${ampm}`;
    }

    function renderRows(events) {
      const tbody = document.getElementById('calendarTableBody');
      const resultCount = document.getElementById('resultCount');

      if (!events.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="no-results">No festivals match your search.</td></tr>';
        resultCount.textContent = '';
        return;
      }

      resultCount.textContent = `Showing ${events.length} of ${allEvents.length} event(s)`;

      tbody.innerHTML = events.map((ev, idx) => `
        <tr>
          <td class="sno-cell">${idx + 1}</td>
          <td class="date-cell">${formatEventDate(ev.Date)}</td>
          <td class="category-cell">${ev.Category ? `<span class="category-badge">${ev.Category}</span>` : ''}</td>
          <td>${ev.Description || ''}</td>
        </tr>
      `).join('');
    }

    function applySearch() {
      const q = document.getElementById('searchBox').value.trim().toLowerCase();
      if (!q) {
        renderRows(allEvents);
        return;
      }
      const filtered = allEvents.filter(ev =>
        (ev.Description || '').toLowerCase().includes(q) ||
        (ev.Category || '').toLowerCase().includes(q)
      );
      renderRows(filtered);
    }

    function loadCalendar() {
      db.collection("Calendar").orderBy("Date", "asc").get()
        .then(querySnapshot => {
          allEvents = [];
          querySnapshot.forEach(doc => allEvents.push(doc.data()));
          renderRows(allEvents);
        })
        .catch(error => {
          console.error("Error fetching calendar:", error);
          document.getElementById('calendarTableBody').innerHTML =
            `<tr><td colspan="4" style="text-align: center; color: #d93838; font-weight:bold; padding: 20px;">Error loading calendar: ${error.message}</td></tr>`;
        });
    }

    document.getElementById('searchBox').addEventListener('input', applySearch);

    window.onload = loadCalendar;
  </script>
