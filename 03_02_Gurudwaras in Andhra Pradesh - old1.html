<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gurudwaras in Andhra Pradesh</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #FFA500; /* Kesari Orange */
      color: #000000;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 40px;
      text-shadow: 2px 2px #00000022;
    }

    .card-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 0 20px;
    }

    .card {
      background-color: #fff;
      color: #000;
      width: 300px;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      min-height: 350px; /* force equal height */
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }

    .card h3 {
      margin: 15px 0;
    }

    .card button {
      background-color: #000000;
      color: #FFA500;
      border: 2px solid #FFA500;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: auto;
    }

    .card button:hover {
      background-color: #FFA500;
      color: #000000;
      border-color: #000000;
    }

    section {
      margin: 20px auto;
      max-width: 1200px;
      background: black; /* Black background for content */
      color: #FF9933; /* Yellow text in content */
      padding: 5px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    
  </style>
</head>

<body>
  <h1>Gurudwaras in Andhra Pradesh</h1>

   <section>

        
<h2>Amaravati</h2>
<h2>Anantapur</h2>
<h2>Chittoor</h2>
<h2>Eluru</h2>
<h2>Guntur</h2>
<h2>Kakinada</h2>
<h2>Kadapa (YSR Kadapa)</h2>
<h2>Kurnool</h2>
<h2>Nellore (SPSR Nellore)</h2>
<h2>Ongole</h2>
<h2>Rajahmundry (Rajamahendravaram)</h2>
<h2>Srikakulam</h2>
<h2>Tadepalligudem</h2>
<h2>Tirupati</h2>
<h2>Vijayawada</h2>
<h2>Visakhapatnam</h2>
<h2>Vizianagaram</h2>

  type="button"

  Back
</button>

    function goBack() {
      window.location.href = "./03_05_Gurudwaras in Bihar.html";

</body>
</html>
