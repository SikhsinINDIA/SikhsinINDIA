<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <!--
    ============================================================
    Sikh Gurus Match Game — Long-form Build (~500+ lines)
    - Randomized photos (10 total), split as 5/5 across two columns
    - Names shuffled in 3rd column
    - Equal-height photo cards
    - Images centered horizontally and aligned to the top
    - Small "Drop name" placeholder
    - Correct name stays inside a little green box under the image
    - Tracks Attempts and Score %, shows them on the finish popup
    - Confetti on win
    - Maintains the original local image paths provided
    ============================================================
  -->

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Kids Match-Up Game</title>

  <style>
    /* =========================================================
       THEME VARIABLES
       ========================================================= */
    :root {
      --kesari: #FF9933;  /* primary accent color */
      --black:  #000000;  /* dark ink color */
      --ink:    #1f2937;  /* softer ink for body */
      --bg:     #f7f8ff;  /* subtle page background */
      --card:   #ffffff;  /* card background */

      --green-bg:   #c8f7c5; /* match success bg */
      --green-text: #0a5d00; /* match success text */
      --green-bdr:  #6bbf59; /* match success border */

      --red:   #ff3b30;
      --gray:  #666;
    }

    /* =========================================================
       GLOBAL RESETS
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family:
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Arial,
        sans-serif;

      background: var(--black);
      color: var(--black);
    }

    /* =========================================================
       PAGE WRAPPER
       ========================================================= */
    .wrap {
      max-width: 1100px;
      margin: auto;
      padding: 16px;
      background: #fff;
      min-height: 100vh;
    }

    /* =========================================================
       HEADER AREA
       ========================================================= */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(22px, 6vw, 32px);
      margin: 0;
      color: var(--black);
    }

    .sub {
      color: var(--black);
      font-size: 14px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button,
    .select {
      border: 2px solid var(--black);
      background: #fff;
      color: var(--black);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    button.primary {
      background: var(--kesari);
      color: var(--black);
    }

    button:hover,
    .select:hover {
      background: var(--black);
      color: #fff;
    }

    /* =========================================================
       STATUS BAR
       ========================================================= */
    .status {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 10px 0 16px 0;
      font-size: 14px;
      color: var(--black);
      font-weight: 600;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--kesari);
    }

    .score,
    .attempts,
    .pct {
      font-weight: 800;
    }

    /* =========================================================
       BOARD LAYOUT (3 columns: Photos 1 | Photos 2 | Names)
       ========================================================= */
    .board {
      display: grid;
      grid-template-columns: 2fr 2fr 1fr;
      gap: 18px;
      align-items: start;
    }

    .col {
      background: #fff;
      border-radius: 12px;
      padding: 8px;
    }

    .col h2 {
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--kesari);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* =========================================================
       PHOTOS COLUMNS
       - Force equal card heights
       - Image: center horizontally and top-aligned
       ========================================================= */
    .grid-photos {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .photoCard {
      position: relative;

      /* equal size for all cards */
      min-height: 110px;
      padding: 8px 8px 28px; /* extra bottom for the drop pill */

      /* layout for image area */
      display: flex;
      flex-direction: column;
      align-items: center;      /* horizontal center */
      justify-content: flex-start; /* top aligned */

      /* visuals */
      border: 2px dashed var(--kesari);
      border-radius: 10px;
      overflow: hidden;
      background: #fff5eb;
      transition: border-color 0.25s ease, background 0.25s ease;
    }

    .photoCard.locked {
      border: 2px solid var(--kesari);
      background: #ffe1c4;
    }

    .photoCard.wrong {
      border: 2px solid var(--red);
    }

    .photoCard img {
      /* keep image inside the card without clipping */
      max-height: 100%;
      max-width: 100%;

      /* requested small width for consistency */
      width: 50px;
      height: auto;

      object-fit: contain;

      /* center horizontally (already via align-items:center) */
      /* align to top (flex-start on container) */
      margin-top: 4px;
      display: block;
    }

    /* Placeholder text below image (before correct match) — small */
    .dropName {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 6px;

      background: #f2f2f2;
      color: var(--gray);

      border: 1px dashed #bdbdbd;
      border-radius: 8px;

      padding: 2px 6px;

      font-size: 11px; /* smaller placeholder as requested */
      font-weight: 500;
      text-align: center;

      /* clickable target for drop */
      pointer-events: auto;
    }

    /* When matched, convert placeholder into a little green box (pill) */
    .photoCard.locked .dropName {
      background-color: var(--green-bg);
      color: var(--green-text);
      border: 1px solid var(--green-bdr);

      font-size: 11px;
      font-weight: 700;

      width: max-content;
      min-width: 0;

      left: 50%;
      right: auto;
      transform: translateX(-50%);

      padding: 2px 8px;
      bottom: 6px;
      border-radius: 999px;
      box-shadow: 0 1px 0 rgba(0,0,0,.06);
    }

    /* =========================================================
       NAMES COLUMN
       ========================================================= */
    .names {
      display: grid;
      grid-template-rows: repeat(10, auto);
      gap: 10px;
    }

    .nameChip {
      user-select: none;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--kesari);
      color: var(--black);
      font-weight: 700;
      text-align: center;
      cursor: grab;
      border: 2px solid var(--black);
      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.1s ease,
        opacity 0.2s ease;
    }

    .nameChip:hover {
      background: var(--black);
      color: #fff;
    }

    .nameChip.matched {
      background-color: var(--green-bg);
      color: var(--green-text);
      border-color: var(--green-bdr);
      cursor: default;
      opacity: 0.65;
      transform: scale(0.95);
    }

    /* Selected (pending) state for tap-to-match on mobile */
    .nameChip.pending {
      outline: 3px dashed var(--kesari);
      outline-offset: 2px;
      background: #ffe7c6;
    }

    /* =========================================================
       MOBILE TWEAKS
       ========================================================= */
    @media (max-width: 820px) {
      .board {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 16px;
      }
    }

    @media (max-width: 700px) {
      /* Keep 3 columns but slightly tighter spacing on very small screens */
      .board {
        gap: 12px;
      }

      .photoCard {
        min-height: 100px;
      }

      .nameChip {
        font-size: 13px;
        padding: 6px 10px;
      }
    }

    /* =========================================================
       BACK BUTTON
       ========================================================= */
    .back-button {
      width: 80%;
      max-width: 220px;
      height: 46px;
      font-size: 18px;
      background-color: #FFA500;
      color: black;
      margin: 40px auto 0 auto;
      display: block;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .back-button:hover {
      background-color: #FF8C00;
    }

    /* =========================================================
       WIN MODAL OVERLAY
       ========================================================= */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: grid;
      place-items: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.2s ease;
    }

    .modal.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .modalCard {
      background: white;
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      border: 2px solid black;
      max-width: 420px;
      width: calc(100% - 32px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    }

    .modalCard h3 {
      margin: 0 0 8px;
      font-size: 22px;
      color: black;
    }

    .modalCard p {
      margin: 0 0 10px;
      color: black;
      font-size: 15px;
    }

    .modalCard .row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 6px 0 10px;
    }

    .modalCard .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--kesari);
      color: var(--black);
      font-weight: 800;
      border: 2px solid var(--black);
      font-size: 14px;
      min-width: 120px;
      text-align: center;
    }

    .modalCard button {
      margin-top: 10px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 2px solid black;
      background: #FF9933;
      font-weight: 700;
      cursor: pointer;
    }

    .modalCard button:hover {
      background: #ffb24f;
    }

    /* =========================================================
       CONFETTI RAIN
       ========================================================= */
    .confetti {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 10px;
      opacity: 0.9;
      z-index: 9998;
      animation: fall linear forwards;
      will-change: transform;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- =======================================================
         PAGE HEADER
         ======================================================= -->
    <header>
      <div>
        <h1>Match Guru Jis to their Names</h1>
        <div class="sub">Drag or tap a name onto the matching photo</div>
      </div>

      <div class="controls">
        <button id="newRound" class="primary">New Round</button>
        <button id="reset">Reset</button>
      </div>
    </header>

    <!-- =======================================================
         STATUS BAR
         ======================================================= -->
    <div class="status">
      <div class="dot"></div>

      <div class="score">
        Correct: <span id="score">0</span>
      </div>

      <div class="attempts">
        | Attempts: <span id="attempts">0</span>
      </div>

      <div class="pct">
        | Score %: <span id="pct">0</span>%
      </div>

      <div>
        | Matches needed: <span id="needed">0</span>
      </div>
    </div>

    <!-- =======================================================
         3-COLUMN BOARD
         ======================================================= -->
    <section class="board">
      <!-- Photos Column 1 -->
      <div class="col photos1">
        <h2>Photos (1–5)</h2>
        <div id="col1" class="grid-photos"><!-- filled by JS --></div>
      </div>

      <!-- Photos Column 2 -->
      <div class="col photos2">
        <h2>Photos (6–10)</h2>
        <div id="col2" class="grid-photos"><!-- filled by JS --></div>
      </div>

      <!-- Names Column -->
      <div class="col namesCol">
        <h2>Names</h2>
        <div id="names" class="names"><!-- filled by JS --></div>
      </div>
    </section>
  </div>

  <!-- =========================================================
       TEMPLATES
       ========================================================= -->
  <template id="photo-card-tpl">
    <div class="photoCard" tabindex="0" data-id="">
      <img alt="" />
      <div class="dropName" data-dropzone>Drop name</div>
    </div>
  </template>

  <template id="name-chip-tpl">
    <div class="nameChip" draggable="true" tabindex="0" data-id="">Name</div>
  </template>

  <!-- =========================================================
       WIN MODAL
       ========================================================= -->
  <div id="winModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="modalCard">
      <h3 id="winTitle">Great Job! 🎉</h3>
      <p>You matched all names correctly.</p>

      <div class="row">
        <span class="badge" id="finalScore">Score: 0%</span>
        <span class="badge" id="finalAttempts">Attempts: 0</span>
      </div>

      <button id="playAgain">Play Again</button>
    </div>
  </div>

  <!-- =========================================================
       GAME SCRIPT
       ========================================================= -->
  <script>
    /* ---------------------------------------------------------
       DATA: Keep original local image paths as requested
       --------------------------------------------------------- */
    const ALL_ITEMS = [
      {
        id: 'Guru Nanak Dev Ji',
        label: 'Guru Nanak Dev Ji',
        img: '../../pictures/07_Sikh_Stories/Sikh_Gurus/01 Guru Nanak Dev Ji.jpg'
      },
      {
        id: 'Guru Angad Dev Ji',
        label: 'Guru Angad Dev Ji',
        img: '../../pictures/07_Sikh_Stories/Sikh_Gurus/02 Guru Angad Dev Ji.jpg'
      },
      {
        id: 'Guru Amar Das Ji',
        label: 'Guru Amar Das Ji',
        img: '../../pictures/07_Sikh_Stories/Sikh_Gurus/03 Guru Amar Das Ji.jpg'
      },
      {
        id: 'Guru Ram Das Ji',
        label: 'Guru Ram Das Ji',
        img: '../../pictures/07_Sikh_Stories/Sikh_Gurus/04 Guru Ram Das Ji.jpg'
      },
      {
        id: 'Guru Arjan Dev Ji',
        label: 'Guru Arjan Dev Ji',
        img: '../../pictures/07_Sikh_Stories/Sikh_Gurus/05 Guru Arjan Dev Ji.jpg'
      },
      {
        id: 'Guru Har Gobind Ji',
        label: 'Guru Har Gobind Ji',
        img: '../../pictures/07_Sikh_Stories/Sikh_Gurus/06 Guru Har Gobind Singh Ji.jpg'
      },
      {
        id: 'Guru Har Rai Ji',
        label: 'Guru Har Rai Ji',
        img: '../../pictures/07_Sikh_Stories/Sikh_Gurus/07 Guru Har Rai Ji.jpg'
      },
      {
        id: 'Guru Har Krishan Ji',
        label: 'Guru Har Krishan Ji',
        img: '../../pictures/07_Sikh_Stories/Sikh_Gurus/08 Shri Guru Harkrishan Ji.jpg'
      },
      {
        id: 'Guru Tegh Bahadur Ji',
        label: 'Guru Tegh Bahadur Ji',
        img: '../../pictures/07_Sikh_Stories/Sikh_Gurus/09 Shri Guru Teg Bahadur Ji.jpg'
      },
      {
        id: 'Guru Gobind Singh Ji',
        label: 'Guru Gobind Singh Ji',
        img: '../../pictures/07_Sikh_Stories/Sikh_Gurus/10 Shri Guru Gobind Singh Ji.jpg'
      }
    ];

    /* ---------------------------------------------------------
       DOM HELPERS + STATE
       --------------------------------------------------------- */
    const $ = (sel) => document.querySelector(sel);

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const state = {
      activeItems: [],
      matches: 0,
      attempts: 0,   // 👈 track tries
      needed: 0
    };

    /* ---------------------------------------------------------
       SCORE HELPERS
       --------------------------------------------------------- */
    function getPercent(matches, attempts) {
      if (!attempts) return 0;
      return Math.round((matches / attempts) * 100);
    }

    function updateStatusBar() {
      $('#score').textContent   = state.matches;
      $('#attempts').textContent= state.attempts;
      $('#needed').textContent  = state.needed;
      $('#pct').textContent     = getPercent(state.matches, state.attempts);
    }

    /* ---------------------------------------------------------
       ROUND BUILDER
       --------------------------------------------------------- */
    function buildRound(count = 10) {
      // randomize pool order
      const pool = shuffle([...ALL_ITEMS]).slice(0, count);

      // update state
      state.activeItems = pool;
      state.matches = 0;
      state.attempts = 0;
      state.needed = pool.length;
      updateStatusBar();

      // split into two columns
      const firstHalf  = pool.slice(0, 5);
      const secondHalf = pool.slice(5);

      // render photos into col1 and col2
      const col1 = $('#col1');
      const col2 = $('#col2');

      col1.innerHTML = '';
      col2.innerHTML = '';

      firstHalf.forEach((item)  => addPhoto(col1, item));
      secondHalf.forEach((item) => addPhoto(col2, item));

      // render shuffled names
      const names = $('#names');
      names.innerHTML = '';
      shuffle([...pool]).forEach((item) => addName(names, item));

      // ensure modal is hidden (if user hit reset after finishing)
      $('#winModal').classList.add('hidden');
    }

    /* ---------------------------------------------------------
       BUILD PHOTO CARD
       --------------------------------------------------------- */
    function addPhoto(container, item) {
      const node = document.importNode($('#photo-card-tpl').content, true);
      const card = node.querySelector('.photoCard');
      const img  = node.querySelector('img');

      card.dataset.id = item.id;
      img.src  = item.img;
      img.alt  = item.label;

      addDropHandlers(card);

      container.appendChild(node);
    }

    /* ---------------------------------------------------------
       BUILD NAME CHIP
       --------------------------------------------------------- */
    function addName(container, item) {
      const chipFrag = document.importNode($('#name-chip-tpl').content, true);
      const chip = chipFrag.querySelector('.nameChip');

      chip.textContent = item.label;
      chip.dataset.id  = item.id;

      addDragHandlers(chip);

      container.appendChild(chipFrag);
    }

    /* ---------------------------------------------------------
       DRAG & DROP + TAP-TO-MATCH (mobile-friendly)
       --------------------------------------------------------- */
    function addDragHandlers(el) {
      el.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', el.dataset.id);
        // optional visual hint
        el.style.opacity = '0.75';
      });

      el.addEventListener('dragend', () => {
        el.style.opacity = '1';
      });

      // Tap-to-select (pending) for mobile
      el.addEventListener('click', () => {
        if (el.classList.contains('matched')) return;
        document.querySelectorAll('.nameChip.pending').forEach(c => c.classList.remove('pending'));
        el.classList.add('pending');
      });
    }

    function addDropHandlers(card) {
      const dropZone = card.querySelector('[data-dropzone]');

      // allow dropping
      dropZone.addEventListener('dragover', (e) => e.preventDefault());

      // handle drop
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();

        const id = e.dataTransfer.getData('text/plain');
        const chip = document.querySelector(`.nameChip[data-id="${CSS.escape(id)}"]:not(.matched)`);
        if (!chip) return;

        tryDrop(card, id, chip);
      });

      // Tap-to-match: if a chip is "pending", tap photo to try
      card.addEventListener('click', () => {
        const pending = document.querySelector('.nameChip.pending');
        if (!pending) return;
        tryDrop(card, pending.dataset.id, pending);
      });
    }

    function tryDrop(card, id, chip) {
      // increment attempts for any drop try (or tap-try)
      state.attempts++;
      const isCorrect = card.dataset.id === id;

      if (isCorrect) {
        const slot = card.querySelector('[data-dropzone]');
        slot.textContent = chip.textContent;

        chip.classList.add('matched');
        chip.classList.remove('pending');

        card.classList.add('locked');

        state.matches++;

        // update status bar after a successful try
        updateStatusBar();

        // win check
        if (state.matches === state.needed) {
          announceWin();
        }
      } else {
        // wrong
        chip.classList.remove('pending');
        flashWrong(card);

        // update status bar after a wrong try too
        updateStatusBar();
      }
    }

    function flashWrong(card) {
      card.classList.add('wrong');
      setTimeout(() => card.classList.remove('wrong'), 550);
    }

    /* ---------------------------------------------------------
       WIN OVERLAY & CONFETTI
       --------------------------------------------------------- */
    function announceWin() {
      // compute final percentage
      const scorePercent = getPercent(state.matches, state.attempts);

      // Fill modal badges
      $('#finalScore').textContent    = `Score: ${scorePercent}%`;
      $('#finalAttempts').textContent = `Attempts: ${state.attempts}`;

      // Show modal
      $('#winModal').classList.remove('hidden');

      // overlay confetti (multicolor rain)
      confettiRain();
    }

    function confettiRain() {
      for (let i = 0; i < 140; i++) {
        const dot = document.createElement('div');
        dot.className = 'confetti';

        // randomize horizontal start
        dot.style.left = Math.random() * 100 + 'vw';

        // random HSL color
        dot.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 55%)`;

        // random duration and delay
        dot.style.animationDuration = (Math.random() * 2 + 3) + 's';
        dot.style.animationDelay = (Math.random() * 0.5) + 's';

        // random rotation start
        dot.style.transform = `rotate(${Math.random() * 360}deg)`;

        document.body.appendChild(dot);

        // remove after animation finishes
        setTimeout(() => dot.remove(), 5000);
      }
    }

    /* ---------------------------------------------------------
       CONTROLS
       --------------------------------------------------------- */
    document.getElementById('newRound').addEventListener('click', () => buildRound(10));
    document.getElementById('reset').addEventListener('click',    () => buildRound(10));
    document.getElementById('playAgain').addEventListener('click', () => {
      document.getElementById('winModal').classList.add('hidden');
      buildRound(10);
    });

    /* ---------------------------------------------------------
       INIT
       --------------------------------------------------------- */
    buildRound(10);
  </script>

  <!-- =========================================================
       BACK BUTTON (outside main script)
       ========================================================= -->
  <button
    type="button"
    onclick="goBack()"
    class="back-button"
    aria-label="Go back"
  >
    <b>Back</b>
  </button>

  <br />

  <script>
    function goBack() {
      window.location.href = "../07_Sikh_Section_for_Kids.html";
    }
  </script>
</body>
</html>
