<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sikh Gurus Order Game</title>

  <style>
    :root {
      --kesari: #FF9933;
      --black: #000;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--black);
      color: var(--black);
    }

    .wrap {
      max-width: 1000px;
      margin: auto;
      padding: 8px;
      background: #ffffff;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    header {
      margin-bottom: 6px;
      text-align: center;
    }

    h1 {
      font-size: clamp(18px, 4vw, 26px);
      margin: 0;
    }

    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .col {
      background: #ffffff;
      padding: 4px;
      border-radius: 8px;
      border: 2px solid var(--black);
    }

    .slot,
    .draggable {
      height: 56px;
      border-radius: 8px;
      margin: 3px 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-size: 12px;
      transition: background 0.2s, border-color 0.2s;
      gap: 6px;
      padding: 4px;
    }

    .slot {
      border: 2px dashed var(--kesari);
      background: #fff5eb;
      font-weight: 600;
    }

    .slot.correct {
      background: #c8f7c5;
      border-color: #0a5d00;
    }

    .slot.wrong {
      background: #fde2e2;
      border-color: #cc0000;
    }

    .draggable {
      border: 2px solid var(--kesari);
      background: #fff5eb;
      cursor: grab;
    }

    .draggable[draggable="false"] {
      cursor: default;
    }

    .draggable img {
      height: 36px;
      width: auto;
      border-radius: 4px;
      flex: 0 0 auto;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      margin: 4px 0;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    #winOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 99;
      color: #ffffff;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 16px;
    }

    #winOverlay h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    #winOverlay p {
      margin: 0 0 10px;
      font-size: 14px;
    }

    #winOverlay button {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: var(--kesari);
      color: #000;
      font-weight: 700;
      cursor: pointer;
    }

    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
    }

    @media (max-width: 400px) {
      .slot,
      .draggable {
        height: 46px;
        font-size: 10px;
        padding: 2px 3px;
        gap: 5px;
      }

      .draggable img {
        height: 30px;
      }

      .label {
        font-size: 9px;
      }

      .status {
        font-size: 11px;
      }

      #winOverlay h2 {
        font-size: 18px;
      }

      #winOverlay p {
        font-size: 12px;
      }

      #winOverlay button {
        font-size: 12px;
        padding: 6px 12px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>
        Arrange Sikh Gurus in Order
      </h1>
      <p style="font-size:13px; margin:4px 0 0">
        Drag each Guru to the correct position (1 → 10). Correct slots turn green ✅
      </p>
    </header>

    <div class="status">
      Correct:
      <span id="correctCount">0</span>
      / 10 |
      Trials:
      <span id="trialCount">0</span>
    </div>

    <section class="board">
      <div class="col">
        <h3 style="font-size:14px; text-align:center; margin:4px 0">
          Correct Order
        </h3>
        <div id="slots"></div>
      </div>

      <div class="col">
        <h3 style="font-size:14px; text-align:center; margin:4px 0">
          Guru Images
        </h3>
        <div id="draggables"></div>
      </div>
    </section>
  </div>

  <div id="winOverlay">
    <h2>🎉 You Win! 🎉</h2>
    <p id="finalStats"></p>
    <button id="restartBtn">Play Again</button>
  </div>

  <canvas id="confetti"></canvas>

  <template id="slot-tpl">
    <div class="slot" data-order=""></div>
  </template>

  <template id="drag-tpl">
    <div class="draggable" draggable="true" data-id="">
      <img alt="" />
      <div class="label"></div>
    </div>
  </template>

  <script>
    const ALL_ITEMS = [
      {
        id: 'Guru1',
        order: 1,
        label: 'Guru Nanak Dev Ji',
        img: '../../../pictures/07_Sikh_Stories/Sikh_Gurus/01 Guru Nanak Dev Ji.jpg'
      },
      {
        id: 'Guru2',
        order: 2,
        label: 'Guru Angad Dev Ji',
        img: '../../../pictures/07_Sikh_Stories/Sikh_Gurus/02 Guru Angad Dev Ji.jpg'
      },
      {
        id: 'Guru3',
        order: 3,
        label: 'Guru Amar Das Ji',
        img: '../../../pictures/07_Sikh_Stories/Sikh_Gurus/03 Guru Amar Das Ji.jpg'
      },
      {
        id: 'Guru4',
        order: 4,
        label: 'Guru Ram Das Ji',
        img: '../../../pictures/07_Sikh_Stories/Sikh_Gurus/04 Guru Ram Das Ji.jpg'
      },
      {
        id: 'Guru5',
        order: 5,
        label: 'Guru Arjan Dev Ji',
        img: '../../../pictures/07_Sikh_Stories/Sikh_Gurus/05 Guru Arjan Dev Ji.jpg'
      },
      {
        id: 'Guru6',
        order: 6,
        label: 'Guru Har Gobind Ji',
        img: '../../../pictures/07_Sikh_Stories/Sikh_Gurus/06 Guru Har Gobind Singh Ji.jpg'
      },
      {
        id: 'Guru7',
        order: 7,
        label: 'Guru Har Rai Ji',
        img: '../../../pictures/07_Sikh_Stories/Sikh_Gurus/07 Guru Har Rai Ji.jpg'
      },
      {
        id: 'Guru8',
        order: 8,
        label: 'Guru Har Krishan Ji',
        img: '../../../pictures/07_Sikh_Stories/Sikh_Gurus/08 Shri Guru Harkrishan Ji.jpg'
      },
      {
        id: 'Guru9',
        order: 9,
        label: 'Guru Tegh Bahadur Ji',
        img: '../../../pictures/07_Sikh_Stories/Sikh_Gurus/09 Shri Guru Teg Bahadur Ji.jpg'
      },
      {
        id: 'Guru10',
        order: 10,
        label: 'Guru Gobind Singh Ji',
        img: '../../../pictures/07_Sikh_Stories/Sikh_Gurus/10 Shri Guru Gobind Singh Ji.jpg'
      }
    ];

    const slots = document.getElementById('slots');
    const pool = document.getElementById('draggables');
    const correctEl = document.getElementById('correctCount');
    const trialsEl = document.getElementById('trialCount');
    const overlay = document.getElementById('winOverlay');
    const finalStats = document.getElementById('finalStats');
    const restartBtn = document.getElementById('restartBtn');

    let correct = 0;
    let trials = 0;

    function build() {
      slots.innerHTML = '';
      pool.innerHTML = '';
      correct = 0;
      trials = 0;
      correctEl.textContent = 0;
      trialsEl.textContent = 0;
      overlay.style.display = 'none';
      stopConfetti();

      for (let i = 1; i <= 10; i++) {
        const frag = document.importNode(document.getElementById('slot-tpl').content, true);
        const el = frag.querySelector('.slot');
        el.dataset.order = i;
        el.textContent = i;

        el.addEventListener('dragover', (e) => e.preventDefault());
        el.addEventListener('drop', onDrop);

        slots.appendChild(frag);
      }

      [...ALL_ITEMS]
        .sort(() => Math.random() - 0.5)
        .forEach(item => {
          const frag = document.importNode(document.getElementById('drag-tpl').content, true);
          const d = frag.querySelector('.draggable');
          const img = frag.querySelector('img');
          const lab = frag.querySelector('.label');

          d.dataset.id = item.id;
          d.dataset.order = item.order;
          img.src = item.img;
          img.alt = item.label;
          lab.textContent = item.label;

          d.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', d.dataset.id);
            e.dataTransfer.effectAllowed = 'move';
          });

          pool.appendChild(frag);
        });
    }

    function onDrop(e) {
      e.preventDefault();
      const slot = e.currentTarget;
      const id = e.dataTransfer.getData('text/plain');
      const card = document.querySelector(`.draggable[data-id="${CSS.escape(id)}"]`);
      if (!card) return;

      trials++;
      trialsEl.textContent = trials;

      if (slot.classList.contains('correct')) {
        flashWrong(slot);
        return;
      }

      const ok = +card.dataset.order === +slot.dataset.order;

      if (ok) {
        slot.innerHTML = '';
        slot.appendChild(card);
        slot.classList.add('correct');
        card.setAttribute('draggable', 'false');
        correct++;
        correctEl.textContent = correct;

        if (correct === 10) win();
      } else {
        flashWrong(slot);
        pool.appendChild(card);
      }
    }

    function flashWrong(slot) {
      slot.classList.add('wrong');
      setTimeout(() => slot.classList.remove('wrong'), 350);
    }

    function win() {
      const score = ((10 / Math.max(trials, 10)) * 100).toFixed(1);
      finalStats.textContent = `Trials: ${trials} | Score: ${score}%`;
      overlay.style.display = 'flex';
      startConfetti();
    }

    restartBtn.addEventListener('click', build);

    const cvs = document.getElementById('confetti');
    const ctx = cvs.getContext('2d');
    let parts = [];
    let raf;

    function size() {
      cvs.width = innerWidth;
      cvs.height = innerHeight;
    }

    addEventListener('resize', size);
    size();

    function startConfetti() {
      parts = Array.from({ length: 140 }, () => ({
        x: Math.random() * cvs.width,
        y: Math.random() * -cvs.height,
        r: 2 + Math.random() * 4,
        vy: 1 + Math.random() * 3,
        vx: (Math.random() - 0.5) * 1.5,
        c: `hsl(${Math.random() * 360},100%,50%)`
      }));
      loop();
    }

    function stopConfetti() {
      cancelAnimationFrame(raf);
      ctx.clearRect(0, 0, cvs.width, cvs.height);
    }

    function loop() {
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      for (const p of parts) {
        ctx.fillStyle = p.c;
        ctx.fillRect(p.x, p.y, p.r, p.r);
        p.y += p.vy;
        p.x += p.vx;
        if (p.y > cvs.height) {
          p.y = -10;
          p.x = Math.random() * cvs.width;
        }
      }
      raf = requestAnimationFrame(loop);
    }

    build();
  </script>
</body>

</html>
