<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FormSubmit Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 60px auto;
      padding: 0 20px;
    }
    h1 { font-size: 20px; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    .form-row { display: flex; gap: 10px; }
    .form-row .col { flex: 1; }
    .form-control {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: inherit;
    }
    textarea.form-control { resize: vertical; }
    .btn-block { width: 100%; }
    .btn {
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-dark { background: #0d1b3e; color: #fff; }
    .btn-dark:hover { filter: brightness(1.2); }
  </style>
</head>
<body>

<div class="container">
  <h1>FormSubmit Demo</h1>
  <!-- Change the destination email below before testing. FormSubmit requires a
       one-time confirmation click from THAT address the first time it's used
       (or the first time a NEW destination is used) before it delivers anything. -->
  <form target="_blank" action="https://formsubmit.co/sikhsinindia@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="FormSubmit test message">
    <input type="hidden" name="_captcha" value="false">
    <div class="form-group">
      <div class="form-row">
        <div class="col">
          <input type="text" name="name" class="form-control" placeholder="Full Name" required>
        </div>
        <div class="col">
          <input type="email" name="email" class="form-control" placeholder="Email Address" required>
        </div>
      </div>
    </div>
    <div class="form-group">
      <textarea placeholder="Your Message" class="form-control" name="message" rows="10" required></textarea>
    </div>
    <button type="submit" class="btn btn-lg btn-dark btn-block">Submit Form</button>
  </form>
</div>

</body>
</html>
