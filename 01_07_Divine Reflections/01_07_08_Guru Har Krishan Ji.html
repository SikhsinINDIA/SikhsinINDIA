<body>

  <header>

  <section id="guru-angad-section">
    <h2 class="guru-title">Guru Har Krishan Ji</h2>
    <div class="gallery" style="flex-direction: column; align-items: center;">
      <div class="card" style="width: 300px;">
        <img id="guruHarKrishanImg" alt="Guru Nanak Dev Ji" />
        <p id="guruHarKrishanCaption"></p>
      </div>

      <div style="margin-top: 1rem;">
        <button class="button" onclick="prevImage()">&#9664; Previous</button>
        <button class="button" onclick="nextImage()">Next &#9654;</button>

<script>
  const guruHarKrishanPhotos = [
{ src: "../pictures/01_07_Divine Reflections/08_Guru Har Krishan Ji/01-Guru HarKrishan Sahib at Gurdwara Bangla Sahib.jpg", caption: "Guru Har Krishan Sahib at Gurdwara Bangla Sahib" },
{ src: "../pictures/01_07_Divine Reflections/08_Guru Har Krishan Ji/02-Guru HarKrishan Sahib ji.jpg", caption: "Guru Har Krishan Sahib Ji" },
{ src: "../pictures/01_07_Divine Reflections/08_Guru Har Krishan Ji/03-Guru HarKrishan Ji blesses the suffering.jpg", caption: "Guru Har Krishan Ji blesses the suffering" },
{ src: "../pictures/01_07_Divine Reflections/08_Guru Har Krishan Ji/04-Guru HarKrishan Ji curing the sick.jpg", caption: "Guru Har Krishan Ji curing the sick" },
{ src: "../pictures/01_07_Divine Reflections/08_Guru Har Krishan Ji/05-Guru HarKrishan Ji spots Queen.jpg", caption: "Guru Har Krishan Ji spots Queen" },
{ src: "../pictures/01_07_Divine Reflections/08_Guru Har Krishan Ji/06-Guru HarKrishan Sahib Ji discoursing.jpg", caption: "Guru Har Krishan Sahib Ji discoursing" },

];


  let currentIndex = 0;

  function showImage(index) {
    const img = document.getElementById("guruHarKrishanImg");
    const caption = document.getElementById("guruHarKrishanCaption");

    img.src = guruHarKrishanPhotos[index].src;
    caption.textContent =  guruHarKrishanPhotos[index].caption ;
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % guruHarKrishanPhotos.length;
    showImage(currentIndex);
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + guruHarKrishanPhotos.length) % guruHarKrishanPhotos.length;
    showImage(currentIndex);
  }
  document.addEventListener("DOMContentLoaded", () => showImage(0));
</script>
