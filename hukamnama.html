<script>
(function () {
  'use strict';

  var DATA_URL = 'data/hukamnama.json';
  var mount = document.getElementById('hnMount');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function render(d) {
    var lines = (d.verses || []).map(function (v) {
      return '<div class="hn-line">' +
        '<div class="hn-gurmukhi">' + esc(v.gurmukhi) + '</div>' +
        (v.translation ? '<div class="hn-translation">' + esc(v.translation) + '</div>' : '') +
        '</div>';
    }).join('');

    mount.innerHTML =
      '<div class="hn-card">' +
        '<div class="hn-card-head">' +
          '<div class="hn-sub">' + esc(d.raagEnglish) +
            (d.writerEnglish ? ' &middot; ' + esc(d.writerEnglish) : '') + '</div>' +
          '<div class="hn-date">' + esc(d.dateDisplay) + '</div>' +
        '</div>' +
        '<div class="hn-meta">' +
          '<span class="hn-meta-chip">Ang ' + esc(d.ang) + '</span>' +
        '</div>' +
        '<div class="hn-body">' + (lines || '<p class="hn-none">No Hukamnama available right now.</p>') + '</div>' +
        '<div class="hn-note">Gurbani text and English translation via BaniDB, an open Sri Guru Granth Sahib Ji database.</div>' +
      '</div>';
  }

  function fail() {
    mount.innerHTML = '<div class="hn-card"><div class="hn-body">' +
      '<p class="hn-none">This feature is briefly unavailable. Please try again shortly.</p></div></div>';
  }

  /* data/hukamnama.js sets this. Using it avoids fetch(), which browsers
     block when the page is opened straight from disk (file://). */
  if (window.HUKAMNAMA && window.HUKAMNAMA.verses && window.HUKAMNAMA.verses.length) {
    render(window.HUKAMNAMA);
  } else {
    fetch(DATA_URL, { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(render)
      .catch(function (err) {
        console.error('Hukamnama page: could not load ' + DATA_URL, err);
        fail();
      });
  }
})();
</script>

<script>
  (function () {
    var canonicalElem = document.querySelector('link[rel="canonical"]');
    var liveUrl = (window.location.protocol.indexOf('http') === 0)
      ? window.location.href
      : (canonicalElem ? canonicalElem.href : 'https://sikhsinindia.com');

    var rawTitle = document.title;
    var pageUrlEnc = encodeURIComponent(liveUrl);
    var pageTitleEnc = encodeURIComponent(rawTitle);

    var gsbWa = document.getElementById('gsbWhatsappShare');
    if (gsbWa) gsbWa.addEventListener('click', function () {
      window.open('https://api.whatsapp.com/send?text=' + pageTitleEnc + '%20' + pageUrlEnc, '_blank', 'noopener,noreferrer');
    });

    var gsbFb = document.getElementById('gsbFacebookShare');
    if (gsbFb) gsbFb.addEventListener('click', function () {
      window.open('https://www.facebook.com/sharer/sharer.php?u=' + pageUrlEnc, '_blank', 'noopener,noreferrer,width=600,height=400');
    });

    var gsbIg = document.getElementById('gsbInstagramShare');
    if (gsbIg) gsbIg.addEventListener('click', function () {
      if (navigator.share) {
        navigator.share({ title: rawTitle, url: liveUrl }).catch(function () {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(liveUrl).then(function () {
          alert('Link copied to clipboard!\n\nYou can now paste it into Instagram or any app.');
        }).catch(function () { alert('Share URL: ' + liveUrl); });
      } else {
        alert('Share URL: ' + liveUrl);
      }
    });
  })();
</script>
