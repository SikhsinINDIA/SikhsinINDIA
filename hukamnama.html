    .hn-gurmukhi {

<script src="data/hukamnama.js"></script>
<script>
(function () {
  'use strict';

  var DATA_URL = 'data/hukamnama.json';
  var mount = document.getElementById('hnMount');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function render(d) {
    var lines = (d.verses || []).map(function (v) {
      return '<div class="hn-line">' +
        '<div class="hn-gurmukhi">' + esc(v.gurmukhi) + '</div>' +
        (v.translation ? '<div class="hn-translation">' + esc(v.translation) + '</div>' : '') +
        '</div>';
    }).join('');

    mount.innerHTML =
      '<div class="hn-card">' +
        '<div class="hn-card-head">' +
          '<div class="hn-sub">' + esc(d.raagEnglish) +
            (d.writerEnglish ? ' &middot; ' + esc(d.writerEnglish) : '') + '</div>' +
          '<div class="hn-date">' + esc(d.dateDisplay) + '</div>' +
        '</div>' +
        '<div class="hn-meta">' +
          '<span class="hn-meta-chip">Ang ' + esc(d.ang) + '</span>' +
        '</div>' +
        '<div class="hn-body">' + (lines || '<p class="hn-none">No Hukamnama available right now.</p>') + '</div>' +
        '<div class="hn-note">Gurbani text and English translation via BaniDB, an open Sri Guru Granth Sahib Ji database.</div>' +
      '</div>';
  }

  function fail() {
    mount.innerHTML = '<div class="hn-card"><div class="hn-body">' +
      '<p class="hn-none">This feature is briefly unavailable. Please try again shortly.</p></div></div>';
  }

  /* data/hukamnama.js sets this. Using it avoids fetch(), which browsers
     block when the page is opened straight from disk (file://). */
  if (window.HUKAMNAMA && window.HUKAMNAMA.verses && window.HUKAMNAMA.verses.length) {
    render(window.HUKAMNAMA);
  } else {
    fetch(DATA_URL, { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(render)
      .catch(function (err) {
        console.error('Hukamnama page: could not load ' + DATA_URL, err);
        fail();
      });
  }
})();
</script>
