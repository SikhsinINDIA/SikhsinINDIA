<!DOCTYPE html>
<html lang="en">
<head>

     <!-- Meta description -->
  <meta name="description" content="Explore the rich Sikh heritage in India, including traditions, Gurudwaras, teachings of Guru Nanak, Guru Gobind Singh, Sikh scriptures like Japji Sahib and Guru Granth Sahib Ji.">

  <!-- Meta keywords -->
  <meta name="keywords" content="Sikhs in India, Sikh Heritage, traditions, Gurdwaras, Guru Nanak, Guru Gobind, Guru Tegh, Japji Sahib, Rehras Sahib, Guru Granth Sahib Ji, Waheguru">

  <!-- Author -->
  <meta name="author" content="Sikhs in India">

  <!-- Robots -->
  <meta name="robots" content="index, follow">

  <!-- Open Graph meta tags for social media -->
  <meta property="og:title" content="Sikh Heritage & Traditions | Gurudwaras, Guru Nanak & Sikh Scriptures">
  <meta property="og:description" content="Explore the rich Sikh heritage in India, including traditions, Gurudwaras, teachings of Guru Nanak, Guru Gobind Singh, Sikh scriptures like Japji Sahib and Guru Granth Sahib Ji, Sikh Gurus Attributes Game">
  <meta property="og:image" content="https://sikhsinindia.com/sikhsinindia.jpg">
  <meta property="og:url" content="https://sikhsinindia.com">
  <meta property="og:type" content="website">

  
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- <title>Sikh Gurus Attributes Game</title> -->
  <style>
    /* =========================================================
       THEME VARIABLES
       ========================================================= */
    :root {
      --kesari: #FF9933;
      --black:  #000000;
      --ink:    #1f2937;
      --paper:  #ffffff;
      --peel:   #fff5eb;
      --ok:     #c8f7c5;
      --ok-ink: #0a5d00;
      --bad:    #fde2e2;
      --bad-ink:#cc0000;
    }

    /* =========================================================
       GLOBAL RESET
       ========================================================= */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--black);
      color: var(--black);
    }

    /* =========================================================
       PAGE WRAPPER
       ========================================================= */
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px;
      background: var(--paper);
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* =========================================================
       HEADER
       ========================================================= */
    header {
      display: grid;
      gap: 6px;
      margin-bottom: 8px;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: var(--black);
      font-size: clamp(20px, 4.5vw, 28px);
      line-height: 1.2;
    }

    .sub {
      color: var(--ink);
      font-size: 13px;
    }

    /* =========================================================
       STATUS + CONTROLS
       ========================================================= */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 6px 0 10px 0;
      color: var(--black);
      font-weight: 700;
      font-size: 14px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--kesari);
    }

    .btn {
      border: 2px solid var(--black);
      background: var(--paper);
      color: var(--black);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s ease, color .2s ease;
    }

    .btn.primary {
      background: var(--kesari);
      color: var(--black);
    }

    .btn:hover {
      background: var(--black);
      color: #fff;
    }

    /* =========================================================
       BOARD LAYOUT
       ========================================================= */
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    .col {
      padding: 6px;
      border-radius: 10px;
      border: 2px solid var(--black);
      background: var(--paper);
      min-width: 0;
    }

    .col h3 {
      margin: 0 0 6px 0;
      text-align: center;
      font-size: 14px;
      color: var(--ink);
    }

    /* =========================================================
       SLOTS & CARDS
       ========================================================= */
    .slots {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pool {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slot,
    .card {
      height: 56px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      padding: 0;
      margin: 2px 0;
      font-size: 12px;
      transition: background .18s ease, border-color .18s ease, outline .12s ease, box-shadow .12s ease;
      overflow: hidden;
    }

    .slot {
      border: 2px dashed var(--kesari);
      background: var(--peel);
      font-weight: 800;
      color: var(--black);
      user-select: none;
      padding-right: 6px;
    }

    .slot.correct {
      background: var(--ok);
      border-color: var(--ok-ink);
    }

    .slot.wrong {
      background: var(--bad);
      border-color: var(--bad-ink);
    }

    .slot .slot-index {
      min-width: 22px;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 0 6px;
      background: var(--kesari);
      color: var(--black);
      font-size: 12px;
      font-weight: 900;
      border-right: 1px solid var(--black);
      user-select: none;
    }

    .slot .slot-attr {
      font-size: 12px;
      font-weight: 800;
      color: var(--ink);
      opacity: 0.95;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
      padding-left: 6px;
      flex: 1;
    }

    .card {
      border: 2px solid var(--kesari);
      background: var(--peel);
      cursor: grab;
      user-select: none;
    }

    .card[draggable="false"] {
      cursor: default;
    }

    .card.pending {
      outline: 3px dashed var(--kesari);
      outline-offset: 2px;
      background: #ffe7c6;
      box-shadow: 0 0 0 2px rgba(255,153,51,.18) inset;
    }

    .card img {
      height: 100%;
      width: auto;
      display: block;
      flex: 0 0 auto;
      border-right: 1px solid var(--kesari);
      background: #fff;
    }

    .card .label {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--black);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================================================
       WIN OVERLAY + CONFETTI
       ========================================================= */
    #winOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 9999;
      color: #fff;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 16px;
    }

    #winOverlay .box {
      background: #fff;
      color: var(--black);
      border: 2px solid var(--black);
      border-radius: 14px;
      padding: 18px 20px;
      max-width: 460px;
      width: calc(100% - 32px);
    }

    #winOverlay h2 {
      margin: 0 0 8px 0;
      font-size: 22px;
    }

    #winOverlay .stats {
      margin: 10px 0 14px 0;
      border: 1.5px dashed var(--black);
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 700;
      line-height: 1.5;
      text-align: left;
    }

    #winOverlay .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    #winOverlay .actions .btn {
      background: var(--kesari);
      color: var(--black);
    }

    #confetti {
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
    }

    /* =========================================================
       MOBILE OPTIMIZATION
       ========================================================= */
    @media (max-width: 700px) {
      .board {
        gap: 6px;
      }

      .slot,
      .card {
        height: 46px;
        font-size: 11px;
      }

      .slot .slot-index {
        min-width: 22px;
        font-size: 11px;
      }

      .card .label {
        font-size: 12px;
        padding: 0 6px;
      }

      header .sub {
        font-size: 12px;
      }

      .topbar {
        font-size: 12px;
        gap: 10px;
      }

      #winOverlay h2 {
        font-size: 18px;
      }

      #winOverlay .stats {
        font-size: 13px;
      }
    }

    @media (max-width: 480px) {
      .board {
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }

      .col {
        padding: 4px;
      }

      .slot,
      .card {
        height: 44px;
      }

      .card .label {
        font-size: 11px;
        padding: 0 5px;
      }
    }

    /* =========================================================
       BACK BUTTON
       ========================================================= */
    .back-button {
      width: 80%;
      max-width: 200px;
      height: 45px;
      font-size: 18px;
      background-color: #FFA500;
      color: black;
      margin: 40px auto 0 auto;
      display: block;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .back-button:hover {
      background-color: #FF8C00;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- =======================================================
         HEADER
         ======================================================= -->
    <header>
      <h1>Match Sikh Gurus with Their Attributes</h1>
      <div class="sub">Drag or tap a Guru card onto the attribute it best represents. Both lists are randomized every round.</div>
    </header>

    <!-- =======================================================
         STATUS + CONTROLS
         ======================================================= -->
    <div class="topbar" role="status" aria-live="polite">
      <div class="dot" aria-hidden="true"></div>
      <div>Correct: <span id="correctCount">0</span> / 10</div>
      <div>| Trials: <span id="trialCount">0</span></div>
      <div>| Score: <span id="scorePct">0%</span></div>
      <button id="btnReset" class="btn" type="button">Reset</button>
      <button id="btnShuffle" class="btn primary" type="button">New Round</button>
    </div>

    <!-- =======================================================
         BOARD
         ======================================================= -->
    <section class="board" aria-label="Match Gurus to attributes">
      <!-- LEFT: ATTRIBUTE SLOTS -->
      <div class="col">
        <h3>Attributes</h3>
        <div id="slots" class="slots"></div>
      </div>

      <!-- RIGHT: GURU CARDS -->
      <div class="col">
        <h3>Guru Cards</h3>
        <div id="pool" class="pool"></div>
      </div>
    </section>
  </div>

  <!-- =========================================================
       WIN OVERLAY
       ========================================================= -->
  <div id="winOverlay" role="dialog" aria-modal="true" aria-labelledby="winHeading">
    <div class="box">
      <h2 id="winHeading">🎉 You Matched Them All! 🎉</h2>
      <div class="stats">
        <div><strong>Correct:</strong> <span id="finalCorrect">10</span> / 10</div>
        <div><strong>Trials:</strong> <span id="finalTrials">0</span></div>
        <div><strong>Score:</strong> <span id="finalScore">100%</span></div>
      </div>
      <div class="actions">
        <button id="playAgain" class="btn" type="button">Play Again</button>
      </div>
    </div>
  </div>

  <!-- =========================================================
       CONFETTI CANVAS
       ========================================================= -->
  <canvas id="confetti"></canvas>

  <!-- =========================================================
       TEMPLATES
       ========================================================= -->
  <template id="slot-tpl">
    <div class="slot" data-id="" tabindex="0" aria-label="Attribute slot">
      <div class="slot-index" aria-hidden="true">1</div>
      <div class="slot-attr">Attribute</div>
    </div>
  </template>

  <template id="card-tpl">
    <div class="card" draggable="true" data-id="" tabindex="0" role="button" aria-label="Guru card">
      <img alt="" src="" />
      <div class="label">Guru Name</div>
    </div>
  </template>

  <!-- =========================================================
       SCRIPT
       ========================================================= -->
  <script>
    /* ---------------------------------------------------------
       DATA (GURU ↔ ATTRIBUTE)
       --------------------------------------------------------- */
    const ALL_ITEMS = [
      {
        id:    'Guru1',
        label: 'Guru Nanak Dev Ji',
        attr:  'Humility',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/01-guru-nanak-dev-ji.jpg'
      },
      {
        id:    'Guru2',
        label: 'Guru Angad Dev Ji',
        attr:  'Obedience',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/02-guru-angad-dev-ji.jpg'
      },
      {
        id:    'Guru3',
        label: 'Guru Amar Das Ji',
        attr:  'Equality',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/03-guru-amar-das-ji.jpg'
      },
      {
        id:    'Guru4',
        label: 'Guru Ram Das Ji',
        attr:  'Service',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/04-guru-ram-das-ji.jpg'
      },
      {
        id:    'Guru5',
        label: 'Guru Arjan Dev Ji',
        attr:  'Self-Sacrifice',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/05-guru-arjan-dev-ji.jpg'
      },
      {
        id:    'Guru6',
        label: 'Guru Hargobind Ji',
        attr:  'Justice',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/06-guru-har-gobind-singh-ji.jpg'
      },
      {
        id:    'Guru7',
        label: 'Guru Har Rai Ji',
        attr:  'Mercy',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/07-guru-har-rai-ji.jpg'
      },
      {
        id:    'Guru8',
        label: 'Guru Harkrishan Ji',
        attr:  'Purity',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/08-shri-guru-harkrishan-ji.jpg'
      },
      {
        id:    'Guru9',
        label: 'Guru Tegh Bahadur Ji',
        attr:  'Tranquility',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/09-shri-guru-teg-bahadur-ji.jpg'
      },
      {
        id:    'Guru10',
        label: 'Guru Gobind Singh Ji',
        attr:  'Royal Courage',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/10-shri-guru-gobind-singh-ji.jpg'
      }
    ];

    /* ---------------------------------------------------------
       DOM ELEMENTS
       --------------------------------------------------------- */
    const slotsEl        = document.getElementById('slots');
    const poolEl         = document.getElementById('pool');

    const correctEl      = document.getElementById('correctCount');
    const trialsEl       = document.getElementById('trialCount');
    const scorePctEl     = document.getElementById('scorePct');

    const btnReset       = document.getElementById('btnReset');
    const btnShuffle     = document.getElementById('btnShuffle');

    const winOverlay     = document.getElementById('winOverlay');
    const playAgainBtn   = document.getElementById('playAgain');

    const finalCorrectEl = document.getElementById('finalCorrect');
    const finalTrialsEl  = document.getElementById('finalTrials');
    const finalScoreEl   = document.getElementById('finalScore');

    const confettiCanvas = document.getElementById('confetti');
    const ctx            = confettiCanvas.getContext('2d');

    /* ---------------------------------------------------------
       STATE
       --------------------------------------------------------- */
    let correct      = 0;
    let trials       = 0;
    let pendingId    = null;   // for tap-to-place
    let confettiAF   = null;   // requestAnimationFrame handle
    let confettiBits = [];     // particles

    /* ---------------------------------------------------------
       HELPERS
       --------------------------------------------------------- */
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function updateStatus() {
      correctEl.textContent = String(correct);
      trialsEl.textContent  = String(trials);
      const denom           = Math.max(trials, 10);
      const scorePct        = ((correct / denom) * 100).toFixed(1);
      scorePctEl.textContent = `${scorePct}%`;
    }

    function clearPending() {
      if (!pendingId) return;
      const el = document.querySelector(`.card[data-id="${CSS.escape(pendingId)}"]`);
      if (el) {
        el.classList.remove('pending');
      }
      pendingId = null;
    }

    function flashWrong(slot) {
      slot.classList.add('wrong');
      setTimeout(() => slot.classList.remove('wrong'), 300);
    }

    /* ---------------------------------------------------------
       BUILD GAME
       --------------------------------------------------------- */
    function buildGame() {
      // Reset UI
      slotsEl.innerHTML = '';
      poolEl.innerHTML  = '';

      // Reset state
      correct   = 0;
      trials    = 0;
      pendingId = null;
      updateStatus();

      // Hide overlay + stop confetti
      hideWinOverlay();
      stopConfetti();

      // Randomize slots and cards independently
      const slotItems = shuffle([...ALL_ITEMS]);
      const cardItems = shuffle([...ALL_ITEMS]);

      // Build 10 ATTRIBUTE SLOTS (randomized order)
      slotItems.forEach((item, idx) => {
        const frag = document.importNode(document.getElementById('slot-tpl').content, true);
        const slot = frag.querySelector('.slot');
        const idxEl = frag.querySelector('.slot-index');
        const attrEl = frag.querySelector('.slot-attr');

        // dataset + a11y
        slot.dataset.id = item.id;
        slot.setAttribute('aria-label', `Attribute slot: ${item.attr}`);
        idxEl.textContent = String(idx + 1);
        attrEl.textContent = item.attr;

        // drag-over support
        slot.addEventListener('dragover', (e) => {
          e.preventDefault();
        });

        // drop support
        slot.addEventListener('drop', (e) => {
          e.preventDefault();
          const id = e.dataTransfer.getData('text/plain');
          const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
          if (!card) return;
          attemptPlace(card, slot);
        });

        // tap-to-place support
        slot.addEventListener('click', () => {
          if (!pendingId) return;
          const card = document.querySelector(`.card[data-id="${CSS.escape(pendingId)}"]`);
          if (!card) {
            clearPending();
            return;
          }
          attemptPlace(card, slot);
        });

        // keyboard: Enter/Space to place selected
        slot.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            if (!pendingId) return;
            const card = document.querySelector(`.card[data-id="${CSS.escape(pendingId)}"]`);
            if (!card) {
              clearPending();
              return;
            }
            attemptPlace(card, slot);
          }
        });

        slotsEl.appendChild(frag);
      });

      // Build GURU CARDS (randomized order)
      cardItems.forEach((item) => {
        const frag = document.importNode(document.getElementById('card-tpl').content, true);
        const card = frag.querySelector('.card');
        const img  = frag.querySelector('img');
        const lab  = frag.querySelector('.label');

        // dataset
        card.dataset.id = item.id;

        // content
        img.src = item.img;
        img.alt = item.label;
        lab.textContent = item.label;

        // a11y
        card.setAttribute('aria-label', item.label);

        // drag start
        card.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', card.dataset.id);
          e.dataTransfer.effectAllowed = 'move';
          clearPending();
        });

        // tap / click select toggle
        card.addEventListener('click', () => {
          if (card.getAttribute('draggable') === 'false') return;
          if (pendingId === card.dataset.id) {
            clearPending();
          } else {
            clearPending();
            pendingId = card.dataset.id;
            card.classList.add('pending');
          }
        });

        // keyboard: Enter/Space select
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            card.click();
          }
        });

        poolEl.appendChild(frag);
      });

      // Clicking empty pool area clears pending (once)
      poolEl.addEventListener('click', (e) => {
        if (!e.target.closest('.card')) {
          clearPending();
        }
      }, { once: true });
    }

    /* ---------------------------------------------------------
       ATTEMPT PLACE (shared by drag & tap)
       --------------------------------------------------------- */
    function attemptPlace(card, slot) {
      // Every attempt counts
      trials++;
      updateStatus();

      // If slot already locked, reject
      if (slot.classList.contains('correct')) {
        flashWrong(slot);
        clearPending();
        return;
      }

      // Determine correctness via id match
      const targetId = slot.dataset.id;
      const cardId   = card.dataset.id;
      const isCorrect = (targetId === cardId);

      if (isCorrect) {
        // Lock slot: keep index + attribute label, append card at end
        slot.classList.add('correct');
        card.setAttribute('draggable', 'false');
        card.classList.remove('pending');

        // Remove any card already inside slot (shouldn't happen here)
        const existing = slot.querySelector('.card');
        if (existing) {
          poolEl.appendChild(existing);
        }

        slot.appendChild(card);

        // Increase correct count
        correct++;
        updateStatus();

        // Check win condition
        if (correct === ALL_ITEMS.length) {
          showWinOverlay();
        }
      } else {
        // wrong => visual feedback and bounce back
        flashWrong(slot);
        poolEl.appendChild(card);
      }

      // clear pending highlight
      clearPending();
    }

    /* ---------------------------------------------------------
       CONTROLS
       --------------------------------------------------------- */
    btnReset.addEventListener('click', () => {
      buildGame();
    });

    btnShuffle.addEventListener('click', () => {
      buildGame();
    });

    playAgainBtn.addEventListener('click', () => {
      buildGame();
    });

    /* ---------------------------------------------------------
       WIN OVERLAY + SCORE
       --------------------------------------------------------- */
    function showWinOverlay() {
      const safeTrials = Math.max(trials, 10);
      const scorePct   = ((correct / safeTrials) * 100).toFixed(1);

      finalCorrectEl.textContent = String(correct);
      finalTrialsEl.textContent  = String(trials);
      finalScoreEl.textContent   = `${scorePct}%`;

      winOverlay.style.display = 'flex';

      startConfetti();
    }

    function hideWinOverlay() {
      winOverlay.style.display = 'none';
    }

    /* ---------------------------------------------------------
       CONFETTI
       --------------------------------------------------------- */
    function sizeConfetti() {
      confettiCanvas.width  = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }

    function startConfetti() {
      sizeConfetti();
      confettiBits = Array.from({ length: 180 }, () => ({
        x:  Math.random() * confettiCanvas.width,
        y:  Math.random() * -confettiCanvas.height,
        r:  2 + Math.random() * 4,
        vy: 1 + Math.random() * 3,
        vx: (Math.random() - 0.5) * 1.5,
        c:  `hsl(${Math.random() * 360}, 100%, 50%)`
      }));
      loopConfetti();
    }

    function stopConfetti() {
      if (confettiAF) {
        cancelAnimationFrame(confettiAF);
        confettiAF = null;
      }
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }

    function loopConfetti() {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      for (const p of confettiBits) {
        ctx.fillStyle = p.c;
        ctx.fillRect(p.x, p.y, p.r, p.r);
        p.y += p.vy;
        p.x += p.vx;
        if (p.y > confettiCanvas.height) {
          p.y = -10;
          p.x = Math.random() * confettiCanvas.width;
        }
      }
      confettiAF = requestAnimationFrame(loopConfetti);
    }

    window.addEventListener('resize', sizeConfetti);

    /* ---------------------------------------------------------
       INIT
       --------------------------------------------------------- */
    buildGame();
  </script>
