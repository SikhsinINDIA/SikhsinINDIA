<!DOCTYPE html>
<html lang="en">

<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-LHNTFNW14H');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>Sikhs in India | Admin Login</title>

  <meta name="description"
    content="Explore the rich Sikh heritage in India, including traditions, Gurudwaras, teachings of Guru Nanak, Guru Gobind Singh, Sikh scriptures like Japji Sahib and Guru Granth Sahib Ji.">
  <meta name="keywords" content="Sikhs in India, Sikh Heritage, traditions, Gurdwaras, Guru Nanak, Guru Gobind, Guru Tegh, Japji Sahib, Rehras Sahib, Guru Granth Sahib Ji, Waheguru">
  <meta name="author" content="Sikhs in India">
  <meta name="robots" content="index, follow">

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap"
    rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --navy: #0d1b3e;
      --navy-mid: #162147;
      --gold: #F7941D;
      --cream: #f5f0e8;
      --gold-light: #F7941D;
      --white: #ffffff;
    }

    /* PAGE BACKGROUND */
    body {
      font-family: 'Lato', sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      padding: 20px 8px;
    }

    /* MAIN CONTAINER */
    .poster {
      width: 100%;
      max-width: 860px;
      background: var(--cream);
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      overflow: hidden;
    }

    /* HEADER WITH LOGO */
    .header {
      display: flex;
      background: var(--navy);
      position: relative;
    }

    .logo-wrap {
      padding: 16px 20px;
    }

    .logo-img {
      height: 90px;
      background: #fff;
      padding: 4px;
      border-radius: 6px;
    }

    .hero {
      flex: 1;
      text-align: center;
      padding: 28px;
      background: linear-gradient(160deg, var(--navy), #1a2a5e);
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 6vw, 54px);
      font-weight: 900;
      color: #fff;
    }

    .hero-title span {
      color: var(--gold);
    }

    .hero-sub {
      color: rgba(255, 255, 255, .75);
      margin-top: 6px;
      font-style: italic;
    }

    /* GOLD BAR */
    .intro {
      background: linear-gradient(90deg, var(--gold), #ffb347, var(--gold));
      padding: 14px 20px;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--navy);
      font-size: 14px;
      text-align: center;
    }

    /* MAIN WRAPPER */
    .wrapper {
      padding: 28px 36px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--navy);
      text-align: center;
      font-size: 34px;
      margin-bottom: 24px;
    }

    /* LOGIN CONTAINER (STYLED LIKE SETUP-CONTAINER) */
    .login-container {
      background: #fff;
      padding: 30px 24px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      margin: 0 auto 26px auto;
      max-width: 440px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
    }

    .login-container h2 {
      font-family: 'Playfair Display', serif;
      color: var(--navy);
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
    }

    label {
      display: block;
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--navy);
      margin-top: 15px;
      text-align: left;
    }

    select,
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-left: 5px solid var(--gold);
      border-radius: 6px;
      font-size: 15px;
      font-family: 'Lato', sans-serif;
      background: #fdfcf9;
      color: var(--navy);
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    select:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--gold);
    }

    /* SUBMIT BUTTON */
    input[type="submit"] {
      display: block;
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      transition: background-color 0.2s;
    }

    input[type="submit"]:hover {
      background: #1d2a54;
    }

    input[type="submit"]:active {
      transform: scale(0.99);
    }

    .error {
      color: #f44336;
      margin-top: 15px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    /* FOOTER */
    .footer {
      background: var(--navy-mid);
      padding: 16px 36px;
      border-top: 2px solid var(--gold);
      margin-top: 30px;
      border-radius: 0 0 4px 4px;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .footer-left {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .footer-right {
      font-size: 10px;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* 3D gold style for the Back button */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'Lato', sans-serif;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--navy);
      background: linear-gradient(135deg, var(--gold-light) 0%, #e8830a 100%);
      border: none;
      border-radius: 5px;
      padding: 9px 18px;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 220, 120, 0.5),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 2px #9a5800,
        0 0 0 3.5px var(--gold);
      transition: filter 0.15s, transform 0.1s;
      flex-shrink: 0;
    }

    .btn-back:hover {
      filter: brightness(1.08);
    }

    .btn-back:active {
      transform: scale(0.97);
    }

    .btn-back svg {
      width: 12px;
      height: 12px;
    }

    /* MOBILE BREAKPOINTS */
    @media(max-width:768px) {
      .header {
        flex-direction: column;
        align-items: center;
      }

      .logo-wrap {
        padding: 16px 20px 4px 20px;
      }

      .hero {
        padding: 18px;
        width: 100%;
      }

      .wrapper {
        padding: 18px 14px;
      }

      h1 {
        font-size: 26px;
      }

      .login-container {
        padding: 24px 16px;
      }

      .footer {
        padding: 14px 12px;
      }

      .footer-content {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 14px;
      }
    }
  </style>

  <script>
    function validateLogin(event) {
      event.preventDefault(); // Stop form from submitting

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const error = document.getElementById("error-message");

      if (username === "Tavinder" && password === "arora12345") {
        window.location.href = "07-02-07-03-quiz-aed.html";
      } else {
        error.textContent = "Invalid username or password.";
      }
    }

    function goBack() {
      window.location.href = "07-02-07-01-quiz.html";
    }
  </script>
</head>

<body>

  <div class="poster">

    <div class="header">
      <div class="logo-wrap">
        <img class="logo-img" src="../../pictures/00-index/sikhsinindia.png" alt="Sikhs In India Logo">
      </div>
      <div class="hero">
        <div class="hero-title">Admin <span>Portal</span></div>
        <div class="hero-sub">Manage and Edit Sikh Quiz Data</div>
      </div>
    </div>

    <div class="intro">
      Authorized Administrator Access Only
    </div>

    <div class="wrapper">

      <h1>Security Verification</h1>

      <div class="login-container">
        <h2>Login</h2>
        <form onsubmit="validateLogin(event)">
          <label for="username">Username</label>
          <select id="username" name="username" required>
            <option value="Tavinder">Tavinder</option>
          </select>

          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required>

          <input type="submit" value="Login">
          <div class="error" id="error-message"></div>
        </form>
      </div>

    </div>

    <div class="footer">
      <div class="footer-content">
        <a href="07-02-07-01-quiz.html" class="btn-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M19 12H5M5 12l7-7M5 12l7 7" />
          </svg>
          Back
        </a>
        <div class="footer-left">© 2026 Sikhs in India</div>
        <div class="footer-right">Preserving Sikh Heritage & Unity</div>
      </div>
    </div>

  </div>

</body>

</html>
