<style>
body {
  font-family: Arial;
  background: black;
  color: #FF9933;
  margin: 0;
  text-align: center;
}

.container {
  max-width: 700px;
  margin: auto;

  border-radius: 10px;
}

input, select {
  width: 100%;
  padding: 10px;

button {
  background: #FF9933;

  cursor: pointer;
  border-radius: 5px;
  font-weight: bold;

  background: black;
  color: #FF9933;

}

  background: #222;

  padding: 10px;

/* ── FIELD MANAGER PANEL ── */
.field-panel {
  max-width: 700px;
  margin: 20px auto;
  background: #111;
  padding: 20px;
  border-radius: 10px;
  border: 1px solid #FF9933;
  text-align: left;
}

.field-panel h2 {
  text-align: center;
  margin-top: 0;
}

.field-panel .hint {
  font-size: 12px;
  color: #cc8b3f;
  margin: -4px 0 10px 0;
}

.field-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.field-row > * {
  flex: 1 1 45%;
}

table.field-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
}

table.field-table th, table.field-table td {
  border: 1px solid #FF9933;
  padding: 8px;

  text-align: left;

<body>

<!-- ══════════════════════════════════════════════
     FIELD (SCHEMA) MANAGER — bulk add/rename/delete/
     retype a field across every document in "Quiz"
     ══════════════════════════════════════════════ -->
<div class="field-panel">
  <h2>🛠 Manage Quiz Table Fields</h2>
  <p class="hint">These actions apply directly to every document in the Firestore "Quiz" collection. Field changes cannot be undone — review before confirming.</p>

  <input id="fmFieldName" placeholder="Field Name (existing, for rename/delete/retype)">
  <input id="fmNewFieldName" placeholder="New Field Name (for rename, or new field to add)">

  <div class="field-row">
    <select id="fmFieldType">
      <option value="string">String</option>
      <option value="number">Number</option>
      <option value="boolean">Boolean</option>
      <option value="date">Date</option>
    </select>
    <input id="fmDefaultValue" placeholder="Default value (for Add Field)">
  </div>

  <div class="field-row">
    <button onclick="addFieldToTable()">➕ Add Field</button>
    <button onclick="renameFieldInTable()">✏️ Rename Field</button>
    <button onclick="changeFieldTypeInTable()">🔁 Change Type</button>
    <button onclick="deleteFieldFromTable()">🗑 Delete Field</button>
  </div>

  <div id="fmStatus" class="status-msg"></div>

  <h3>Current Fields in "Quiz"</h3>
  <button onclick="refreshFieldList()">↻ Refresh Field List</button>
  <table class="field-table">
    <thead>
      <tr><th>Field Name</th><th>Sample Type</th><th>Present In</th></tr>
    </thead>
    <tbody id="fieldTableBody"></tbody>
  </table>
</div>

<div class="container">
  <h2>Quiz Admin Panel</h2>

  <form id="quizForm">
    <input type="number" id="sno" placeholder="SNo" required>
    <input type="text" id="question" placeholder="Question" required>
    <input type="text" id="opt1" placeholder="Option 1" required>
    <input type="text" id="opt2" placeholder="Option 2" required>
    <input type="text" id="opt3" placeholder="Option 3" required>
    <input type="text" id="opt4" placeholder="Option 4" required>
    <input type="number" id="correct" placeholder="Correct Option (1-4)" min="1" max="4" required>

    <button type="submit">Save / Update</button>
    <button type="button" onclick="clearForm()">Clear</button>
  </form>

  <h3>Quiz Records</h3>
  <div id="records"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
  authDomain: "sikhsinindia-67a6b.firebaseapp.com",
  projectId: "sikhsinindia-67a6b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const recordsDiv = document.getElementById("records");
const QUIZ_COLLECTION = "Quiz";

// ══════════════════════════════════════════════
// EXISTING QUIZ RECORD CRUD (unchanged behaviour)
// ══════════════════════════════════════════════

// LOAD DATA
async function loadQuiz() {
  recordsDiv.innerHTML = "";

  const snapshot = await db.collection(QUIZ_COLLECTION).orderBy("SNo").get();

  snapshot.forEach(doc => {
    const d = doc.data();

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <strong>SNo:</strong> ${d.SNo}<br>
      <strong>Q:</strong> ${d.Question}<br>
      1. ${d["Option-1"]}<br>
      2. ${d["Option-2"]}<br>
      3. ${d["Option-3"]}<br>
      4. ${d["Option-4"]}<br>
      <strong>Correct:</strong> ${d.Correct_Option}
      <br><br>
      <button onclick='edit(${JSON.stringify(d)})'>Edit</button>
      <button onclick="remove(${d.SNo})">Delete</button>
    `;

    recordsDiv.appendChild(div);
  });
}

// SAVE / UPDATE
document.getElementById("quizForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const sno = parseInt(document.getElementById("sno").value);

  const data = {
    SNo: sno,
    Question: document.getElementById("question").value,
    "Option-1": document.getElementById("opt1").value,
    "Option-2": document.getElementById("opt2").value,
    "Option-3": document.getElementById("opt3").value,
    "Option-4": document.getElementById("opt4").value,
    Correct_Option: parseInt(document.getElementById("correct").value)
  };

  // CHECK IF EXISTS
  const snapshot = await db.collection(QUIZ_COLLECTION).where("SNo", "==", sno).get();

  if (!snapshot.empty) {
    const docId = snapshot.docs[0].id;
    await db.collection(QUIZ_COLLECTION).doc(docId).update(data);
  } else {
    await db.collection(QUIZ_COLLECTION).add(data);
  }

  clearForm();
  loadQuiz();
});

// EDIT
function edit(d) {
  document.getElementById("sno").value = d.SNo;
  document.getElementById("question").value = d.Question;
  document.getElementById("opt1").value = d["Option-1"];
  document.getElementById("opt2").value = d["Option-2"];
  document.getElementById("opt3").value = d["Option-3"];
  document.getElementById("opt4").value = d["Option-4"];
  document.getElementById("correct").value = d.Correct_Option;

  window.scrollTo({ top: 0, behavior: "smooth" });
}

// DELETE
async function remove(sno) {
  if (!confirm("Delete this question?")) return;

  const snapshot = await db.collection(QUIZ_COLLECTION).where("SNo", "==", sno).get();

  snapshot.forEach(doc => {
    db.collection(QUIZ_COLLECTION).doc(doc.id).delete();
  });

  loadQuiz();
}

// CLEAR
function clearForm() {
  document.getElementById("quizForm").reset();
}

// ══════════════════════════════════════════════
// FIELD (SCHEMA) MANAGER — bulk operations that
// touch every document in the Quiz collection
// ══════════════════════════════════════════════

function setStatus(msg, isError) {
  const el = document.getElementById("fmStatus");
  el.textContent = msg;
  el.style.color = isError ? "#ff4d4d" : "#7CFC00";
}

// Fetch every document currently in the Quiz collection
async function getAllQuizDocs() {
  const snapshot = await db.collection(QUIZ_COLLECTION).get();
  return snapshot.docs; // array of QueryDocumentSnapshot
}

// Split an array of docs into Firestore-batch-safe chunks (limit is 500 writes/batch)
function createBatches(docs, size = 450) {
  const batches = [];
  for (let i = 0; i < docs.length; i += size) {
    batches.push(docs.slice(i, i + size));
  }
  return batches;
}

// Convert a raw value/string into the requested Firestore-friendly type
function castValue(value, type) {
  switch (type) {
    case "number": {
      const n = parseFloat(value);
      return isNaN(n) ? 0 : n;
    }
    case "boolean": {
      if (typeof value === "boolean") return value;
      const s = String(value).trim().toLowerCase();
      return s === "true" || s === "1" || s === "yes";
    }
    case "date": {
      const d = new Date(value);
      return isNaN(d.getTime()) ? null : firebase.firestore.Timestamp.fromDate(d);
    }
    default: // string
      return value === undefined || value === null ? "" : String(value);
  }
}

// Scan all Quiz documents and list the distinct fields currently in use
async function refreshFieldList() {
  setStatus("Loading field list...");
  try {
    const docs = await getAllQuizDocs();
    const fieldMap = {}; // fieldName -> { count, type }

    docs.forEach(doc => {
      const data = doc.data();
      Object.keys(data).forEach(key => {
        if (!fieldMap[key]) {
          fieldMap[key] = { count: 0, type: typeof data[key] };
        }
        fieldMap[key].count++;
      });
    });

    let html = "";
    Object.keys(fieldMap).sort().forEach(name => {
      const f = fieldMap[name];
      html += `<tr><td>${name}</td><td>${f.type}</td><td>${f.count}/${docs.length}</td></tr>`;
    });
    document.getElementById("fieldTableBody").innerHTML = html || `<tr><td colspan="3">No documents found</td></tr>`;

    setStatus(`Loaded ${docs.length} document(s), ${Object.keys(fieldMap).length} distinct field(s).`);
  } catch (err) {
    console.error(err);
    setStatus("Error loading field list: " + err.message, true);
  }
}

// ➕ ADD FIELD — adds a new field (with a default value) to every document that doesn't already have it
async function addFieldToTable() {
  const name = document.getElementById("fmNewFieldName").value.trim() || document.getElementById("fmFieldName").value.trim();
  const type = document.getElementById("fmFieldType").value;
  const rawDefault = document.getElementById("fmDefaultValue").value;

  if (!name) return alert("Enter the field name to add (in 'New Field Name').");

  const defaultValue = castValue(rawDefault, type);

  try {
    const docs = await getAllQuizDocs();
    if (docs.length === 0) return alert("No documents found in the Quiz collection.");

    if (!confirm(`Add field "${name}" (type: ${type}, default: ${JSON.stringify(defaultValue)}) to all ${docs.length} quiz record(s)?`)) return;

    setStatus("Adding field...");
    const batches = createBatches(docs);
    let updated = 0;

    for (const chunk of batches) {
      const batch = db.batch();
      chunk.forEach(doc => {
        const data = doc.data();
        if (!(name in data)) {
          batch.update(doc.ref, { [name]: defaultValue });
          updated++;
        }
      });
      await batch.commit();
    }

    setStatus(`Field "${name}" added to ${updated} record(s).`);
    refreshFieldList();
    loadQuiz();
  } catch (err) {
    console.error(err);
    setStatus("Error adding field: " + err.message, true);
  }
}

// ✏️ RENAME FIELD — copies the value to the new field name and removes the old one, across all docs
async function renameFieldInTable() {
  const oldName = document.getElementById("fmFieldName").value.trim();
  const newName = document.getElementById("fmNewFieldName").value.trim();

  if (!oldName || !newName) return alert("Enter both the current field name and the new field name.");

  try {
    const docs = await getAllQuizDocs();
    const affected = docs.filter(doc => oldName in doc.data());

    if (affected.length === 0) return alert(`No documents contain the field "${oldName}".`);

    if (!confirm(`Rename "${oldName}" to "${newName}" across ${affected.length} record(s)?`)) return;

    setStatus("Renaming field...");
    const batches = createBatches(affected);

    for (const chunk of batches) {
      const batch = db.batch();
      chunk.forEach(doc => {
        const data = doc.data();
        batch.update(doc.ref, {
          [newName]: data[oldName],
          [oldName]: firebase.firestore.FieldValue.delete()
        });
      });
      await batch.commit();
    }

    setStatus(`Field renamed from "${oldName}" to "${newName}" in ${affected.length} record(s).`);
    refreshFieldList();
    loadQuiz();
  } catch (err) {
    console.error(err);
    setStatus("Error renaming field: " + err.message, true);
  }
}

// 🔁 CHANGE TYPE — converts the field's value to the selected type, across all docs that have it
async function changeFieldTypeInTable() {
  const name = document.getElementById("fmFieldName").value.trim();
  const newType = document.getElementById("fmFieldType").value;

  if (!name) return alert("Enter the field name to convert.");

  try {
    const docs = await getAllQuizDocs();
    const affected = docs.filter(doc => name in doc.data());

    if (affected.length === 0) return alert(`No documents contain the field "${name}".`);

    if (!confirm(`Convert field "${name}" to type "${newType}" across ${affected.length} record(s)?`)) return;

    setStatus("Converting field type...");
    const batches = createBatches(affected);

    for (const chunk of batches) {
      const batch = db.batch();
      chunk.forEach(doc => {
        const data = doc.data();
        const converted = castValue(data[name], newType);
        batch.update(doc.ref, { [name]: converted });
      });
      await batch.commit();
    }

    setStatus(`Field "${name}" converted to "${newType}" in ${affected.length} record(s).`);
    refreshFieldList();
    loadQuiz();
  } catch (err) {
    console.error(err);
    setStatus("Error changing field type: " + err.message, true);
  }
}

// 🗑 DELETE FIELD — removes the field entirely from every document that has it
async function deleteFieldFromTable() {
  const name = document.getElementById("fmFieldName").value.trim();

  if (!name) return alert("Enter the field name to delete.");

  try {
    const docs = await getAllQuizDocs();
    const affected = docs.filter(doc => name in doc.data());

    if (affected.length === 0) return alert(`No documents contain the field "${name}".`);

    if (!confirm(`Permanently delete field "${name}" from ${affected.length} record(s)? This cannot be undone.`)) return;

    setStatus("Deleting field...");
    const batches = createBatches(affected);

    for (const chunk of batches) {
      const batch = db.batch();
      chunk.forEach(doc => {
        batch.update(doc.ref, { [name]: firebase.firestore.FieldValue.delete() });
      });
      await batch.commit();
    }

    setStatus(`Field "${name}" deleted from ${affected.length} record(s).`);
    refreshFieldList();
    loadQuiz();
  } catch (err) {
    console.error(err);
    setStatus("Error deleting field: " + err.message, true);
  }
}

// INIT
loadQuiz();
refreshFieldList();
</script>
