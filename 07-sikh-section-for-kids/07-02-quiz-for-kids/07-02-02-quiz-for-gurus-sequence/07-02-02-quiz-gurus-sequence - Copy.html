  <style>
    /* =========================================================
       THEME VARIABLES
       ========================================================= */
    :root {
      --kesari: #FF9933;
      --black:  #000000;
      --ink:    #1f2937;
      --paper:  #ffffff;
      --peel:   #fff5eb;
      --ok:     #c8f7c5;
      --ok-ink: #0a5d00;
      --bad:    #fde2e2;
      --bad-ink:#cc0000;
    }

    /* =========================================================
       GLOBAL RESET
       ========================================================= */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family:
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Arial,
        sans-serif;
      background: var(--black);
      color: var(--black);
    }

    /* =========================================================
       PAGE WRAPPER
       ========================================================= */
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px;
      background: var(--paper);
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* =========================================================
       HEADER
       ========================================================= */
    header {
      display: grid;
      gap: 6px;
      margin-bottom: 8px;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: var(--black);
      font-size: clamp(20px, 4.5vw, 28px);
      line-height: 1.2;
    }

    .sub {
      color: var(--ink);
      font-size: 13px;
    }

    /* =========================================================
       STATUS + CONTROLS
       ========================================================= */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 6px 0 10px 0;
      color: var(--black);
      font-weight: 700;
      font-size: 14px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--kesari);
    }

    .btn {
      border: 2px solid var(--black);
      background: var(--paper);
      color: var(--black);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
      transition:
        background .2s ease,
        color .2s ease;
    }

    .btn.primary {
      background: var(--kesari);
      color: var(--black);
    }

    .btn:hover {
      background: var(--black);
      color: #fff;
    }

    /* =========================================================
       BOARD LAYOUT
       ========================================================= */
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    .col {
      padding: 6px;
      border-radius: 10px;
      border: 2px solid var(--black);
      background: var(--paper);
      min-width: 0; /* allow shrinking to avoid mobile overflow */
    }

    .col h3 {
      margin: 0 0 6px 0;
      text-align: center;
      font-size: 14px;
      color: var(--ink);
    }

    /* =========================================================
       SLOTS & CARDS (equal height, image fills height)
       ========================================================= */
    .slots {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pool {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slot,
    .card {
      height: 56px;                 /* fixed, compact height */
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      padding: 0;                   /* remove padding so image can fill height */
      margin: 2px 0;
      font-size: 12px;
      transition:
        background .18s ease,
        border-color .18s ease,
        outline .12s ease,
        box-shadow .12s ease;
      overflow: hidden;             /* keep image inside rounded corners */
    }

    .slot {
      border: 2px dashed var(--kesari);
      background: var(--peel);
      font-weight: 800;
      color: var(--black);
      user-select: none;
    }

    .slot.correct {
      background: var(--ok);
      border-color: var(--ok-ink);
    }

    .slot.wrong {
      background: var(--bad);
      border-color: var(--bad-ink);
    }

    .slot .slot-index {
      min-width: 22px;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 0 6px;
      background: var(--kesari);
      color: var(--black);
      font-size: 12px;
      font-weight: 900;
      border-right: 1px solid var(--black);
      user-select: none;
    }

    .slot .slot-hint {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      opacity: 0.8;
      padding-right: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
    }

    .card {
      border: 2px solid var(--kesari);
      background: var(--peel);
      cursor: grab;
      user-select: none;
    }

    .card[draggable="false"] {
      cursor: default;
    }

    .card.pending {
      outline: 3px dashed var(--kesari);
      outline-offset: 2px;
      background: #ffe7c6;
      box-shadow:
        0 0 0 2px rgba(255,153,51,.18) inset;
    }

    .card img {
      height: 100%;                /* image fills the full block height */
      width: auto;
      display: block;
      flex: 0 0 auto;
      border-right: 1px solid var(--kesari);
      background: #fff;
    }

    .card .label {
      flex: 1;                     /* take remaining width */
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 8px;              /* slight breathing room */
      font-size: 14px;             /* consistent size across all */
      font-weight: 700;
      color: var(--black);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;     /* single line with ellipsis if needed */
    }

    /* =========================================================
       WIN OVERLAY + CONFETTI
       ========================================================= */
    #winOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 9999;
      color: #fff;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 16px;
    }

    #winOverlay .box {
      background: #fff;
      color: var(--black);
      border: 2px solid var(--black);
      border-radius: 14px;
      padding: 18px 20px;
      max-width: 440px;
      width: calc(100% - 32px);
    }

    #winOverlay h2 {
      margin: 0 0 8px 0;
      font-size: 22px;
    }

    #winOverlay .stats {
      margin: 10px 0 14px 0;
      border: 1.5px dashed var(--black);
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 700;
      line-height: 1.5;
      text-align: left;
    }

    #winOverlay .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    #winOverlay .actions .btn {
      background: var(--kesari);
      color: var(--black);
    }

    /* full-screen confetti canvas */
    #confetti {
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
    }

    /* =========================================================
       MOBILE OPTIMIZATION
       ========================================================= */
    @media (max-width: 700px) {
      .board {
        gap: 6px;
      }

      .slot,
      .card {
        height: 46px;
        font-size: 11px;
      }

      .slot .slot-index {
        min-width: 22px;
        font-size: 11px;
      }

      .slot .slot-hint {
        font-size: 11px;
      }

      .card .label {
        font-size: 12px;
        padding: 0 6px;
      }

      header .sub {
        font-size: 12px;
      }

      .topbar {
        font-size: 12px;
        gap: 10px;
      }

      #winOverlay h2 {
        font-size: 18px;
      }

      #winOverlay .stats {
        font-size: 13px;
      }
    }

    @media (max-width: 480px) {
      .board {
        grid-template-columns: 1fr 1fr;  /* keep columns side-by-side */
        gap: 4px;                        /* tighter gap to fit */
      }

      .col {
        padding: 4px;
      }

      .slot,
      .card {
        height: 44px;
      }

      .card .label {
        font-size: 11px;
        padding: 0 5px;
      }
    }

    
    /* =========================================================
       BACK BUTTON
       (unchanged)
       ========================================================= */
    .back-button {
      width: 80%;
      max-width: 200px;

      height: 45px;

      font-size: 18px;

      background-color: #FFA500;
      color: black;

      margin: 40px auto 0 auto;

      display: block;

      border: none;
      border-radius: 8px;

      cursor: pointer;
    }

    .back-button:hover {
      background-color: #FF8C00;
    }
    
  </style>
</head>
<body>
  <div
    class="wrap"
  >
    <!-- =======================================================
         HEADER
         ======================================================= -->
    <header>
      <h1>
        Arrange Sikh Gurus in Order
      </h1>

      <div
        class="sub"
      >
        Drag or tap a Guru card into the correct slot (1 → 10). Each correct slot turns green ✅
      </div>
    </header>

    <!-- =======================================================
         STATUS + CONTROLS
         ======================================================= -->
    <div
      class="topbar"
      role="status"
      aria-live="polite"
    >
      <div
        class="dot"
        aria-hidden="true"
      ></div>

      <div>
        Correct:
        <span
          id="correctCount"
        >
          0
        </span>
        / 10
      </div>

      <div>
        |
        Trials:
        <span
          id="trialCount"
        >
          0
        </span>
      </div>

      <div>
        |
        Score:
        <span
          id="scorePct"
        >
          0%
        </span>
      </div>

      <button
        id="btnReset"
        class="btn"
        type="button"
      >
        Reset
      </button>

      <button
        id="btnShuffle"
        class="btn primary"
        type="button"
      >
        New Round
      </button>
    </div>

    <!-- =======================================================
         BOARD
         ======================================================= -->
    <section
      class="board"
      aria-label="Match Gurus to correct order"
    >
      <!-- LEFT: SLOTS -->
      <div
        class="col"
      >
        <h3>
          Correct Order
        </h3>

        <div
          id="slots"
          class="slots"
        >
          <!-- Filled by JS -->
        </div>
      </div>

      <!-- RIGHT: POOL -->
      <div
        class="col"
      >
        <h3>
          Guru Images
        </h3>

        <div
          id="pool"
          class="pool"
        >
          <!-- Filled by JS -->
        </div>

  </div>

  <!-- =========================================================
       WIN OVERLAY
       ========================================================= -->
  <div
    id="winOverlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="winHeading"
  >
    <div
      class="box"
    >
      <h2
        id="winHeading"
      >
        🎉 You Win! 🎉
      </h2>

      <div
        class="stats"
      >
        <div>
          <strong>
            Correct:
          </strong>
          <span
            id="finalCorrect"
          >
            10
          </span>
          / 10
        </div>

        <div>
          <strong>
            Trials:
          </strong>
          <span
            id="finalTrials"
          >
            0
          </span>
        </div>

        <div>
          <strong>
            Score:
          </strong>
          <span
            id="finalScore"
          >
            100%
          </span>
        </div>
      </div>

      <div

  <!-- =========================================================
       CONFETTI CANVAS
       ========================================================= -->
  <canvas
    id="confetti"
  ></canvas>

  <!-- =========================================================
       TEMPLATES
       ========================================================= -->
  <template
    id="slot-tpl"
  >
    <div
      class="slot"
      data-order=""
      tabindex="0"
      aria-label=""
    >
      <div
        class="slot-index"
        aria-hidden="true"
      >
        1
      </div>

      <div
        class="slot-hint"
      >
        Drop here
      </div>
    </div>
  </template>

  <template
    id="card-tpl"
  >
    <div
      class="card"
      draggable="true"
      data-id=""
      data-order=""
      tabindex="0"
      role="button"
      aria-label=""
    >
      <img
        alt=""
        src=""
      />

      <div
        class="label"
      >
        Name
      </div>
    </div>
  </template>

  <!-- =========================================================
       SCRIPT
       ========================================================= -->
  <script>
    /* ---------------------------------------------------------
       DATA
       --------------------------------------------------------- */
    const ALL_ITEMS = [
      {
        id:    'Guru1',
        order: 1,
        label: 'Guru Nanak Dev Ji',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/01-guru-nanak-dev-ji.jpg'
      },
      {
        id:    'Guru2',
        order: 2,
        label: 'Guru Angad Dev Ji',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/02-guru-angad-dev-ji.jpg'
      },
      {
        id:    'Guru3',
        order: 3,
        label: 'Guru Amar Das Ji',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/03-guru-amar-das-ji.jpg'
      },
      {
        id:    'Guru4',
        order: 4,
        label: 'Guru Ram Das Ji',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/04-guru-ram-das-ji.jpg'
      },
      {
        id:    'Guru5',
        order: 5,
        label: 'Guru Arjan Dev Ji',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/05-guru-arjan-dev-ji.jpg'
      },
      {
        id:    'Guru6',
        order: 6,
        label: 'Guru Har Gobind Ji',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/06-guru-har-gobind-singh-ji.jpg'
      },
      {
        id:    'Guru7',
        order: 7,
        label: 'Guru Har Rai Ji',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/07-guru-har-rai-ji.jpg'
      },
      {
        id:    'Guru8',
        order: 8,
        label: 'Guru Har Krishan Ji',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/08-shri-guru-harkrishan-ji.jpg'
      },
      {
        id:    'Guru9',
        order: 9,
        label: 'Guru Tegh Bahadur Ji',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/09-shri-guru-teg-bahadur-ji.jpg'
      },
      {
        id:    'Guru10',
        order: 10,
        label: 'Guru Gobind Singh Ji',
        img:   '../../../pictures/07-sikh-stories/sikh-gurus/10-shri-guru-gobind-singh-ji.jpg'
      }
    ];

    /* ---------------------------------------------------------
       DOM ELEMENTS
       --------------------------------------------------------- */
    const slotsEl        = document.getElementById('slots');
    const poolEl         = document.getElementById('pool');

    const correctEl      = document.getElementById('correctCount');
    const trialsEl       = document.getElementById('trialCount');
    const scorePctEl     = document.getElementById('scorePct');

    const btnReset       = document.getElementById('btnReset');
    const btnShuffle     = document.getElementById('btnShuffle');

    const winOverlay     = document.getElementById('winOverlay');
    const playAgainBtn   = document.getElementById('playAgain');

    const finalCorrectEl = document.getElementById('finalCorrect');
    const finalTrialsEl  = document.getElementById('finalTrials');
    const finalScoreEl   = document.getElementById('finalScore');

    const confettiCanvas = document.getElementById('confetti');
    const ctx            = confettiCanvas.getContext('2d');

    /* ---------------------------------------------------------
       STATE
       --------------------------------------------------------- */
    let correct      = 0;
    let trials       = 0;
    let pendingId    = null;   /* for tap-to-place */
    let confettiAF   = null;   /* requestAnimationFrame handle */
    let confettiBits = [];     /* particles */

    /* ---------------------------------------------------------
       HELPERS
       --------------------------------------------------------- */
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function updateStatus() {
      correctEl.textContent = String(correct);
      trialsEl.textContent  = String(trials);

      /* Score based on denominator of 10.
         Before 10 trials, keep it at 100% max (uses max(trials,10)). */
      const denom = Math.max(trials, 10);
      const scorePct = ((10 / denom) * 100).toFixed(1);

      scorePctEl.textContent = `${scorePct}%`;
    }

    function clearPending() {
      if (!pendingId) return;

      const el = document.querySelector(`.card[data-id="${CSS.escape(pendingId)}"]`);
      if (el) {
        el.classList.remove('pending');
      }

      pendingId = null;
    }

    function flashWrong(slot) {
      slot.classList.add('wrong');
      setTimeout(() => slot.classList.remove('wrong'), 300);
    }

    function ordinal(n) {
      const s = ["th","st","nd","rd"],
            v = n % 100;
      return s[(v-20)%10] || s[v] || s[0];
    }

    /* ---------------------------------------------------------
       BUILD GAME
       --------------------------------------------------------- */
    function buildGame() {
      /* Reset UI */
      slotsEl.innerHTML = '';
      poolEl.innerHTML  = '';

      /* Reset State */
      correct   = 0;
      trials    = 0;
      pendingId = null;
      updateStatus();

      /* Hide overlay + stop confetti */
      hideWinOverlay();
      stopConfetti();

      /* Build 10 slots */
      for (let i = 1; i <= 10; i++) {
        const frag = document.importNode(document.getElementById('slot-tpl').content, true);
        const slot = frag.querySelector('.slot');

        /* dataset + a11y */
        slot.dataset.order = String(i);
        slot.setAttribute('aria-label', `Slot ${i}`);

        /* number box */
        slot.querySelector('.slot-index').textContent = String(i);

        /* hint text */
        slot.querySelector('.slot-hint').textContent = `Place the ${i}${ordinal(i)} Guru here`;

        /* drag-over support */
        slot.addEventListener('dragover', (e) => {
          e.preventDefault();
        });

        /* drop support */
        slot.addEventListener('drop', (e) => {
          e.preventDefault();

          const id = e.dataTransfer.getData('text/plain');
          const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
          if (!card) return;

          attemptPlace(card, slot);
        });

        /* tap-to-place support */
        slot.addEventListener('click', () => {
          if (!pendingId) return;

          const card = document.querySelector(`.card[data-id="${CSS.escape(pendingId)}"]`);
          if (!card) {
            clearPending();
            return;
          }

          attemptPlace(card, slot);
        });

        /* keyboard: Enter/Space to place selected */
        slot.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            if (!pendingId) return;

            const card = document.querySelector(`.card[data-id="${CSS.escape(pendingId)}"]`);
            if (!card) {
              clearPending();
              return;
            }

            attemptPlace(card, slot);
          }
        });

        slotsEl.appendChild(frag);
      }

      /* Build pool cards (shuffled) */
      const shuffled = shuffle([...ALL_ITEMS]);

      shuffled.forEach((item) => {
        const frag = document.importNode(document.getElementById('card-tpl').content, true);
        const card = frag.querySelector('.card');
        const img  = frag.querySelector('img');
        const lab  = frag.querySelector('.label');

        /* dataset */
        card.dataset.id    = item.id;
        card.dataset.order = String(item.order);

        /* content */
        img.src   = item.img;
        img.alt   = item.label;
        lab.textContent = item.label;

        /* a11y */
        card.setAttribute('aria-label', item.label);

        /* drag start */
        card.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', card.dataset.id);
          e.dataTransfer.effectAllowed = 'move';
          clearPending();
        });

        /* tap / click select toggle */
        card.addEventListener('click', () => {
          if (card.getAttribute('draggable') === 'false') return;

          /* toggle selection */
          if (pendingId === card.dataset.id) {
            clearPending();
          } else {
            clearPending();
            pendingId = card.dataset.id;
            card.classList.add('pending');
          }
        });

        /* keyboard: Enter/Space select */
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            card.click();
          }
        });

        poolEl.appendChild(frag);
      });

      /* Clicking empty pool area clears pending (once) */
      poolEl.addEventListener('click', (e) => {
        if (!e.target.closest('.card')) {
          clearPending();
        }
      }, { once: true });
    }

    /* ---------------------------------------------------------
       ATTEMPT PLACE (shared by drag & tap)
       --------------------------------------------------------- */
    function attemptPlace(card, slot) {
      /* Every attempt counts */
      trials++;
      updateStatus();

      /* If slot is already correct (locked), don't allow placing */
      if (slot.classList.contains('correct')) {
        flashWrong(slot);
        clearPending();
        return;
      }

      /* If slot currently holds a card (incorrect previously), send it back to pool */
      const currentCardInSlot = slot.querySelector('.card');
      if (currentCardInSlot) {
        poolEl.appendChild(currentCardInSlot);
      }

      const slotOrder = Number(slot.dataset.order);
      const cardOrder = Number(card.dataset.order);
      const isCorrect = (slotOrder === cardOrder);

      if (isCorrect) {
        /* Place inside slot and lock */

        /* preserve the index badge + hint container look:
           rebuild index badge, then add card, removing hint */
        slot.innerHTML = '';

        const idx = document.createElement('div');
        idx.className = 'slot-index';
        idx.textContent = String(slotOrder);

        slot.appendChild(idx);

        slot.appendChild(card);

        slot.classList.add('correct');

        card.setAttribute('draggable', 'false');
        card.classList.remove('pending');

        /* increase correct count */
        correct++;
        updateStatus();

        /* Check if done */
        if (correct === 10) {
          showWinOverlay();
        }
      } else {
        /* wrong => bounce back to pool (do not stick) */
        flashWrong(slot);
        poolEl.appendChild(card);
      }

      /* clear pending highlight */
      clearPending();
    }

    /* ---------------------------------------------------------
       CONTROLS
       --------------------------------------------------------- */
    btnReset.addEventListener('click', () => {
      buildGame();
    });

    btnShuffle.addEventListener('click', () => {
      buildGame();
    });

    playAgainBtn.addEventListener('click', () => {
      buildGame();
    });

    /* ---------------------------------------------------------
       WIN OVERLAY + SCORE (denominator of 10)
       --------------------------------------------------------- */
    function showWinOverlay() {
      const safeTrials = Math.max(trials, 10);
      const scorePct   = ((10 / safeTrials) * 100).toFixed(1);

      finalCorrectEl.textContent = String(correct);
      finalTrialsEl.textContent  = String(trials);
      finalScoreEl.textContent   = `${scorePct}%`;

      winOverlay.style.display = 'flex';

      startConfetti();
    }

    function hideWinOverlay() {
      winOverlay.style.display = 'none';
    }

    /* ---------------------------------------------------------
       CONFETTI
       --------------------------------------------------------- */
    function sizeConfetti() {
      confettiCanvas.width  = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }

    function startConfetti() {
      sizeConfetti();

      /* create particles */
      confettiBits = Array.from({ length: 180 }, () => ({
        x:  Math.random() * confettiCanvas.width,
        y:  Math.random() * -confettiCanvas.height,
        r:  2 + Math.random() * 4,
        vy: 1 + Math.random() * 3,
        vx: (Math.random() - 0.5) * 1.5,
        c:  `hsl(${Math.random() * 360}, 100%, 50%)`
      }));

      loopConfetti();
    }

    function stopConfetti() {
      if (confettiAF) {
        cancelAnimationFrame(confettiAF);
        confettiAF = null;
      }
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }

    function loopConfetti() {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

      for (const p of confettiBits) {
        ctx.fillStyle = p.c;
        ctx.fillRect(p.x, p.y, p.r, p.r);

        p.y += p.vy;
        p.x += p.vx;

        if (p.y > confettiCanvas.height) {
          p.y = -10;
          p.x = Math.random() * confettiCanvas.width;
        }
      }

      confettiAF = requestAnimationFrame(loopConfetti);
    }

    window.addEventListener('resize', sizeConfetti);

    /* ---------------------------------------------------------
       INIT
       --------------------------------------------------------- */
    buildGame();
  </script>
