<body>

  <div class="poster">

    <div class="header">
      <div class="logo-wrap">
        <img class="logo-img" src="../../../pictures/00-index/sikhsinindia.png" alt="Sikhs In India Logo">
      </div>
      <div class="hero">
        <div class="hero-title">Admin <span>Dashboard</span></div>
        <div class="hero-sub">Database Maintenance & Question Management</div>
      </div>
    </div>

    <div class="intro">
      Discover, Write, Update and Organize the Quiz Question Base
    </div>

    <div class="wrapper">

      <h1>Database Editor</h1>

      <div class="setup-container">
        <div class="setup-title" id="formHeader">Add / Edit Question</div>
        <form id="quizForm">
          <div class="form-grid">
            <div>
              <label for="sno">SNo (Unique Identifier)</label>
              <input type="number" id="sno" placeholder="e.g. 45" required>
            </div>
            <div>
              <label for="Difficulty">Difficulty Rating</label>
              <select id="Difficulty" required>
                <option value="1">1 - Easy</option>
                <option value="2" selected>2 - Moderate</option>
                <option value="3">3 - Difficult</option>
              </select>
            </div>
            <div class="full-width">
              <label for="question">Question Statement</label>
              <input type="text" id="question" placeholder="Enter question description..." required>
            </div>
            <div>
              <label for="opt1">Option 1</label>
              <input type="text" id="opt1" placeholder="Option 1" required>
            </div>
            <div>
              <label for="opt2">Option 2</label>
              <input type="text" id="opt2" placeholder="Option 2" required>
            </div>
            <div>
              <label for="opt3">Option 3</label>
              <input type="text" id="opt3" placeholder="Option 3" required>
            </div>
            <div>
              <label for="opt4">Option 4</label>
              <input type="text" id="opt4" placeholder="Option 4" required>
            </div>
            <div>
              <label for="correct">Correct Option Number</label>
              <input type="number" id="correct" placeholder="Correct index (1-4)" min="1" max="4" required>
            </div>
            <div>
              <label for="Domain">Category Domain</label>
              <select id="Domain" required>
                <option value="Gurus" selected>Gurus</option>
                <option value="Gurudwaras">Gurudwaras</option>
                <option value="Sikhism">Sikhism</option>
                <option value="Legends">Legends</option>
                <option value="Misc">Misc</option>
              </select>
            </div>
          </div>
          <div class="button-group">
            <button type="submit" class="btn-submit">Save / Update Record</button>
            <button type="button" class="btn-clear" onclick="clearForm()">Clear</button>
          </div>
        </form>
      </div>

      <div class="records-title">Quiz Records</div>
      <div id="records">Loading database records...</div>

    </div>

    <div class="footer">
      <div class="footer-content">
        <a href="07-02-07-03-sikhism-quiz-landing.html" class="btn-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M19 12H5M5 12l7-7M5 12l7 7" />
          </svg>
          Back
        </a>
        <div class="footer-left">© 2026 Sikhs in India</div>
        <div class="footer-right">Preserving Sikh Heritage & Unity</div>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
      authDomain: "sikhsinindia-67a6b.firebaseapp.com",
      projectId: "sikhsinindia-67a6b"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const recordsDiv = document.getElementById("records");

    // LOAD DATA
    async function loadQuiz() {
      recordsDiv.innerHTML = "<div style='text-align: center; font-weight: bold;'>Updating local dashboard view...</div>";

      try {
        const snapshot = await db.collection("Quiz").orderBy("SNo").get();
        recordsDiv.innerHTML = "";

        if (snapshot.empty) {
          recordsDiv.innerHTML = "<div style='text-align: center; color: #666;'>No questions found in the database.</div>";
          return;
        }

        snapshot.forEach(doc => {
          const d = doc.data();

          const div = document.createElement("div");
          div.className = "card";

          div.innerHTML = `
            <div class="card-meta">
              <span>SNo: ${d.SNo}</span>
              <span>Diff: ${d.Difficulty || 1} | Domain: ${d.Domain || "Misc"}</span>
            </div>
            <div class="card-question">${d.Question}</div>
            <div class="card-options-list">
              1. ${d["Option-1"]}<br>
              2. ${d["Option-2"]}<br>
              3. ${d["Option-3"]}<br>
              4. ${d["Option-4"]}
            </div>
            <div class="correct-badge">Correct Option: ${d.Correct_Option}</div>
            <div class="card-actions">
              <button class="btn-edit" onclick="edit('${doc.id}')">Edit</button>
              <button class="btn-delete" onclick="remove(${d.SNo})">Delete</button>
            </div>
          `;

          recordsDiv.appendChild(div);
        });
      } catch (error) {
        console.error("Firestore database connection error: ", error);
        recordsDiv.innerHTML = "<div style='text-align: center; color: red; font-weight: bold;'>Could not load data. Check Firebase configurations.</div>";
      }
    }

    // SAVE / UPDATE
    document.getElementById("quizForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const sno = parseInt(document.getElementById("sno").value);

      const data = {
        SNo: sno,
        Question: document.getElementById("question").value,
        "Option-1": document.getElementById("opt1").value,
        "Option-2": document.getElementById("opt2").value,
        "Option-3": document.getElementById("opt3").value,
        "Option-4": document.getElementById("opt4").value,
        Correct_Option: parseInt(document.getElementById("correct").value),
        Difficulty: document.getElementById("Difficulty").value,
        Domain: document.getElementById("Domain").value
      };

      try {
        // CHECK IF EXISTS
        const snapshot = await db.collection("Quiz").where("SNo", "==", sno).get();

        if (!snapshot.empty) {
          const docId = snapshot.docs[0].id;
          await db.collection("Quiz").doc(docId).update(data);
          alert(`Successfully updated SNo ${sno}`);
        } else {
          await db.collection("Quiz").add(data);
          alert(`Successfully added SNo ${sno}`);
        }

        clearForm();
        loadQuiz();
      } catch (error) {
        console.error("Failed to commit updates to collection: ", error);
        alert("Operation aborted. Check network access settings.");
      }
    });

    // EDIT
    async function edit(docId) {
      try {
        const docSnap = await db.collection("Quiz").doc(docId).get();
        if (!docSnap.exists) return;

        const d = docSnap.data();

        document.getElementById("sno").value = d.SNo;
        document.getElementById("question").value = d.Question;
        document.getElementById("opt1").value = d["Option-1"];
        document.getElementById("opt2").value = d["Option-2"];
        document.getElementById("opt3").value = d["Option-3"];
        document.getElementById("opt4").value = d["Option-4"];
        document.getElementById("correct").value = d.Correct_Option;
        document.getElementById("Difficulty").value = (d.Difficulty || 2).toString();
        document.getElementById("Domain").value = d.Domain || "Gurus";

        document.getElementById("formHeader").textContent = `Editing SNo: ${d.SNo}`;

        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (error) {
        console.error("Error staging editing item: ", error);
      }
    }

    // DELETE
    async function remove(sno) {
      if (!confirm(`Delete SNo ${sno} completely?`)) return;

      try {
        const snapshot = await db.collection("Quiz").where("SNo", "==", sno).get();

        const batch = db.batch();
        snapshot.forEach(doc => {
          batch.delete(doc.ref);
        });
        await batch.commit();

        loadQuiz();
      } catch (error) {
        console.error("Deletion transaction error: ", error);
        alert("Could not complete delete order.");
      }
    }

    // CLEAR
    function clearForm() {
      document.getElementById("quizForm").reset();
      document.getElementById("formHeader").textContent = "Add / Edit Question";
    }

    // INITIALIZE
    loadQuiz();
  </script>

</body>
