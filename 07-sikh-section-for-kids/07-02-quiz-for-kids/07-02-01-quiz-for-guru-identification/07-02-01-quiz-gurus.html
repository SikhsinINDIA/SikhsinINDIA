  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #0d1b3e;
      --navy-mid: #162147;
      --gold: #F7941D;
      --cream: #f5f0e8;
      --gold-light: #F7941D;
      --white: #ffffff;
    }

    /* PAGE BACKGROUND */
    body {
      font-family: 'Lato', sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      padding: 20px 8px;
    }

    /* MAIN CONTAINER */
    .poster {
      width: 100%;
      max-width: 860px;
      background: var(--cream);
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      overflow: hidden;
    }

    /* HEADER WITH LOGO */
    .header {
      display: flex;
      background: var(--navy);
      position: relative;
    }

    .logo-wrap {
      padding: 16px 20px;
    }

    .logo-img {
      height: 90px;
      background: #fff;
      padding: 4px;
      border-radius: 6px;
    }

    .hero {
      flex: 1;
      text-align: center;
      padding: 28px;
      background: linear-gradient(160deg, var(--navy), #1a2a5e);
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(24px, 5vw, 48px);
      font-weight: 900;
      color: #fff;
    }

    .hero-title span {
      color: var(--gold);
    }

    .hero-sub {
      color: rgba(255, 255, 255, .75);
      margin-top: 6px;
      font-style: italic;
    }

    /* GOLD BAR */
    .intro {
      background: linear-gradient(90deg, var(--gold), #ffb347, var(--gold));
      padding: 14px 20px;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--navy);
      font-size: 14px;
      text-align: center;
    }

    /* MAIN WRAPPER */
    .wrapper {
      padding: 28px 36px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--navy);
      text-align: center;
      font-size: 34px;
      margin-bottom: 8px;
    }

    .sub {
      color: #555;
      font-size: 15px;
      text-align: center;
      margin-bottom: 24px;
      font-weight: bold;
    }

    /* CONTROLS CONTAINER */
    .controls-container {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--navy);
      background: #fff;
      border: 2px solid var(--navy);
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    button.primary {
      background: var(--navy);
      color: #fff;
    }

    button:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--navy);
    }

    /* STATUS BAR */
    .status {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      background: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      margin-bottom: 24px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      font-weight: 700;
      color: var(--navy);
      font-size: 14px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      flex-wrap: wrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gold);
    }

    .score-highlight {
      color: var(--gold);
    }

    /* BOARD LAYOUT */
    .board {
      display: grid;
      grid-template-columns: 2fr 2fr 1.5fr;
      gap: 16px;
      align-items: start;
      margin-bottom: 10px;
    }

    .col {
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .grid-photos {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .photoCard {
      position: relative;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px dashed var(--gold);
      border-radius: 6px;
      overflow: hidden;
      background: #fffdfa;
      transition: all 0.2s ease;
      padding: 6px 6px 28px 6px;
    }

    .photoCard:focus {
      outline: none;
      border-color: var(--navy);
    }

    .photoCard img {
      max-height: 75px;
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }

    .dropName {
      position: absolute;
      left: 4px;
      right: 4px;
      bottom: 4px;
      background: var(--navy);
      color: #fff;
      border-radius: 4px;
      padding: 3px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .photoCard.locked {
      border: 2px solid #4caf50;
      background: #e2f5e1;
    }

    .photoCard.locked .dropName {
      background-color: #4caf50;
      color: #fff;
      font-size: 11px;
    }

    .photoCard.wrong {
      border: 2px solid #f44336;
      background: #fde2e2;
    }

    /* NAMES COLUMN */
    .names {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nameChip {
      user-select: none;
      padding: 10px 8px;
      border-radius: 6px;
      background: var(--cream);
      color: var(--navy);
      font-weight: 700;
      font-size: 13px;
      text-align: center;
      cursor: grab;
      border: 1px solid rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
    }

    .nameChip:hover {
      background: var(--navy);
      color: #fff;
    }

    .nameChip.matched {
      background-color: #e2f5e1;
      color: #1b5e20;
      border-color: #4caf50;
      cursor: default;
      opacity: 0.4;
    }

    .nameChip.pending {
      outline: 3px dashed var(--gold);
      outline-offset: 2px;
      background: #fff5eb;
    }

    /* FOOTER */
    .footer {
      background: var(--navy-mid);
      padding: 16px 36px;
      border-top: 2px solid var(--gold);
      margin-top: 30px;
      border-radius: 0 0 4px 4px;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .footer-left {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .footer-right {
      font-size: 10px;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* 3D gold style for the Back button */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'Lato', sans-serif;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--navy);
      background: linear-gradient(135deg, var(--gold-light) 0%, #e8830a 100%);
      border: none;
      border-radius: 5px;
      padding: 9px 18px;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 220, 120, 0.5),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 2px #9a5800,
        0 0 0 3.5px var(--gold);
      transition: filter 0.15s, transform 0.1s;
      flex-shrink: 0;
    }

    .btn-back:hover {
      filter: brightness(1.08);
    }

    .btn-back:active {
      transform: scale(0.97);
    }

    .btn-back svg {
      width: 12px;
      height: 12px;
    }

    /* MOBILE BREAKPOINTS */
    @media(max-width:768px) {
      .header {
        flex-direction: column;
        align-items: center;
      }

      .logo-wrap {
        padding: 16px 20px 4px 20px;
      }

      .hero {
        padding: 18px;
        width: 100%;
      }

      .wrapper {
        padding: 18px 10px;
      }

      h1 {
        font-size: 26px;
      }

      .board {
        grid-template-columns: 1fr 1fr 1.2fr;
        gap: 10px;
      }

      .photoCard {
        min-height: 100px;
      }

      .nameChip {
        font-size: 11px;
        padding: 8px 4px;
      }

      .footer {
        padding: 14px 12px;
      }

      .footer-content {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 14px;
      }
    }
  </style>
</head>

  <!-- TEMPLATES -->
  <template id="photo-card-tpl">

  <!-- GAME SCRIPT -->
  <script>
    const ALL_ITEMS = [
      {
        id: 'Guru Nanak Dev Ji',
        label: 'Guru Nanak Dev Ji',
        img: '../../../pictures/07-sikh-stories/sikh-gurus/01-guru-nanak-dev-ji.jpg'
      },
      {
        id: 'Guru Angad Dev Ji',
        label: 'Guru Angad Dev Ji',
        img: '../../../pictures/07-sikh-stories/sikh-gurus/02-guru-angad-dev-ji.jpg'
      },
      {
        id: 'Guru Amar Das Ji',
        label: 'Guru Amar Das Ji',
        img: '../../../pictures/07-sikh-stories/sikh-gurus/03-guru-amar-das-ji.jpg'
      },
      {
        id: 'Guru Ram Das Ji',
        label: 'Guru Ram Das Ji',
        img: '../../../pictures/07-sikh-stories/sikh-gurus/04-guru-ram-das-ji.jpg'
      },
      {
        id: 'Guru Arjan Dev Ji',
        label: 'Guru Arjan Dev Ji',
        img: '../../../pictures/07-sikh-stories/sikh-gurus/05-guru-arjan-dev-ji.jpg'
      },
      {
        id: 'Guru Har Gobind Ji',
        label: 'Guru Har Gobind Ji',
        img: '../../../pictures/07-sikh-stories/sikh-gurus/06-guru-har-gobind-singh-ji.jpg'
      },
      {
        id: 'Guru Har Rai Ji',
        label: 'Guru Har Rai Ji',
        img: '../../../pictures/07-sikh-stories/sikh-gurus/07-guru-har-rai-ji.jpg'
      },
      {
        id: 'Guru Har Krishan Ji',
        label: 'Guru Har Krishan Ji',
        img: '../../../pictures/07-sikh-stories/sikh-gurus/08-shri-guru-harkrishan-ji.jpg'
      },
      {
        id: 'Guru Tegh Bahadur Ji',
        label: 'Guru Tegh Bahadur Ji',
        img: '../../../pictures/07-sikh-stories/sikh-gurus/09-shri-guru-teg-bahadur-ji.jpg'
      },
      {
        id: 'Guru Gobind Singh Ji',
        label: 'Guru Gobind Singh Ji',
        img: '../../../pictures/07-sikh-stories/sikh-gurus/10-shri-guru-gobind-singh-ji.jpg'
      }
    ];

    const $ = (sel) => document.querySelector(sel);

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const state = {
      activeItems: [],
      matches: 0,
      trials: 0,
      needed: 0
    };

    function buildRound(count = 10) {
      const pool = shuffle([...ALL_ITEMS]).slice(0, count);

      state.activeItems = pool;
      state.matches = 0;
      state.trials  = 0;
      state.needed  = pool.length;

      updateScore();

      const firstHalf  = pool.slice(0, 5);
      const secondHalf = pool.slice(5);

      const col1 = $('#col1');
      const col2 = $('#col2');

      col1.innerHTML = '';
      col2.innerHTML = '';

      firstHalf.forEach((item)  => addPhoto(col1, item));
      secondHalf.forEach((item) => addPhoto(col2, item));

      const names = $('#names');
      names.innerHTML = '';

      shuffle([...pool]).forEach((item) => addName(names, item));
    }

    function addPhoto(container, item) {
      const node = document.importNode($('#photo-card-tpl').content, true);
      const card = node.querySelector('.photoCard');
      const img  = node.querySelector('img');

      card.dataset.id = item.id;
      img.src         = item.img;
      img.alt         = item.label;

      addDropHandlers(card);
      container.appendChild(node);
    }

    function addName(container, item) {
      const chipFrag = document.importNode($('#name-chip-tpl').content, true);
      const chip     = chipFrag.querySelector('.nameChip');

      chip.textContent = item.label;
      chip.dataset.id  = item.id;

      addDragHandlers(chip);
      container.appendChild(chipFrag);
    }

    function updateScore() {
      const pct = state.trials === 0 ? 0 : Math.round((state.matches / state.trials) * 100);
      $('#score').textContent     = state.matches;
      $('#attempts').textContent  = state.trials;
      $('#scorePct').textContent  = `${pct}%`;
    }

    function addDragHandlers(el) {
      el.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', el.dataset.id);
        el.style.opacity = '0.7';
      });

      el.addEventListener('dragend', () => {
        el.style.opacity = '1';
      });
    }

    function addDropHandlers(card) {
      card.addEventListener('dragover', (e) => e.preventDefault());

      card.addEventListener('drop', (e) => {
        e.preventDefault();
        const id = e.dataTransfer.getData('text/plain');
        const chip = document.querySelector(`.nameChip[data-id="${CSS.escape(id)}"]:not(.matched)`);
        if (!chip) return;
        tryDrop(card, id, chip);
      });

      card.addEventListener('click', () => {
        const pending = document.querySelector('.nameChip.pending');
        if (!pending) return;
        tryDrop(card, pending.dataset.id, pending);
      });
    }

    document.addEventListener('click', (e) => {
      const chip = e.target.closest('.nameChip');
      if (!chip || chip.classList.contains('matched')) return;

      document.querySelectorAll('.nameChip.pending').forEach((c) => c.classList.remove('pending'));
      chip.classList.add('pending');
    });

    function tryDrop(card, id, chip) {
      state.trials++;

      const isCorrect = card.dataset.id === id;

      if (isCorrect) {
        const slot = card.querySelector('[data-dropzone]');
        slot.textContent = chip.textContent;

        chip.classList.add('matched');
        chip.classList.remove('pending');

        card.classList.add('locked');
        state.matches++;
        updateScore();

        confettiBurst(card);

        if (state.matches === state.needed) {
          announceWin();
        }
      } else {
        chip.classList.remove('pending');
        flashWrong(card);
        updateScore();
      }
    }

    function flashWrong(card) {
      card.classList.add('wrong');
      setTimeout(() => card.classList.remove('wrong'), 550);
    }

    function announceWin() {
      const pct = state.trials === 0 ? 0 : Math.round((state.matches / state.trials) * 100);
      const msg = document.createElement('div');

      msg.setAttribute('role', 'alert');
      msg.style.position   = 'fixed';
      msg.style.inset      = '0';
      msg.style.display    = 'grid';
      msg.style.placeItems = 'center';
      msg.style.background = 'rgba(13, 27, 62, 0.85)';
      msg.style.zIndex     = '9999';

      msg.innerHTML = `
        <div style="
          background: var(--cream);
          padding: 30px;
          border-radius: 8px;
          text-align: center;
          border: 3px solid var(--gold);
          max-width: 420px;
          box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
          font-family: 'Lato', sans-serif;
        ">
          <h3 style="
            margin: 0 0 12px;
            font-size: 26px;
            font-family: 'Playfair Display', serif;
            color: var(--navy);
          ">
            Great Job! 🎉
          </h3>

          <p style="
            margin: 0 0 16px;
            color: #333;
            font-weight: 700;
            font-size: 16px;
          ">
            You matched all names correctly.
          </p>

          <div style="
            margin: 10px 0 20px 0;
            padding: 12px 16px;
            border: 2px dashed var(--navy);
            border-radius: 8px;
            display: inline-block;
            text-align: left;
            line-height: 1.6;
            background: #fff;
            color: var(--navy);
            font-weight: bold;
          ">
            <div><strong>Score:</strong> ${pct}%</div>
            <div><strong>Correct:</strong> ${state.matches}</div>
            <div><strong>Attempts:</strong> ${state.trials}</div>
          </div>

          <button id="playAgain" style="
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            background: var(--navy);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
          ">
            Play Again
          </button>
        </div>
      `;

      document.body.appendChild(msg);

      document.getElementById('playAgain').addEventListener('click', () => {
        msg.remove();
        buildRound(10);
      });

      confettiCanvas(msg);
    }

    function confettiBurst(target) {
      const rect = target.getBoundingClientRect();
      const COLORS = ['#FF9933', '#FF0000', '#00CCFF', '#00CC66', '#FFD700', '#800080'];

      for (let i = 0; i < 12; i++) {
        const dot = document.createElement('div');
        dot.style.position      = 'fixed';
        dot.style.width         = '8px';
        dot.style.height        = '8px';
        dot.style.borderRadius  = '50%';
        dot.style.left = (rect.left + rect.width  / 2) + 'px';
        dot.style.top  = (rect.top  + rect.height / 2) + 'px';
        dot.style.background    = COLORS[Math.floor(Math.random() * COLORS.length)];
        dot.style.pointerEvents = 'none';
        dot.style.zIndex        = '999';

        document.body.appendChild(dot);

        const angle = Math.random() * Math.PI * 2;
        const dist  = 50 + Math.random() * 50;
        const x = Math.cos(angle) * dist;
        const y = Math.sin(angle) * dist;

        dot.animate([
          { transform: 'translate(0, 0)',           opacity: 1 },
          { transform: `translate(${x}px, ${y}px)`,  opacity: 0 }
        ], {
          duration: 700,
          easing: 'ease-out'
        }).onfinish = () => dot.remove();
      }
    }

    function confettiCanvas(overlay) {
      const c   = document.createElement('canvas');
      const ctx = c.getContext('2d');
      overlay.appendChild(c);

      function size() {
        c.width  = overlay.clientWidth;
        c.height = overlay.clientHeight;
      }
      size();

      const COLORS = ['#FF9933', '#FF0000', '#00CCFF', '#00CC66', '#FFD700', '#800080'];
      const pieces = Array.from({ length: 80 }, () => ({
        x:   Math.random() * c.width,
        y:   Math.random() * c.height,
        r:   3 + Math.random() * 3,
        s:   1 + Math.random() * 2,
        col: COLORS[Math.floor(Math.random() * COLORS.length)]
      }));

      let running = true;

      function tick() {
        if (!running) return;
        requestAnimationFrame(tick);
        ctx.clearRect(0, 0, c.width, c.height);

        for (const p of pieces) {
          ctx.fillStyle = p.col;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();

          p.y += p.s;
          if (p.y > c.height) {
            p.y = -10;
            p.x = Math.random() * c.width;
          }
        }
      }

      tick();
      const ro = new ResizeObserver(size);
      ro.observe(overlay);

      overlay.addEventListener('click', () => {
        running = false;
      });
    }

    document.getElementById('newRound').addEventListener('click', () => buildRound(10));
    document.getElementById('reset').addEventListener('click', () => buildRound(10));

    // INIT
    buildRound(10);
  </script>
