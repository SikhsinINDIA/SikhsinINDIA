}
]
  

  let currentIndex = 0;

  function showImage(index) {
    const img = document.getElementById("guruAmarDasJiImg");
    img.src = guruAmarDasJiPhotos[index].src;

    document.getElementById("guruHarRaiCaption").textContent =
      guruAmarDasJiPhotos[index].caption;

    document.getElementById("imageCounter").textContent =
      (index + 1) + " / " + guruAmarDasJiPhotos.length;
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % guruAmarDasJiPhotos.length;
    showImage(currentIndex);
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + guruAmarDasJiPhotos.length) % guruAmarDasJiPhotos.length;
    showImage(currentIndex);
  }

  document.addEventListener("DOMContentLoaded", () => showImage(0));
</script>
