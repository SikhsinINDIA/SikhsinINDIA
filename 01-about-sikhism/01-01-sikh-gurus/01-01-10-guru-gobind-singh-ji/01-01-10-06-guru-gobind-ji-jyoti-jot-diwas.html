    /* IMAGE INTERFACE CARD */
    .card {
      width: 100%;
      background: #fff;

    .image-controls {

    /* STANDARDIZED UNIFORM FOOTER BLOCK */

    /* Styled 3D Gold Action Back Link */

      padding: 10px 20px;

  <div class="poster">

        <!-- Controls container system row -->

          <button class="control-btn" onclick="prevImage()">◀ Prev</button>

  </div>

  <script>
    const guruGobindPhotos = [
      {
        src: "https://drive.google.com/thumbnail?id=1zm_qOKHQOIty7IwnYSpSxedaBc-sxku1&sz=w1000",
        caption: "Guru Gobind Singh Ji - Jyoti Jot Diwas Greeting 1"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1FT75C3OZpzsnZ8qxJPAnoSTYEo6l8Cay&sz=w1000",
        caption: "Guru Gobind Singh Ji - Jyoti Jot Diwas Greeting 2"
      },
      {
        src: "https://drive.google.com/thumbnail?id=16sK6nKAihttfM5U6IJ49PmjhVJOabhUj&sz=w1000",
        caption: "Guru Gobind Singh Ji - Jyoti Jot Diwas Greeting 3"
      },
      {
        src: "https://drive.google.com/thumbnail?id=12KoCOD5uaV6ByHFg0VbgXhPPcmxi1bEV&sz=w1000",
        caption: "Guru Gobind Singh Ji - Jyoti Jot Diwas Greeting 4"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1wvH81ybSD5N-sGl2YIiktfiAQtLP3vNu&sz=w1000",
        caption: "Guru Gobind Singh Ji - Jyoti Jot Diwas Greeting 5"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1nlYeFhmmUHNAjrk7fVIdl0pQ7JlKTDLw&sz=w1000",
        caption: "Guru Gobind Singh Ji - Jyoti Jot Diwas Greeting 6"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1KG6MHjjv7H6Oi1lc61ZLIYQ_EC7TbWU-&sz=w1000",
        caption: "Guru Gobind Singh Ji - Jyoti Jot Diwas Greeting 7"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1AB0YZagkmcEDAqDM1Rvcn9U2j_ARVSdx&sz=w1000",
        caption: "Guru Gobind Singh Ji - Jyoti Jot Diwas Greeting 8"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1BIz5Ffi4cwjGDR0-CV51856Ce7HCKaYB&sz=w1000",
        caption: "Guru Gobind Singh Ji - Jyoti Jot Diwas Greeting 9"
      }
    ];

    let currentIndex = 0;

    function showImage(index) {
      const img = document.getElementById("guruGobindImg");
      if (!img) return;

      // Correcting mixed references: prioritization should always be given to Gobind Singh Ji
      img.src = guruGobindPhotos[index].src;

      document.getElementById("guruGobindCaption").textContent =
        guruGobindPhotos[index].caption;

      document.getElementById("imageCounter").textContent =
        (index + 1) + " / " + guruGobindPhotos.length;
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % guruGobindPhotos.length;
      showImage(currentIndex);
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + guruGobindPhotos.length) % guruGobindPhotos.length;
      showImage(currentIndex);
    }

    // Event listener system ensures script runs after DOM is constructed
    document.addEventListener("DOMContentLoaded", () => showImage(0));
  </script>
