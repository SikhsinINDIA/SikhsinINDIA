    /* IMAGE INTERFACE CARD */
    .card {
      width: 100%;

      border: 1px solid rgba(13, 27, 62, 0.08);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      margin-bottom: 20px;
    }

    .card img {
      width: 100%;
      height: auto;
      max-height: 65vh;
      object-fit: contain;
      display: block;
      border-radius: 6px;
      margin-bottom: 16px;
    }

    /* CONTROLS BAR */
    .image-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .control-btn {
      background-color: var(--navy);
      color: #fff;
      border: none;
      padding: 10px 18px;
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .control-btn:hover {
      background-color: var(--gold);
      color: var(--navy);
    }

    .image-counter {
      font-family: 'Lato', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--navy);
      background-color: rgba(13, 27, 62, 0.05);
      padding: 8px 16px;
      border-radius: 5px;
      min-width: 80px;
      text-align: center;

    #guruGobindCaption {

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-left {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .footer-right {
      font-size: 10px;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* Back button — 3D gold style */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'Lato', sans-serif;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--navy);
      background: linear-gradient(135deg, var(--gold-light) 0%, #e8830a 100%);
      border: none;
      border-radius: 5px;
      padding: 9px 18px;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 220, 120, 0.5),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 2px #9a5800,
        0 0 0 3.5px var(--gold);
      transition: filter 0.15s, transform 0.1s;
      flex-shrink: 0;
    }

    .btn-back:hover {

    .btn-back:active {

  <script>
    const guruGobindPhotos = [
      {
        src: "https://drive.google.com/thumbnail?id=1zIpjkHUP8iagkZsyZb4m5OczojWi2184&sz=w1000",
        caption: "Guru Gobind Singh Ji - Greeting Card 1"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1BTM_d1BrPqK3h4XPcIkbr7XJ9fy23oFu&sz=w1000",
        caption: "Guru Gobind Singh Ji - Greeting Card 2"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1hG3J8sQehjPm34KvT-ksluFY2degLmL8&sz=w1000",
        caption: "Guru Gobind Singh Ji - Greeting Card 3"
      },
      {
        src: "https://drive.google.com/thumbnail?id=14ArLGb5A9e5wvetlt5gSuiTfhJ64nWTG&sz=w1000",
        caption: "Guru Gobind Singh Ji - Greeting Card 4"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1YzJ2DrFGPnYc_vjoUowbBt0ms8ts579t&sz=w1000",
        caption: "Guru Gobind Singh Ji - Greeting Card 5"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1TtqOwZIT0iirqNuguZZSfqTJIU1e6-KC&sz=w1000",
        caption: "Guru Gobind Singh Ji - Greeting Card 6"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1NRic-JuTXhQg9tCf8HdZCz7jvJzFMpYi&sz=w1000",
        caption: "Guru Gobind Singh Ji - Greeting Card 7"
      },
      {
        src: "https://drive.google.com/thumbnail?id=19LEJVXBbWIZtoFet5UhiiuQqIDQCH1Xg&sz=w1000",
        caption: "Guru Gobind Singh Ji - Greeting Card 8"
      },
      {
        src: "https://drive.google.com/thumbnail?id=12JLcMdzC-t3KC_T0Sdr_mtvr7G9-5CV9&sz=w1000",
        caption: "Guru Gobind Singh Ji - Greeting Card 9"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1Q71FBDq1RitkVfIeYl6Te0aM9oW5ehPt&sz=w1000",
        caption: "Guru Gobind Singh Ji - Greeting Card 10"
      }
    ];

    let currentIndex = 0;

    function showImage(index) {
      const img = document.getElementById("guruGobindImg");
      img.src = guruGobindPhotos[index].src;

      document.getElementById("guruGobindCaption").textContent =
        guruGobindPhotos[index].caption;

      document.getElementById("imageCounter").textContent =
        (index + 1) + " / " + guruGobindPhotos.length;
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % guruGobindPhotos.length;
      showImage(currentIndex);
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + guruGobindPhotos.length) % guruGobindPhotos.length;
      showImage(currentIndex);
    }

    document.addEventListener("DOMContentLoaded", () => showImage(0));
  </script>
