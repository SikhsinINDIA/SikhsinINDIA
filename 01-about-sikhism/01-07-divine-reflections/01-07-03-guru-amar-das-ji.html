<script>
  const guruAmarPhotos = [
{ src: "../../pictures/01-about-sikhism/01-07-divine-reflections/03-guru-amar-das-ji/01-Baba Amar Daas Ji recieved the robe of honour.jpg", caption: "Baba Amar Daas Ji recieved the robe of honour" },
{ src: "../../pictures/01-about-sikhism/01-07-divine-reflections/03-guru-amar-das-ji/02-Bhai Jetha Ji bows to Guru Amar Daas Ji.jpg", caption: "Bhai Jetha Ji bows to Guru Amar Daas Ji" },
{ src: "../../pictures/01-about-sikhism/01-07-divine-reflections/03-guru-amar-das-ji/03-Emperor Akbar paying homage to Guru Amar Daas Ji at Goindwal.jpg", caption: "Emperor Akbar paying homage to Guru Amar Daas Ji at Goindwal" },
{ src: "../../pictures/01-about-sikhism/01-07-divine-reflections/03-guru-amar-das-ji/03-Guru Amar Daas Ji empowered women.jpg", caption: "Guru Amar Daas Ji empowered women" },
{ src: "../../pictures/01-about-sikhism/01-07-divine-reflections/03-guru-amar-das-ji/05-Guru Amar Daas Ji encouraging women.jpg", caption: "Guru Amar Daas Ji encouraging women" },
{ src: "../../pictures/01-about-sikhism/01-07-divine-reflections/03-guru-amar-das-ji/06-Guru Amar Das - Condemning Sati and promoting equal gender.jpg", caption: "Guru Amar Das - Condemning Sati and promoting equal gender" },
{ src: "../../pictures/01-about-sikhism/01-07-divine-reflections/03-guru-amar-das-ji/07-Guru Amardas & Bhai Jetha Ji.jpg", caption: "Guru Amardas & Bhai Jetha Ji" },

];


  let currentIndex = 0;

  function showImage(index) {
    const img = document.getElementById("guruAmarImg");
    const caption = document.getElementById("guruAmarCaption");

    img.src = guruAmarPhotos[index].src;
    caption.textContent =  guruAmarPhotos[index].caption ;
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % guruAmarPhotos.length;
    showImage(currentIndex);
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + guruAmarPhotos.length) % guruAmarPhotos.length;
    showImage(currentIndex);
  }
  document.addEventListener("DOMContentLoaded", () => showImage(0));
</script>
