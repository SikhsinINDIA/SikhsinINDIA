  let currentIndex = 0;

  function showImage(index) {
    const img = document.getElementById("guruGobindSinghImg");

    img.src = guruGobindSinghPhotos[index].src;
    caption.textContent =  guruGobindSinghPhotos[index].caption ;
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % guruGobindSinghPhotos.length;
    showImage(currentIndex);
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + guruGobindSinghPhotos.length) % guruGobindSinghPhotos.length;
    showImage(currentIndex);
  }
  document.addEventListener("DOMContentLoaded", () => showImage(0));
