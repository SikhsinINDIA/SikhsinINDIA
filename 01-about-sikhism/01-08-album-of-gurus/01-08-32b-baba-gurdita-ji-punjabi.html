},

  ]

  let currentIndex = 0;

  function showImage(index) {
    const img = document.getElementById("guruHarRaiImg");
    img.src = guruHarRaiPhotos[index].src;

    document.getElementById("guruHarRaiCaption").textContent =
      guruHarRaiPhotos[index].caption;

    document.getElementById("imageCounter").textContent =
      (index + 1) + " / " + guruHarRaiPhotos.length;
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % guruHarRaiPhotos.length;
    showImage(currentIndex);
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + guruHarRaiPhotos.length) % guruHarRaiPhotos.length;
    showImage(currentIndex);
  }

  document.addEventListener("DOMContentLoaded", () => showImage(0));
</script>
