  <script>
    function openLightbox(img) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const downloadLink = document.getElementById('download-link');

      const fileId = img.getAttribute('data-id');
      const fullImgUrl = `https://drive.google.com/thumbnail?id=${fileId}&sz=w2000`;
      const downloadUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;

      lightbox.style.display = 'flex';
      lightboxImg.src = fullImgUrl;
      lightboxImg.alt = img.alt;
      downloadLink.href = downloadUrl;
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    document.getElementById('lightbox').addEventListener('click', function(e) {
      if (e.target.id === 'lightbox') closeLightbox();
    });

      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(liveUrl).then(function () {
          alert('Link copied to clipboard!\n\nYou can now paste it into Instagram or any app.');
        }).catch(function () { alert('Share URL: ' + liveUrl); });
      } else {
        alert('Share URL: ' + liveUrl);
      }
    });
  })();
</script>
</html>
