  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guru Granth Sahib Ji</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .album {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
      align-items: center;
      justify-items: center;
    }
    .album img {
      width: 100%;
      height: auto;
      max-height: 250px;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
      background: #fff;
      cursor: pointer;
    }
    .album img:hover {
      transform: scale(1.05);
    }

    /* Lightbox styles */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(255,255,255,0.3);
    }
    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 18px;
      background: #FF9933;
      color: black;
      border: 2px solid #000;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
    }
    .download-btn {
      margin-top: 20px;
      background: #fff;
      color: black;
      border: 2px solid #000;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
    }
    .download-btn:hover {
      background: #FF9933;
    }

    .back-button {
      width: 150px;
      height: 40px;
      font-size: 24px;
      background-color: #FF9933;
      color: black;
      margin: 40px auto 0 auto;
      display: block;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .back-button:hover {
      background-color: #FF9933;
    }
  </style>
</head>
<body>
  <h1>Guru Granth Sahib Ji</h1>

  <div class="album">
    <img src="https://drive.google.com/thumbnail?id=1qa8efyPd2Mgxel2paN9s9ulfK14wzS3A&sz=w1000" 
         alt="Guru Granth Sahib Ji-1" 
         data-id="1qa8efyPd2Mgxel2paN9s9ulfK14wzS3A" 
         onclick="openLightbox(this)">
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox">
    <button class="close-btn" onclick="closeLightbox()">✕ Close</button>
    <img id="lightbox-img" src="" alt="">
    <a id="download-link" class="download-btn" href="#" download>⬇ Download Image</a>
  </div>

  <a href="./01-08-album-of-gurus.html" class="back-button"
     style="width: 150px; height: 36px; font-size: 24px; background-color: #FF9933; 
            color: black; display: block; margin: 20px auto 0 auto; text-align: center; 
            line-height: 35px; border-radius: 8px; text-decoration: none; 
            border: 2px solid black;">
    <b>Back</b>
  </a>

  <script>
    function openLightbox(img) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const downloadLink = document.getElementById('download-link');

      const fileId = img.getAttribute('data-id');
      const fullImgUrl = `https://drive.google.com/thumbnail?id=${fileId}&sz=w2000`;
      const downloadUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;

      lightbox.style.display = 'flex';
      lightboxImg.src = fullImgUrl;
      lightboxImg.alt = img.alt;
      downloadLink.href = downloadUrl;
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    document.getElementById('lightbox').addEventListener('click', function(e) {
      if (e.target.id === 'lightbox') closeLightbox();
    });
  </script>
</body>
</html>
