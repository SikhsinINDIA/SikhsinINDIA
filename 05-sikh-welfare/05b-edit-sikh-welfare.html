<body>

  <div class="poster">

    <!-- HEADER WITH SIKHSININDIA LOGO -->
    <div class="header">
      <div class="logo-wrap">
        <img class="logo-img" src="../pictures/00-index/sikhsinindia.png" alt="Sikhs In India Logo">
      </div>
      <div class="hero">
        <div class="hero-title">Sikh Social Welfare <span>Organizations</span></div>
      </div>
    </div>

    <div class="intro">
      Database Management Registry &bull; Real-time Cloud Synchronization Framework
    </div>

    <div class="wrapper">

      <!-- DATA MANAGEMENT ENTRY FORM -->
      <div class="panel">
        <h2>Organization Registration</h2>
        <form onsubmit="event.preventDefault(); addOrUpdateRecord();">
          <input type="hidden" id="docId" />
          
          <div class="form-container">
            <div class="form-group full-width">
              <label for="name">Organization Name</label>
              <input type="text" id="name" placeholder="e.g. Sikhs 4 All Foundation" required />
            </div>

            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" placeholder="e.g. Jammu" required />
            </div>

            <div class="form-group">
              <label for="state">State</label>
              <input type="text" id="state" placeholder="e.g. Jammu & Kashmir" required />
            </div>

            <div class="form-group">
              <label for="type">Organization Type</label>
              <input type="text" id="type" placeholder="e.g. Charitable Trust" required />
            </div>

            <div class="form-group">
              <label for="webpage">Target Webpage Link</label>
              <input type="text" id="webpage" placeholder="e.g. file-name.html" required />
            </div>

            <div class="form-group full-width">
              <button type="submit" class="btn-submit">Add / Update Record</button>
            </div>
          </div>
        </form>
      </div>

      <!-- DATA TABLE REGISTRY -->
      <h2>Registered Organizations Directory</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>City</th>
              <th>State</th>
              <th>Type</th>
              <th>Webpage</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="recordsTable"></tbody>
        </table>
      </div>

    </div>

    <!-- SITE FOOTER FRAME -->

      <div class="footer-content">

            stroke-linejoin="round">
            <path d="M19 12H5M5 12l7-7M5 12l7 7" />
          </svg>
          Back
        </button>
        <div class="footer-left">&copy; Sikhs In India Cloud Operations Engine</div>
      </div>
    </div>

  <!-- FIRESTORE OPERATIONS LAYER SCRIPTS -->
  <script>
    // Config synchronized exactly with document specs
    const firebaseConfig = {
      apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
      authDomain: "sikhsinindia-67a6b.firebaseapp.com",
      projectId: "sikhsinindia-67a6b",
      storageBucket: "sikhsinindia-67a6b.appspot.com",
      messagingSenderId: "622603668882",
      appId: "1:622603668882:web:953c6a07864b235fdd054b",
      measurementId: "G-LHNTFNW14H"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const collection = db.collection("Sikh_Welfare");

    function addOrUpdateRecord() {
      const docId = document.getElementById("docId").value;
      const data = {
        Name: document.getElementById("name").value,
        City: document.getElementById("city").value,
        State: document.getElementById("state").value,
        Type: document.getElementById("type").value,
        Webpage: document.getElementById("webpage").value
      };

      if (docId) {
        collection.doc(docId).set(data).then(clearForm);
      } else {
        collection.add(data).then(clearForm);
      }
    }

    function loadRecords() {
      collection.onSnapshot(snapshot => {
        const tbody = document.getElementById("recordsTable");
        tbody.innerHTML = "";
        snapshot.forEach(doc => {
          const data = doc.data();
          const row = `<tr>
            <td><strong>${data.Name}</strong></td>
            <td>${data.City}</td>
            <td>${data.State}</td>
            <td>${data.Type}</td>
            <td><a href="${data.Webpage}" target="_blank">${data.Webpage}</a></td>
            <td>
              <button class="btn-action edit" onclick="editRecord('${doc.id}', ${JSON.stringify(data).replace(/"/g, '&quot;')})">Edit</button>
              <button class="btn-action delete" onclick="deleteRecord('${doc.id}')">Delete</button>
            </td>
          </tr>`;
          tbody.innerHTML += row;
        });
      });
    }

    function editRecord(id, data) {
      document.getElementById("docId").value = id;
      document.getElementById("name").value = data.Name;
      document.getElementById("city").value = data.City;
      document.getElementById("state").value = data.State;
      document.getElementById("type").value = data.Type;
      document.getElementById("webpage").value = data.Webpage;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteRecord(id) {
      if (confirm("Are you absolute sure you want to delete this operational registry link?")) {
        collection.doc(id).delete();
      }
    }

    function clearForm() {
      document.getElementById("docId").value = "";
      document.getElementById("name").value = "";
      document.getElementById("city").value = "";
      document.getElementById("state").value = "";
      document.getElementById("type").value = "";
      document.getElementById("webpage").value = "";
    }

    function goBack() {
      window.location.href = "./05-sikh-welfare.html";
    }

    // Startup system initialize
    loadRecords();
  </script>

</body>
