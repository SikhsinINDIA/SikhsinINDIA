<body>

<h1>Sikh Welfare Organizations in India</h1>

<div class="filters">
  <div class="filter-group">
    <!-- <label for="stateFilter">State:</label> -->
    <select id="stateFilter"><option value="All">State</option></select>
  </div>
  <div class="filter-group">
    <!-- <label for="cityFilter">City:</label> -->
    <select id="cityFilter"><option value="All">City</option></select>
  </div>
  <div class="filter-group">
    <!-- <label for="nameFilter">Name:</label> -->
    <input type="text" id="nameFilter" placeholder="Search by Name" />
  </div>
  <div class="filter-group">
    <!-- <label for="typeFilter">Type:</label> -->
    <select id="typeFilter"><option value="All">Type</option></select>
  </div>
  <!-- <button id="clearFilters">Clear</button> -->

  <button type="button" id="clearFilters" style="width: 100px; height: 40px; font-size: 24px; background-color: #FF9933; color: black;">
    Clear
  </button>
</div>

<div class="table-container">
  <table id="recordsTable" aria-label="Sikh Welfare Table">
    <thead>
    <tr>
      <th>State</th>
      <th>City</th>
      <th>Name</th>
      <th>Type</th>
      <th>Webpage</th>
    </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="card-container" id="cardContainer" aria-live="polite"></div>

<!-- Self Service Form -->
<h2>Sangat to add details of Sikh Welfare Societies across India</h2>
<form id="selfServiceForm">
  <label for="selfName">Name:</label><br>
  <input type="text" id="selfName" name="selfName" required><br>

  <label for="selfCity">City:</label><br>
  <input type="text" id="selfCity" name="selfCity" required><br>

  <label for="selfState">State:</label><br>
  <input type="text" id="selfState" name="selfState" required><br>

  <label for="selfType">Type:</label><br>
  <input type="text" id="selfType" name="selfType" required><br>

  <label for="selfWebsite">Website:</label><br>
  <input type="text" id="selfWebsite" name="selfWebsite" placeholder="https://example.com"><br>

  <button type="submit">Submit</button>
  <p id="formStatus"></p>
</form>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
    authDomain: "sikhsinindia-67a6b.firebaseapp.com",
    projectId: "sikhsinindia-67a6b",
    storageBucket: "sikhsinindia-67a6b.appspot.com",
    messagingSenderId: "622603668882",
    appId: "1:622603668882:web:953c6a07864b235fdd054b",
    measurementId: "G-LHNTFNW14H"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const welfareCollection = collection(db, "Sikh_Welfare");
  const selfServiceCollection = collection(db, "Sikh_Welfare_Self");

  const stateFilter = document.getElementById("stateFilter");
  const cityFilter = document.getElementById("cityFilter");
  const nameFilter = document.getElementById("nameFilter");
  const typeFilter = document.getElementById("typeFilter");
  const clearFiltersBtn = document.getElementById("clearFilters");
  const tableBody = document.getElementById("tableBody");
  const cardContainer = document.getElementById("cardContainer");

  let allRecords = [];

  async function fetchData() {
    tableBody.innerHTML = "";
    cardContainer.innerHTML = "";
    try {
      const querySnapshot = await getDocs(welfareCollection);
      allRecords = [];
      const stateSet = new Set();
      const citySet = new Set();
      const typeSet = new Set();
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        allRecords.push(data);
        if (data.State) stateSet.add(data.State);
        if (data.City) citySet.add(data.City);
        if (data.Type) typeSet.add(data.Type);
      });
      populateFilterOptions(stateFilter, Array.from(stateSet).sort(), "State");
      populateFilterOptions(cityFilter, Array.from(citySet).sort(), "City");
      populateFilterOptions(typeFilter, Array.from(typeSet).sort(), "Types");
      displayRecords(allRecords);
    } catch (error) {
      tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Error loading records.</td></tr>`;
      cardContainer.innerHTML = `<p style="text-align:center;">Error loading records.</p>`;
    }
  }

  function populateFilterOptions(selectElem, options, defaultLabel) {
    selectElem.innerHTML = `<option value="All">${defaultLabel}</option>`;
    options.forEach(opt => {
      const option = document.createElement("option");
      option.value = opt;
      option.textContent = opt;
      selectElem.appendChild(option);
    });
  }

  function displayRecords(records) {
    tableBody.innerHTML = "";
    cardContainer.innerHTML = "";

    records.forEach(record => {
      const row = document.createElement("tr");
      ["State", "City", "Name", "Type", "Webpage"].forEach(field => {
        const cell = document.createElement("td");
        if (field === "Webpage" && record[field]) {
          cell.classList.add("webpage-cell");
          const link = document.createElement("a");
          link.href = record[field];
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          const icon = document.createElement("img");
          icon.src = "../pictures/00-index/click.png";
          icon.className = "small-icon";
          icon.alt = "Open Webpage";
          link.appendChild(icon);
          cell.appendChild(link);
        } else {
          cell.textContent = record[field] || "";
        }
        row.appendChild(cell);
      });
      tableBody.appendChild(row);
    });

    records.forEach(record => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML += `<p>${record.Name || ""} - ${record.Type || ""}</p>`;
      const secondLine = document.createElement("p");
      secondLine.textContent = `${record.City || ""}, ${record.State || ""}`;
      if (record.Webpage) {
        const link = document.createElement("a");
        link.href = record.Webpage;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.title = "Open Webpage";
        const icon = document.createElement("img");
        icon.src = "../pictures/00_Index/Click.png";
        icon.className = "small-icon";
        icon.alt = "Open Webpage";
        icon.style.marginLeft = "8px";
        icon.style.verticalAlign = "middle";
        link.appendChild(icon);
        secondLine.appendChild(link);
      }
      card.appendChild(secondLine);
      cardContainer.appendChild(card);
    });
  }

  function filterRecords() {
    const stateVal = stateFilter.value;
    const cityVal = cityFilter.value;
    const typeVal = typeFilter.value;
    const nameVal = nameFilter.value.trim().toLowerCase();
    const filtered = allRecords.filter(record => {
      return (stateVal === "All" || record.State === stateVal)
          && (cityVal === "All" || record.City === cityVal)
          && (typeVal === "All" || record.Type === typeVal)
          && (nameVal === "" || (record.Name && record.Name.toLowerCase().includes(nameVal)));
    });
    displayRecords(filtered);
  }

  stateFilter.addEventListener("change", filterRecords);
  cityFilter.addEventListener("change", filterRecords);
  typeFilter.addEventListener("change", filterRecords);
  nameFilter.addEventListener("input", filterRecords);
  clearFiltersBtn.addEventListener("click", () => {
    stateFilter.value = "All";
    cityFilter.value = "All";
    typeFilter.value = "All";
    nameFilter.value = "";
    displayRecords(allRecords);
  });

  document.getElementById("selfServiceForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("selfName").value.trim();
    const city = document.getElementById("selfCity").value.trim();
    const state = document.getElementById("selfState").value.trim();
    const type = document.getElementById("selfType").value.trim();
    const website = document.getElementById("selfWebsite").value.trim();
    const formStatus = document.getElementById("formStatus");
    formStatus.textContent = "Submitting...";

    try {
      await addDoc(selfServiceCollection, {
        Name: name,
        City: city,
        State: state,
        Type: type,
        Website: website
      });
      formStatus.style.color = "lightgreen";
      formStatus.textContent = "Submitted successfully!";
      e.target.reset();
    } catch (error) {
      formStatus.style.color = "red";
      formStatus.textContent = "Error submitting. Try again later.";
      console.error("Submission error:", error);
    }
  });

  fetchData();
</script>
