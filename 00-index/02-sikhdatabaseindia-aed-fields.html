<style>
body{margin:0;font-family:Arial;background:black;color:#FF9933;}
header{background:#FF9933;color:black;text-align:center;padding:15px;font-weight:bold;}
.container{max-width:900px;margin:auto;padding:15px;}

input,select{
width:100%;padding:10px;margin:5px 0;

}

background:#FF9933;color:black;padding:10px;margin:5px;
border:none;font-weight:bold;cursor:pointer;
}

table{width:100%;border-collapse:collapse;margin-top:15px;}
th,td{border:1px solid #FF9933;padding:8px;}
th{background:#111;}
td button{margin:2px 3px 2px 0;padding:6px 10px;font-size:12px;}
.btn-delete{background:#c0392b;color:#fff;}
</style>

<body>

<header>📊 Sikh Database India - Field Structure Manager</header>

<div class="container">

<h3>Add New Field</h3>
<input id="fieldName" placeholder="Field Name">

<select id="fieldType">
<option value="string">String</option>
<option value="number">Number</option>
<option value="boolean">Boolean</option>
<option value="date">Date</option>
</select>

<button onclick="addField()">Add</button>

<h3>Current Fields</h3>

<table>
<thead>
<tr><th>#</th><th>Field Name</th><th>Type</th><th>Actions</th></tr>
</thead>
<tbody id="fieldTable"></tbody>
</table>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
  authDomain: "sikhsinindia-67a6b.firebaseapp.com",
  projectId: "sikhsinindia-67a6b",
  storageBucket: "sikhsinindia-67a6b.appspot.com",
  messagingSenderId: "622603668882",
  appId: "1:622603668882:web:953c6a07864b235fdd054b"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

/* ✅ DEFAULT FIELDS WITH TYPES - matches the live sikhdatabaseindia schema
   written by 00-index/01-add-record.html */
let fields = [
{name:"Email", type:"string"},
{name:"Name", type:"string"},
{name:"GreetingName", type:"string"},
{name:"Password", type:"string"},
{name:"Mobile", type:"number"},
{name:"wa_consent", type:"boolean"},
{name:"wa_consent_at", type:"date"},
{name:"Age", type:"number"},
{name:"Address", type:"string"},
{name:"City", type:"string"},
{name:"State", type:"string"},
{name:"Gender", type:"string"},
{name:"Date_created", type:"date"}
];

/* ✅ RENDER */
function render(){
let html="";
fields.forEach((f,i)=>{
html+=`
<tr>
<td>${i+1}</td>
<td>${f.name || "(blank)"}</td>
<td>${f.type}</td>
<td>
<button onclick="renameField(${i})">Rename</button>
<button onclick="changeType(${i})">Type</button>
<button class="btn-delete" onclick="deleteField(${i})">Delete</button>
</td>
</tr>`;
});
document.getElementById("fieldTable").innerHTML=html;
}

/* ✅ LOAD FROM FIRESTORE */
async function loadFields(){
try{
const doc=await db.collection("Config").doc("SikhDatabaseIndiaFields").get();

if(doc.exists && doc.data().fields?.length){

fields = doc.data().fields.map(f=>{
if(typeof f==="string"){
return {name:f,type:"string"};
}
return f;
});

}

}catch(err){
console.log("Using default fields");
}

render();
}

/* ✅ SAVE */
async function save(){
try{
await db.collection("Config").doc("SikhDatabaseIndiaFields").set({fields});
render();
alert("Saved successfully");
}catch(err){
console.error(err);
alert("Error saving data: " + err.message);
}
}

/* ADD */
function addField(){
const name=document.getElementById("fieldName").value.trim();
const type=document.getElementById("fieldType").value;

if(!name) return alert("Enter field");

if(fields.find(f=>f.name===name)) return alert("Already exists");
fields.push({name,type});
document.getElementById("fieldName").value="";
render();   // show instantly
save();
}

/* DELETE - operates on the row's own index, never a typed name */
function deleteField(i){
const field=fields[i];
if(!field) return;
if(!confirm(`Delete field "${field.name || "(blank)"}"?`)) return;
fields.splice(i,1);
render();
save();
}

/* RENAME - operates on the row's own index, never a typed name */
function renameField(i){
const field=fields[i];
if(!field) return;
const newName=prompt("New field name:", field.name)?.trim();
if(!newName) return;
if(fields.some((f,idx)=>idx!==i && f.name===newName)) return alert("Another field already has that name");
field.name=newName;
render();
save();
}

/* CHANGE TYPE - operates on the row's own index, never a typed name */
function changeType(i){
const field=fields[i];
if(!field) return;
const valid=["string","number","boolean","date"];
const newType=prompt(`New type for "${field.name}" (string / number / boolean / date):`, field.type)?.trim().toLowerCase();
if(!newType) return;
if(!valid.includes(newType)) return alert("Type must be one of: string, number, boolean, date");
field.type=newType;
render();
save();
}

/* INIT */
loadFields();

</script>

</body>
