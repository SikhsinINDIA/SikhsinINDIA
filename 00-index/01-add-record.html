    function clearForm(keepEmail = true) {

      clearForm(false);

      document.getElementById("status").innerText = "";

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function validatePassword(pwd) {
      return /^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(pwd);
    }

    document.getElementById("editForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const name = document.getElementById("name").value.trim();
      const gname = document.getElementById("gname").value.trim();
      const password = document.getElementById("password").value;
      const mobile = document.getElementById("mobile").value.trim();
      const ageVal = document.getElementById("age").value.trim();
      const address = document.getElementById("address").value.trim();
      const city = document.getElementById("city").value.trim();
      const state = document.getElementById("state").value.trim();
      const gender = document.getElementById("gender").value;

      if (!email) { alert("Email is required."); return; }
      if (!validateEmail(email)) { alert("Email address is incorrect."); return; }
      if (!name) { alert("Name is required."); return; }
      if (!gname) { alert("Greeting Name is required."); return; }
      if (!password) { alert("Password is required."); return; }
      if (!validatePassword(password)) {
        alert("Password must be at least 8 characters long and contain both letters and numbers.");
        return;
      }
      if (!mobile) { alert("Mobile number is required."); return; }
      if (!/^\d{9,}$/.test(mobile)) { alert("Mobile number must be 9 digits or more."); return; }

      if (ageVal) {
        const age = Number(ageVal);
        if (age <= 1 || age >= 110) {
          alert("Age must be greater than 1 and less than 110.");
          return;
        }
      }

      if (address.length > 150) {
        alert("Address cannot exceed 150 characters.");
        return;
      }

      const data = {
        Email: email,
        Name: name,
        GreetingName: gname,
        Password: password,
        Mobile: Number(mobile),
        Age: ageVal ? Number(ageVal) : null,
        Address: address,
        City: city,
        State: state,
        Gender: gender,
        Date_created: firebase.firestore.FieldValue.serverTimestamp()
      };

      db.collection("sikhdatabaseindia").doc(email).set(data)
        .then(() => {
          document.getElementById("status").innerText = "🎉 Congratulations! You are now a member of Sikhs in INDIA.";

        })
        .catch(error => {
          console.error("Error adding/updating data: ", error);
          document.getElementById("status").innerText = "Error adding/updating data: " + error.message;
        });
