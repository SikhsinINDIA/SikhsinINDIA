  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --navy: #0d1b3e;
      --navy-mid: #162147;
      --gold: #F7941D;
      --cream: #f5f0e8;
      --gold-light: #F7941D;
      --white: #ffffff;
    }

    /* PAGE BACKGROUND */
    body {
      font-family: 'Lato', sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 8px;
    }

    /* MAIN CONTAINER */
    .poster {
      width: 100%;
      max-width: 450px;
      background: var(--cream);
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* HEADER WITH LOGO */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--navy);
      position: relative;
      padding: 24px 20px;
      text-align: center;
    }

    .logo-wrap {
      margin-bottom: 12px;
    }

    .logo-img {
      height: 70px;
      background: #fff;
      padding: 4px;
      border-radius: 6px;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 900;
      color: #fff;
      line-height: 1.2;
    }

    .hero-title span {
      color: var(--gold);
    }

    /* FORM WRAPPER */
    .wrapper {
      padding: 30px 36px;
    }

    .panel {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    label {
      display: block;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 8px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select,
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      font-family: 'Lato', sans-serif;
      background-color: #fafafa;
      color: #333;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(247, 148, 29, 0.15);
    }

    input[type="submit"] {
      width: 100%;
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      background: var(--navy);
      border: 2px solid var(--navy);
      padding: 12px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      margin-top: 5px;
    }

    input[type="submit"]:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--navy);
    }

    .error {
      color: #d93838;
      margin-top: 12px;
      font-size: 14px;
      text-align: center;
      font-weight: 600;
    }

    /* FOOTER BAR */
    .footer {
      background: var(--navy-mid);
      padding: 16px 36px;
      border-top: 2px solid var(--gold);
      margin-top: 10px;
    }

    .footer-content {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 3D gold style for the Back button */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'Lato', sans-serif;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--navy);
      background: linear-gradient(135deg, var(--gold-light) 0%, #e8830a 100%);
      border: none;
      border-radius: 5px;
      padding: 9px 24px;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 220, 120, 0.5),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 2px #9a5800,
        0 0 0 3.5px var(--gold);
      transition: filter 0.15s, transform 0.1s;
    }

    .btn-back:hover {
      filter: brightness(1.08);
    }

    .btn-back:active {
      transform: scale(0.97);
    }

    .btn-back svg {
      width: 12px;
      height: 12px;
    }

    /* MOBILE BREAKPOINTS */
    @media(max-width:480px) {
      .wrapper {
        padding: 20px 16px;
      }

      .panel {
        padding: 16px;
      }

      .footer {
        padding: 14px 16px;
      }
    }
  </style>

  <script>
    function validateLogin(event) {
      event.preventDefault(); // Stop form from submitting

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const error = document.getElementById("error-message");

      if (username === "Tavinder" && password === "arora12345") {
        window.location.href = "/05-sikh-welfare/05b-edit-sikh-welfare.html";
      } else {
        error.textContent = "ਗਲਤ ਉਪਭੋਗਤਾ ਨਾਮ ਜਾਂ ਪਾਸਵਰਡ।";
      }
    }

    function goBack() {
      window.location.href = "/pa/05-sikh-welfare/05-sikh-welfare.html";
    }
  </script>
  <script src="/pw-toggle.js" defer></script>

<body>

  <div class="poster">

    
    <div class="header">
      <div class="logo-wrap">
        <img class="logo-img" src="/pictures/00-index/sikhsinindia.png" alt="ਸਿੱਖਸ ਇਨ ਇੰਡੀਆ ਲੋਗੋ">
      </div>
      <div class="hero-title">ਅਕਾਊਂਟ <span>ਲੌਗਇਨ</span></div>
    </div>

    <div class="wrapper">
      
      <div class="panel">
        <form onsubmit="validateLogin(event)">
          <label for="username">ਉਪਭੋਗਤਾ ਨਾਮ</label>
          <select id="username" name="username" required>
            <option value="Tavinder">ਤਵਿੰਦਰ</option>
          </select>

          <label for="password">ਪਾਸਵਰਡ</label>
          <input type="password" id="password" name="password" placeholder="ਪਾਸਵਰਡ ਦਰਜ ਕਰੋ" required>

          <input type="submit" value="ਲੌਗਇਨ">
          <div class="error" id="error-message"></div>
        </form>
      </div>
    </div>

    
    <div class="footer">
      <div class="footer-content">
        <button type="button" onclick="goBack()" class="btn-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M19 12H5M5 12l7-7M5 12l7 7" />
          </svg>
          ਵਾਪਸ
        </button>
      </div>
    </div>
  </div>
