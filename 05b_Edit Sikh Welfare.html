  <style>

      --black: #000000;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--black);

    h2 {

    input {

    button {
      padding: 8px 16px;

    }

<body>

<h2>Sikh Social Welfare Organizations in India</h2>

<input type="text" id="name" placeholder="Name" />
<input type="text" id="city" placeholder="City" />
<input type="text" id="state" placeholder="State" />
<input type="text" id="type" placeholder="Type" />
<input type="text" id="webpage" placeholder="Webpage (e.g. file.html)" />
<input type="hidden" id="docId" />
<button onclick="addOrUpdateRecord()">Add / Update</button>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>City</th>
      <th>State</th>
      <th>Type</th>
      <th>Webpage</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="recordsTable"></tbody>
</table>

<script>
  // 🔧 Replace with your Firestore config
  const firebaseConfig = {
    apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
    authDomain: "sikhsinindia-67a6b.firebaseapp.com",
    projectId: "sikhsinindia-67a6b",
    storageBucket: "sikhsinindia-67a6b.appspot.com",
    messagingSenderId: "622603668882",
    appId: "1:622603668882:web:953c6a07864b235fdd054b",
    measurementId: "G-LHNTFNW14H"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const collection = db.collection("Sikh_Welfare");

  function addOrUpdateRecord() {
    const docId = document.getElementById("docId").value;
    const data = {
      Name: document.getElementById("name").value,
      City: document.getElementById("city").value,
      State: document.getElementById("state").value,
      Type: document.getElementById("type").value,
      Webpage: document.getElementById("webpage").value
    };

    if (docId) {
      collection.doc(docId).set(data).then(clearForm);
    } else {
      collection.add(data).then(clearForm);
    }
  }

  function loadRecords() {
    collection.onSnapshot(snapshot => {
      const tbody = document.getElementById("recordsTable");
      tbody.innerHTML = "";
      snapshot.forEach(doc => {
        const data = doc.data();
        const row = `<tr>
          <td>${data.Name}</td>
          <td>${data.City}</td>
          <td>${data.State}</td>
          <td>${data.Type}</td>
          <td><a href="${data.Webpage}" target="_blank">${data.Webpage}</a></td>
          <td>
            <button onclick="editRecord('${doc.id}', ${JSON.stringify(data).replace(/"/g, '&quot;')})">Edit</button>
            <button onclick="deleteRecord('${doc.id}')">Delete</button>
          </td>
        </tr>`;
        tbody.innerHTML += row;
      });
    });
  }

  function editRecord(id, data) {
    document.getElementById("docId").value = id;
    document.getElementById("name").value = data.Name;
    document.getElementById("city").value = data.City;
    document.getElementById("state").value = data.State;
    document.getElementById("type").value = data.Type;
    document.getElementById("webpage").value = data.Webpage;
  }

  function deleteRecord(id) {
    if (confirm("Delete this record?")) {
      collection.doc(id).delete();
    }
  }

  function clearForm() {
    document.getElementById("docId").value = "";
    document.getElementById("name").value = "";
    document.getElementById("city").value = "";
    document.getElementById("state").value = "";
    document.getElementById("type").value = "";
    document.getElementById("webpage").value = "";
  }

  // Load on startup
  loadRecords();
</script>
  <!-- Back Button -->
  <button type="button" onclick="goBack()" class="back-button">

  </button>

    function goBack() {
      window.location.href = "./05_Sikh_Welfare.html";
    }
    </script>
</body>
