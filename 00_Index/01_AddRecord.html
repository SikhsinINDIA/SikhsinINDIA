<body>

  <h1>Become Member of “Sikhs in India” Group - Belong, Connect & Thrive</h1>
  <h2>Membership open to everyone, not just Sikhs.  </h2> 

  <form id="editForm">
    <div class="form-row">
      <label for="email">Email: <span style="color: #f00;">*</span> <br> (mandatory)</label>
      <input type="email" id="email" placeholder="Email (used as ID)" required />

    <div class="form-row">

      <input type="text" id="name" placeholder="Your Full Name" />

    <div class="form-row">
      <label for="password">Password: <span style="color: #f00;">*</span> <br>(mandatory)</label>
      <input type="password" id="password" placeholder="Choose a password" />
    </div>

    <div class="form-row">
      <label for="mobile">Mobile: <span style="color: #f00;">*</span> <br>(mandatory)</label>
      <input type="number" id="mobile" placeholder="Mobile number (9 digits or more)" />
    </div>

    <div class="form-row">
      <label for="age">Age:</label>
      <input type="number" id="age" placeholder="Your age" />
    </div>

    <div class="form-row">
      <label for="address">Address:</label>
      <input type="text" id="address" placeholder="Your address" maxlength="150" />
    </div>
    <div class="form-row">
      <label for="city">City:</label>
      <input type="text" id="city" placeholder="Your city" maxlength="150" />
    </div>
        <div class="form-row">
      <label for="state">State:</label>
      <input type="text" id="state" placeholder="Your State" maxlength="150" />
    </div>

    <div class="form-row">
      <label for="gender">Gender:</label>
      <select id="gender">
        <option value="">-- Select Gender --</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
    </div>

    <div style="margin-top: 25px; text-align: center;">
      <!-- <button type="button" onclick="loadData()">Load Existing Data</button> -->
      <button type="submit">SUBMIT</button>
      <button type="button" onclick="resetForm()">Clear Form</button>
    </div>

    <p id="status"></p>
    <h3>If you face any issues, please contact <a href="mailto:sikhsinindiagmail.com">sikhsinindia@gmail.com</a></h3>

  </form>

    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">

  <script type="text/javascript">
    (function(){
      emailjs.init("-jtHOddqV8vT6Z7jg");
    })();

  <script>
    function goBack() {
      window.location.href = "../index.html";
    }
    function admin() {
      window.location.href = "../00_Index/01a_Password.html";
    }
    const firebaseConfig = {
      apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
      authDomain: "sikhsinindia-67a6b.firebaseapp.com",
      projectId: "sikhsinindia-67a6b",
      storageBucket: "sikhsinindia-67a6b.appspot.com",
      messagingSenderId: "622603668882",
      appId: "1:622603668882:web:953c6a07864b235fdd054b",
      measurementId: "G-LHNTFNW14H"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function loadData() {
      const email = document.getElementById("email").value.trim();
      if (!email) return alert("Please enter an email.");

      db.collection("SikhdatabaseIndia").doc(email).get()
        .then(doc => {
          if (!doc.exists) {
            document.getElementById("status").innerText = "No user found with this email.";
            clearForm(false);
            return;
          }

          const data = doc.data();
          document.getElementById("name").value = data.Name || "";
          document.getElementById("password").value = data.Password || "";
          document.getElementById("mobile").value = data.Mobile || "";
          document.getElementById("age").value = data.Age || "";
          document.getElementById("address").value = data.Address || "";
          document.getElementById("city").value = data.City || "";
          document.getElementById("state").value = data.State || "";
          document.getElementById("gender").value = data.Gender || "";
          document.getElementById("status").innerText = "Data loaded. You can now edit and update.";
          document.getElementById("email").disabled = true;
        })
        .catch(error => {
          console.error("Error loading data: ", error);
          document.getElementById("status").innerText = "Error loading data: " + error.message;
        });
    }

    function clearForm(keepEmail = true) {
      if (!keepEmail) document.getElementById("email").value = "";
      document.getElementById("name").value = "";
      document.getElementById("password").value = "";
      document.getElementById("mobile").value = "";
      document.getElementById("age").value = "";
      document.getElementById("address").value = "";
      document.getElementById("city").value = "";
      document.getElementById("state").value = "";
      document.getElementById("gender").value = "";
    }

    function resetForm() {
      clearForm(false);
      document.getElementById("email").disabled = false;
      document.getElementById("status").innerText = "";
    }

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function validatePassword(pwd) {
      return /^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(pwd);
    }

    document.getElementById("editForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const name = document.getElementById("name").value.trim();
      const password = document.getElementById("password").value;
      const mobile = document.getElementById("mobile").value.trim();
      const ageVal = document.getElementById("age").value.trim();
      const address = document.getElementById("address").value.trim();
      const city = document.getElementById("city").value.trim();
      const state = document.getElementById("state").value.trim();
      const gender = document.getElementById("gender").value;

      if (!email) {
        alert("Email is required.");
        return;
      }
      if (!validateEmail(email)) {
        alert("Email address is incorrect.");
        return;
      }

      if (!name) {
        alert("Name is required.");
        return;
      }

      if (!password) {
        alert("Password is required.");
        return;
      }
      if (!validatePassword(password)) {
        alert("Password must be at least 8 characters long and contain both letters and numbers.");
        return;
      }

      if (!mobile) {
        alert("Mobile number is required.");
        return;
      }

      if (!/^\d{9,}$/.test(mobile)) {
        alert("Mobile number must be 9 digits or more.");
        return;
      }

      if (ageVal) {
        const age = Number(ageVal);
        if (age <= 1 || age >= 110) {
          alert("Age must be greater than 1 and less than 110.");
          return;
        }
      }

      if (address.length > 150) {
        alert("Address cannot exceed 150 characters.");
        return;
      }

      const data = {
        Email: email,
        Name: name,
        Password: password,
        Mobile: Number(mobile),
        Age: ageVal ? Number(ageVal) : null,
        Address: address,
        City: city,
        State: state,
        Gender: gender,
        Date_created: firebase.firestore.FieldValue.serverTimestamp()
      };

      db.collection("sikhdatabaseindia").doc(email).set(data)
        .then(() => {
          document.getElementById("status").innerText = "🎉 Congratulations! You are now a member of Sikhs in INDIA.";
          sendEmail(email, name, mobile, ageVal, address, city, state, gender);
          clearForm(false);
        })
        .catch(error => {
          console.error("Error adding/updating data: ", error);
          document.getElementById("status").innerText = "Error adding/updating data: " + error.message;
        });
    });

    function sendEmail(email, name, mobile, age, address, city, state, gender) {
      const emailParams = {
        email: email,
        name: name,
        mobile: mobile,
        age: age,
        address: address,
        city: city,
        state: state,
        gender: gender
      };

 // 1. Send confirmation to user
  emailjs.send("service_dlzwpyu", "template_x1uksg8", emailParams)
    .then(response => {
      console.log("✅ Email sent to user:", response.status, response.text);
    })
    .catch(error => {
      console.error("❌ Failed to send email to user:", error);
      document.getElementById("status").innerText = "Error sending email: " + error.message;
    });

  // 2. Send backup email to admin
  const backupParams = {
    email: "sikhsinindia@gmail.com", // admin's email
    name: name,
    mobile: mobile,
    age: age,
    address: address,
    city: city,
    state: state,
    gender: gender,
    useremail: email // showing who filled the form
  };

  emailjs.send("service_dlzwpyu", "template_x1uksg8", backupParams)
    .then(response => {
      console.log("✅ Backup email sent to admin:", response.status, response.text);
    })
    .catch(error => {
      console.error("❌ Failed to send backup email to admin:", error);
    });
} 
  </script>
