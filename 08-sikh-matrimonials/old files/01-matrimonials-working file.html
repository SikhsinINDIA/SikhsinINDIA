  <script>

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function uploadResume(file, folder = "uploads") {
      const base64 = await toBase64(file);

      const response = await fetch("https://script.google.com/macros/s/AKfycbzGRmVAJxFz8IOnyYcoPLwo-zFeBNF8jP0j9dk5TQIJ6Ovm8IxWVK62_7vUj8ngP5k/exec", {
        method: "POST",
        body: new URLSearchParams({
          file: base64.split(",")[1],
          type: file.type,
          name: Date.now() + "_" + file.name
        })
      });

      const result = await response.json();

      if (!result.success) {
        throw new Error(result.error);
      }

      return result.url;
    }

    // helper
    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
      });
    }


    // We cannot read response, so we reconstruct logic
    // const fileName = Date.now() + "_" + file.name;
    // return "https://drive.google.com/drive/folders/1pNiZ1MxxhQskMxib4k_ejAVVDqxTnAZd";


    async function getNextSNo() {
      const snapshot = await db.collection('Matrimonials').orderBy('SNo', 'desc').limit(1).get();
      if (snapshot.empty) return 1;
      const last = snapshot.docs[0].data().SNo || 0;
      return Number(last) + 1;
    }

    function showLoader(message = "Please wait... Uploading files") {
  const loader = document.getElementById("loaderOverlay");
  loader.style.display = "flex";
  loader.innerHTML = "⏳ " + message;
}

function hideLoader() {
  document.getElementById("loaderOverlay").style.display = "none";
}

function previewImage(inputId, frameId) {
  document.getElementById(inputId).addEventListener("change", function(e) {
    const file = e.target.files[0];
    const frame = document.getElementById(frameId);

    if (!file) return;

    if (!file.type.startsWith("image/")) {
      alert("Please upload an image only");
      return;
    }

    frame.src = URL.createObjectURL(file);
    frame.style.display = "block";
  });
}

previewImage("photo1", "preview1");
previewImage("photo2", "preview2");

    document.getElementById('resume').addEventListener('change', function (e) {
      const file = e.target.files[0];
      const preview = document.getElementById('pdfPreview');

      if (!file) return;

      if (file.type !== "application/pdf") {
        alert("Please upload a PDF file only");
        preview.style.display = "none";
        return;
      }

      const fileURL = URL.createObjectURL(file);
      preview.src = fileURL;
      preview.style.display = "block";
    });

   document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();

  try {
    showLoader("Uploading photos...");

    const photo1File = document.getElementById('photo1').files[0];
    const photo2File = document.getElementById('photo2').files[0];

    let photo1URL = "";
    let photo2URL = "";

    if (photo1File) {
      photo1URL = await uploadResume(photo1File);
    }

    if (photo2File) {
      photo2URL = await uploadResume(photo2File);
    }

    showLoader("Uploading resume...");

    const resumeFile = document.getElementById('resume').files[0];
    let resumeURL = '';

    if (resumeFile) {
      resumeURL = await uploadResume(resumeFile);
    }

    showLoader("Saving data...");

    const data = {};
    data.SNo = await getNextSNo();

    document.querySelectorAll('input, textarea, select').forEach(el => {
      if (el.id && el.type !== 'file') {
        data[el.id] = el.value;
      }
    });

    data.Photo1 = photo1URL;
    data.Photo2 = photo2URL;
    data.Resume = resumeURL;

    await db.collection('Matrimonials').add(data);

    showLoader("✅ File saved successfully!");

    setTimeout(() => {
      hideLoader();
      alert('Saved successfully');
      document.getElementById('form').reset();
    }, 1500);

  } catch (err) {
    hideLoader();
    alert("Error: " + err.message);
  }
});
