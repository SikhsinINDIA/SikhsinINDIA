    async function uploadFile(file, folderName) {
      const base64 = await toBase64(file);

      const response = await fetch("https://script.google.com/macros/s/AKfycbzBuAZuk3tGCJoDUNhUUzly7-yeRX4dEV7h4jjUd_upMyE7_ZOV6f3Smk9m3xp25oc/exec", {
        method: "POST",
        body: new URLSearchParams({
          file: base64.split(",")[1],
          type: file.type,
          name: file.name,
          folder: folderName   // 👈 NEW
        })
      });

      const result = await response.json();
      if (!result.success) throw new Error(result.error);

      return result.url;
    }

    // helper
    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
      });
    }

    async function fixImageOrientation(file) {
      return new Promise((resolve) => {
        const img = new Image();
        const url = URL.createObjectURL(file);

        img.onload = () => {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          canvas.width = img.width;
          canvas.height = img.height;

          ctx.drawImage(img, 0, 0);

          canvas.toBlob((blob) => {
            resolve(blob);
          }, file.type);
        };

        img.src = url;
      });
    }

    function doPost(e) {
      try {
        const data = e.parameter;

        const fileBlob = Utilities.newBlob(
          Utilities.base64Decode(data.file),
          data.type,
          data.name
        );

        const parentFolder = DriveApp.getFolderById("1pNiZ1MxxhQskMxib4k_ejAVVDqxTnAZd");

        // ✅ create/find folder properly
        let folder;
        const folders = parentFolder.getFoldersByName(data.folder);

        if (folders.hasNext()) {
          folder = folders.next();
        } else {
          folder = parentFolder.createFolder(data.folder);
        }

        const file = folder.createFile(fileBlob);

        return ContentService.createTextOutput(JSON.stringify({
          success: true,
          url: file.getUrl()
        })).setMimeType(ContentService.MimeType.JSON);

      } catch (err) {
        return ContentService.createTextOutput(JSON.stringify({
          success: false,
          error: err.toString()
        }));
      }
    }


    function updateHeightCm() {
      const feet = parseInt(document.getElementById('Height_Feet').value) || 0;
      const inch = parseInt(document.getElementById('Height_Inch').value) || 0;

      const cm = (feet * 12 * 2.54) + (inch * 2.54);
      const display = document.getElementById('Height_Cm_Display');

      if (feet === 0 && inch === 0) {
        display.value = "";
      } else {
        display.value = (Math.round(cm * 10) / 10) + " cm";
      }
    }
