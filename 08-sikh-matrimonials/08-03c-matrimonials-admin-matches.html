  <div class="wrapper">


<div class="filters filter-bar">

    <div>
        <label>
            <input type="checkbox" id="genderFilter" checked>
            Enable Male ↔ Female Matching
        </label>
    </div>

    <div>
        <label>
            <input type="checkbox" id="ageFilter">
            Enable Age Matching
        </label>
    </div>

    <div>
        <label>Age Difference:</label>

        <select id="ageDifference">
            <option value="0">0 Years</option>
            <option value="1">1 Year</option>
            <option value="2">2 Years</option>
            <option value="3">3 Years</option>
            <option value="4">4 Years</option>

            <option value="10">10 Years</option>
        </select>
    </div>

    <button onclick="generateMatches()">
        Generate Matches
    </button>

</div>

<div class="table-container">
<table>

    <thead>
        <tr>
            <th style="width:35%">Profile</th>
            <th>Matching Profiles</th>
        </tr>
    </thead>

    <tbody id="matchesBody">
    </tbody>

</table>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
    authDomain: "sikhsinindia-67a6b.firebaseapp.com",
    projectId: "sikhsinindia-67a6b",
    storageBucket: "sikhsinindia-67a6b.appspot.com",
    messagingSenderId: "622603668882",
    appId: "1:622603668882:web:953c6a07864b235fdd054b"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

let allProfiles = [];

async function loadProfiles(){

    const snapshot = await db
        .collection('Matrimonials')
        .orderBy('SNo','asc')
        .get();

    allProfiles = [];

    snapshot.forEach(doc => {

        const d = doc.data();

        allProfiles.push({
            ...d,
            Age: parseInt(d.Age) || 0
        });

    });

    generateMatches();
}

function isGenderMatch(profile1, profile2, enableGenderFilter){

    if(!enableGenderFilter){
        return true;
    }

    const g1 = (profile1.Gender || '').toLowerCase();
    const g2 = (profile2.Gender || '').toLowerCase();

    return (
        (g1 === 'male' && g2 === 'female') ||
        (g1 === 'female' && g2 === 'male')
    );
}

function isAgeMatch(profile1, profile2, enableAgeFilter, ageDiff){

    if(!enableAgeFilter){
        return true;
    }

    const g1 = (profile1.Gender || '').toLowerCase();
    const g2 = (profile2.Gender || '').toLowerCase();

    const age1 = parseInt(profile1.Age) || 0;
    const age2 = parseInt(profile2.Age) || 0;

    // Male should be elder than Female
    if(g1 === 'male' && g2 === 'female'){

        return age1 >= age2 &&
               (age1 - age2) <= ageDiff;
    }

    // Female should be younger than Male
    if(g1 === 'female' && g2 === 'male'){

        return age2 >= age1 &&
               (age2 - age1) <= ageDiff;
    }

    // Male-Male or Female-Female
    return Math.abs(age1 - age2) <= ageDiff;
}

function generateMatches(){

    const tbody = document.getElementById('matchesBody');

    tbody.innerHTML = '';

    const enableGenderFilter =
        document.getElementById('genderFilter').checked;

    const enableAgeFilter =
        document.getElementById('ageFilter').checked;

    const ageDiff =
        parseInt(document.getElementById('ageDifference').value);

    allProfiles.forEach(profile => {

        const tr = document.createElement('tr');

        let matchesHTML = '';

        const matches = allProfiles.filter(other => {

            // Skip same profile
            if(profile.SNo === other.SNo){
                return false;
            }

            // Gender Filter
            if(!isGenderMatch(
                profile,
                other,
                enableGenderFilter
            )){
                return false;
            }

            // Age Filter
            if(!isAgeMatch(
                profile,
                other,
                enableAgeFilter,
                ageDiff
            )){
                return false;
            }

            return true;

        });

        if(matches.length > 0){

            matches.forEach(m => {

                matchesHTML += `
                    <div class="match-item">
                        ${m.SNo} - ${m.Name || ''}
                        (${m.Gender || ''}, Age: ${m.Age || ''})
                    </div>
                `;

            });

        }else{

            matchesHTML =
                `<div class="no-match">No Match Found</div>`;
        }

        tr.innerHTML = `

            <td>
                <b>${profile.SNo}</b> - ${profile.Name || ''}
                <br>
                Gender: ${profile.Gender || ''}
                <br>
                Age: ${profile.Age || ''}
            </td>

            <td>
                ${matchesHTML}
            </td>
        `;

        tbody.appendChild(tr);

    });

}

loadProfiles();

</script>
