    async function uploadFile(file, folderName) {
      const base64 = await toBase64(file);

      const response = await fetch("https://script.google.com/macros/s/AKfycbzBuAZuk3tGCJoDUNhUUzly7-yeRX4dEV7h4jjUd_upMyE7_ZOV6f3Smk9m3xp25oc/exec", {
        method: "POST",
        body: new URLSearchParams({
          file: base64.split(",")[1],
          type: file.type,
          name: file.name,
          folder: folderName   // 👈 NEW
        })
      });

      const result = await response.json();
      if (!result.success) throw new Error(result.error);

      return result.url;
    }

    // helper
    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
      });
    }

    async function fixImageOrientation(file) {
      return new Promise((resolve) => {
        const img = new Image();
        const url = URL.createObjectURL(file);

        img.onload = () => {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          canvas.width = img.width;
          canvas.height = img.height;

          ctx.drawImage(img, 0, 0);

          canvas.toBlob((blob) => {
            resolve(blob);
          }, file.type);
        };

        img.src = url;
      });

    function doPost(e) {
      try {
        const data = e.parameter;

        const fileBlob = Utilities.newBlob(
          Utilities.base64Decode(data.file),
          data.type,
          data.name
        );

        const parentFolder = DriveApp.getFolderById("1pNiZ1MxxhQskMxib4k_ejAVVDqxTnAZd");

        // ✅ create/find folder properly
        let folder;
        const folders = parentFolder.getFoldersByName(data.folder);

        if (folders.hasNext()) {
          folder = folders.next();
        } else {
          folder = parentFolder.createFolder(data.folder);
        }

        const file = folder.createFile(fileBlob);

        return ContentService.createTextOutput(JSON.stringify({
          success: true,
          url: file.getUrl()
        })).setMimeType(ContentService.MimeType.JSON);

      } catch (err) {
        return ContentService.createTextOutput(JSON.stringify({
          success: false,
          error: err.toString()
        }));
      }
    }

    function calculateAge() {

  const dobValue = document.getElementById('Date_of_Birth').value;

  if (!dobValue) {
    return;
  }

  const dobDate = new Date(dobValue); // now works correctly
  const today = new Date();

  let age = today.getFullYear() - dobDate.getFullYear();

  const monthDiff = today.getMonth() - dobDate.getMonth();

  if (
    monthDiff < 0 ||
    (monthDiff === 0 && today.getDate() < dobDate.getDate())
  ) {
    age--;
  }

  document.getElementById("Age").value = age;
}
