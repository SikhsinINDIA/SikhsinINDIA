name: Update Daily Hukamnama

on:
  schedule:
    # 01:30 UTC = 07:00 IST, after Sri Harmandir Sahib's morning Hukamnama
    - cron: '30 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch today's Hukamnama, rewrite data/hukamnama.* and the homepage card
        id: hukamnama
        continue-on-error: true
        run: node scripts/update-hukamnama.js

      # Runs even if the Hukamnama fetch failed, so the events bar and the
      # Sikh History card still move on to the new day.
      - name: Write this month's events and today's Sikh History into the homepage
        run: node scripts/update-homepage-today.js

      - name: Commit and push if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hukamnama.json data/hukamnama.js index.html
          git diff --staged --quiet || git commit -m "Update daily Hukamnama"
          git push

      # Keep the run marked as failed when the Hukamnama could not be fetched,
      # so it still shows up in the Actions tab.
      - name: Report a failed Hukamnama fetch
        if: steps.hukamnama.outcome == 'failure'
        run: exit 1
