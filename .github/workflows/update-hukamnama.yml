name: Update Daily Hukamnama

on:
  schedule:
    # 01:30 UTC = 07:00 IST, after Sri Harmandir Sahib's morning Hukamnama
    - cron: '30 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch today's Hukamnama and rewrite data/hukamnama.*
        run: node scripts/update-hukamnama.js

      - name: Commit and push if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hukamnama.json data/hukamnama.js
          git diff --staged --quiet || git commit -m "Update daily Hukamnama"
          git push
