name: Build Site Search Index

# Rebuilds data/search-index-{en,hi,pa}.json, which search.html (and
# hi/search.html, pa/search.html) use to search the whole site.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/search-index-*.json'
  schedule:
    # 02:15 UTC = 07:45 IST, after the daily Hukamnama update adds its page
    - cron: '15 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# One run at a time; a newer push replaces a queued run.
concurrency:
  group: search-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the search index from sitemap.xml
        run: node scripts/build-search-index.js

      - name: Commit and push if the index changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/search-index-en.json data/search-index-hi.json data/search-index-pa.json
          if git diff --staged --quiet; then
            echo "Search index unchanged."
            exit 0
          fi
          git commit -m "Update site search index"
          # Someone may have pushed meanwhile: rebase onto it and retry.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
