  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: black;
      color: #FF9933;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background-color: #FF9933;
      padding: 1rem;
    }

    h1 {
      font-size: 2.5rem;
      margin: 1rem 0;
      color: black;
    }

    .content, #form-container {
      padding: 2rem;
      max-width: 800px;
      margin: auto;
      text-align: left;
    }

    label, input, textarea {
      display: block;
      width: 100%;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    input, textarea {
      padding: 0.5rem;
      border: 1px solid #FF9933;
      border-radius: 5px;
      background-color: #222;
      color: #FF9933;
    }

    button {
      background-color: #FF9933;
      border: none;
      padding: 0.75rem 1.5rem;
      margin: 0.5rem;
      font-size: 1rem;
      color: black;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background-color: black;
      color: #FF9933;
      border: 2px solid #FF9933;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sikh Sevadars - Self Upload Data</h1>
  </header>

  <div id="form-container">
    <form id="sevadar-form">
      <input type="hidden" id="docId" />
      <label>Name: <input type="text" id="name" required></label>
      <label>Mobile: <input type="text" id="mobile" required></label>
      <label>Specializes In: <input type="text" id="specializes" required></label>
      <label>City: <input type="text" id="city" required></label>
      <label>State: <input type="text" id="state" required></label>
      <label>Photo URL: <input type="text" id="photo"></label>
      <label>Video URL: <input type="text" id="video"></label>
      <button type="submit">Submit</button>
      <button type="button" onclick="clearForm()">Clear</button>
    </form>
  </div>

  <button type="button" onclick="goBack()" style="width: 100px; height: 40px; font-size: 24px; background-color: #FFA500; color: black; display: block; margin: 20px auto 0 auto;">Back</button>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
      authDomain: "sikhsinindia-67a6b.firebaseapp.com",
      projectId: "sikhsinindia-67a6b",
      storageBucket: "sikhsinindia-67a6b.appspot.com",
      messagingSenderId: "622603668882",
      appId: "1:622603668882:web:953c6a07864b235fdd054b",
      measurementId: "G-LHNTFNW14H"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById("sevadar-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("docId").value;
      const data = {
        Name: document.getElementById("name").value,
        Mobile: document.getElementById("mobile").value,
        Specializes: document.getElementById("specializes").value,
        City: document.getElementById("city").value,
        State: document.getElementById("state").value,
        Photo: document.getElementById("photo").value,
        Video: document.getElementById("video").value,
      };

      try {
        if (id) {
          await db.collection("Sikh_Sevadars_Self").doc(id).update(data);
        } else {
          await db.collection("Sikh_Sevadars_Self").add(data);
        }
        clearForm();
      } catch (error) {
        console.error("Error saving record:", error);
      }
    });

    function clearForm() {
      document.getElementById("sevadar-form").reset();
      document.getElementById("docId").value = '';
    }

    function goBack() {
      window.location.href = "./04_Sikh Sevadars.html";
    }
  </script>
</body>
</html>
