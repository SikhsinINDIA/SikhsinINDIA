<!DOCTYPE html>
<html>
<head>
  <title>Firebase Init Test</title>
</head>
<body>
  <h2>Firebase Init Test</h2>
  <p id="status">Loading...</p>

  <!-- Load Firebase compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-firestore-compat.js"></script>

  <script>
    // Check if firebase is loaded
    if (typeof firebase === 'undefined') {
      document.getElementById('status').textContent = 'Firebase SDK did NOT load!';
      console.error('Firebase SDK not found');
    } else {
      document.getElementById('status').textContent = 'Firebase SDK loaded successfully.';
      console.log('Firebase SDK loaded:', firebase);

      const firebaseConfig = {
        apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
        authDomain: "sikhsinindia-67a6b.firebaseapp.com",
        projectId: "sikhsinindia-67a6b",
        storageBucket: "sikhsinindia-67a6b.appspot.com",
        messagingSenderId: "622603668882",
        appId: "1:622603668882:web:953c6a07864b235fdd054b"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      db.collection("Sikh_Sevadars").get()
        .then(snapshot => {
          document.getElementById('status').textContent = `Loaded ${snapshot.size} records`;
          console.log(snapshot.docs.map(d => d.data()));
        })
        .catch(err => {
          document.getElementById('status').textContent = `Error fetching data: ${err.message}`;
          console.error(err);
        });
    }
  </script>
</body>
</html>
