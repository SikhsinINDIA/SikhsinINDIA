  <meta charset="UTF-8">

  <title>Sikhs in India | Register Account</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --navy: #0d1b3e;
      --navy-mid: #162147;
      --gold: #F7941D;
      --cream: #f5f0e8;
      --gold-light: #F7941D;
      --white: #ffffff;
    }

    body {
      font-family: 'Lato', sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      padding: 20px 8px;
    }

    .poster {
      width: 100%;
      max-width: 540px;
      background: var(--cream);
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      overflow: hidden;
    }

    /* HEADER */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--navy);
      padding: 24px;
      text-align: center;
      background: linear-gradient(160deg, var(--navy), #1a2a5e);
    }

    .logo-img {
      height: 90px;
      background: #fff;
      padding: 4px;
      border-radius: 6px;
      margin-bottom: 14px;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(26px, 5vw, 36px);
      font-weight: 900;
      color: #fff;
    }

    .hero-title span {
      color: var(--gold);
    }

    /* FORM CONTAINER */
    .wrapper {
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h2 {
      font-family: 'Playfair Display', serif;
      color: var(--navy);
      text-align: center;
      font-size: 24px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      font-family: 'Lato', sans-serif;
      font-size: 16px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 6px;
      background: #fff;
      color: var(--navy);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(247, 148, 29, 0.15);
    }

    .nav-link-wrap {
      text-align: center;
      margin-top: 10px;
    }

    .nav-link {
      font-size: 14px;
      color: var(--navy);
      text-decoration: underline;
      font-weight: 700;
    }

    .nav-link:hover {
      color: var(--gold);
    }

    /* ── FOOTER AREA ── */
    .footer {
      background: var(--navy-mid);
      padding: 20px;
      border-top: 2px solid var(--gold);
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* 3D GOLD ACTION BUTTON */
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: 'Lato', sans-serif;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--navy);
      background: linear-gradient(135deg, var(--gold-light) 0%, #e8830a 100%);
      border: none;
      border-radius: 5px;
      padding: 12px 24px;
      width: 100%;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 220, 120, 0.5),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 2px #9a5800,
        0 0 0 3.5px var(--gold);
      transition: filter 0.15s, transform 0.1s;
    }

    .btn-action:hover {
      filter: brightness(1.08);
    }

    .btn-action:active {
      transform: scale(0.98);
      filter: brightness(0.93);
    }

    .footer-text {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
    }
    .footer {
      background: var(--navy-mid);
      padding: 16px 24px;
      border-top: 2px solid var(--gold);
      margin-top: 20px;
    }

    .footer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }

    .footer-left {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .footer-right {
      font-size: 9px;
      color: var(--gold);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* 3D GOLD MAIN SUBMIT BUTTON */
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: 'Lato', sans-serif;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--navy);
      background: linear-gradient(135deg, var(--gold-light) 0%, #e8830a 100%);
      border: none;
      border-radius: 5px;
      padding: 12px 24px;
      width: 100%;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 220, 120, 0.5),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 2px #9a5800,
        0 0 0 3.5px var(--gold);
      transition: filter 0.15s, transform 0.1s;
    }

    .btn-action:hover {
      filter: brightness(1.08);
    }

    .btn-action:active {
      transform: scale(0.98);
      filter: brightness(0.93);
    }

    /* Back button — 3D gold style matching footer */
    .btn-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: 'Lato', sans-serif;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--navy);
      background: linear-gradient(135deg, var(--gold-light) 0%, #e8830a 100%);
      border: none;
      border-radius: 5px;
      padding: 8px 14px;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 220, 120, 0.5),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 2px #9a5800,
        0 0 0 3.5px var(--gold);
      transition: filter 0.15s, transform 0.1s;
      flex-shrink: 0;
      width: 100%;
      max-width: 200px;
    }

    .btn-back:hover {
      filter: brightness(1.08);
    }

    .btn-back:active {
      transform: scale(0.97);
      filter: brightness(0.93);
    }

    .btn-back svg {
      width: 12px;
      height: 12px;
    }
  </style>

<body>

  <div class="poster">
    <div class="header">
      <img class="logo-img" src="../../pictures/00-index/sikhsinindia.png" alt="Sikhs In India Logo">
      <div class="hero-title">Register for <span>Sehaj Path</span></div>
    </div>

    <div class="wrapper">
      <h2>Create Account for Sehaj Path</h2>
      
      <input id="email" type="email" placeholder="Email Address">
      <input id="phone" type="tel" placeholder="Phone Number">
      <input id="password" type="password" placeholder="Create Password">

      <button onclick="signup()" class="btn-action">Register Profile</button>

      <div class="nav-link-wrap">
        <a class="nav-link" href="login.html">Already have an account? Login here</a>
      </div>
    </div>

    <div class="footer">
      <div class="footer-content">
        <a href="../03-nitnem-path.html" class="btn-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M5 12l7-7M5 12l7 7" />
          </svg>
          Back to Nitnem Path
        </a>
        <div class="footer-left">© 2026 Sikhs in India</div>
        <div class="footer-right">Preserving Sikh Heritage & Unity</div>
      </div>
    </div>
  </div>
  </div>

  <script type="module">
    import {
      auth, db,
      createUserWithEmailAndPassword,
      doc, setDoc
    } from "./firebase.js";

    window.signup = async () => {
      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;
      const password = document.getElementById("password").value;

      if (!email || !phone || !password) {
        alert("Please fill out all registration fields");
        return;
      }

      try {
        const userCred = await createUserWithEmailAndPassword(auth, email, password);

        await setDoc(doc(db, "users", userCred.user.uid), {
          email,
          phone,
          createdAt: new Date()
        });

        alert("Registration successful!");
        window.location.href = "login.html";
      } catch (error) {
        alert("Registration Failed: " + error.message);
      }
    };
  </script>

</body>
</html>
