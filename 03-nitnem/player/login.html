  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --navy: #0d1b3e;
      --navy-mid: #162147;
      --gold: #F7941D;
      --cream: #f5f0e8;
      --gold-light: #F7941D;
      --white: #ffffff;
    }

    body {
      font-family: 'Lato', sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      padding: 20px 8px;
    }

    .poster {
      width: 100%;
      max-width: 540px;
      background: var(--cream);
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      overflow: hidden;
    }

    /* HEADER */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--navy);
      padding: 24px;
      text-align: center;
      background: linear-gradient(160deg, var(--navy), #1a2a5e);
    }

    .logo-img {
      height: 90px;
      background: #fff;
      padding: 4px;
      border-radius: 6px;
      margin-bottom: 14px;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(26px, 5vw, 36px);
      font-weight: 900;
      color: #fff;
    }

    .hero-title span {
      color: var(--gold);
    }

    /* CONTENT FORM AREA */
    .wrapper {
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h2 {
      font-family: 'Playfair Display', serif;
      color: var(--navy);
      text-align: center;
      font-size: 24px;
      margin-bottom: 8px;
    }

    /* INPUTS */
    input {
      width: 100%;
      padding: 14px 16px;
      font-family: 'Lato', sans-serif;
      font-size: 16px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 6px;
      background: #fff;
      color: var(--navy);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(247, 148, 29, 0.15);
    }

    .nav-link-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding: 0 4px;
    }

    .nav-link {
      font-size: 14px;
      color: var(--navy);
      text-decoration: underline;
      font-weight: 700;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }

    .nav-link:hover {
      color: var(--gold);
    }

    /* FOOTER AREA */
    .footer {
      background: var(--navy-mid);
      padding: 16px 24px;
      border-top: 2px solid var(--gold);
      margin-top: 20px;
    }

    .footer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }

    .footer-left {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .footer-right {
      font-size: 9px;
      color: var(--gold);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* BUTTONS */
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: 'Lato', sans-serif;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--navy);
      background: linear-gradient(135deg, var(--gold-light) 0%, #e8830a 100%);
      border: none;
      border-radius: 5px;
      padding: 12px 24px;
      width: 100%;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 220, 120, 0.5),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 2px #9a5800,
        0 0 0 3.5px var(--gold);
      transition: filter 0.15s, transform 0.1s;
    }

    .btn-action:hover {
      filter: brightness(1.08);
    }

    .btn-action:active {
      transform: scale(0.98);
      filter: brightness(0.93);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: 'Lato', sans-serif;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--navy);
      background: linear-gradient(135deg, var(--gold-light) 0%, #e8830a 100%);
      border: none;
      border-radius: 5px;
      padding: 8px 14px;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 220, 120, 0.5),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 2px #9a5800,
        0 0 0 3.5px var(--gold);
      transition: filter 0.15s, transform 0.1s;
      flex-shrink: 0;
      width: 100%;
      max-width: 200px;
    }

    .btn-back svg {
      width: 12px;
      height: 12px;
    }

    /* MODAL UI */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 27, 62, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 0 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: var(--cream);
      width: 100%;
      max-width: 440px;
      border-radius: 8px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.5);
      border: 3px solid var(--gold);
      overflow: hidden;
      transform: translateY(-20px);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-box {
      transform: translateY(0);
    }

    .modal-header {
      background: var(--navy);
      color: #fff;
      padding: 18px;
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
    }

    .modal-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-desc {
      font-size: 14px;
      color: var(--navy);
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .btn-cancel {
      width: 100%;
      padding: 12px;
      background: #ddd;
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 5px;
      font-weight: 700;
      color: #333;
      cursor: pointer;
      font-family: 'Lato', sans-serif;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 1px;
    }
    
    .btn-cancel:hover {
      background: #ccc;
    }
  </style>

  <!-- Load Firebase Compatibility Libraries (Safe for file:/// local testing) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

<body>

  <div class="poster">
    <div class="header">
      <img class="logo-img" src="../../pictures/00-index/sikhsinindia.png" alt="Sikhs In India Logo">
      <div class="hero-title">Sehaj Path - <span>Login</span></div>
    </div>

    <div class="wrapper">
      <h2>Welcome Back</h2>
      
      <input id="identifier" placeholder="Email or Phone">
      <input id="password" type="password" placeholder="Password">

      <button onclick="login()" class="btn-action">Secure Login</button>

      <div class="nav-link-wrap">
        <a class="nav-link" href="signup.html">New user? Signup</a>
        <button class="nav-link" onclick="toggleModal(true)">Forgot Password?</button>
      </div>
    </div>

    <div class="footer">
      <div class="footer-content">
        <a href="../03-nitnem-path.html" class="btn-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M5 12l7-7M5 12l7 7" />
          </svg>
          Back to Nitnem Path
        </a>
        <div class="footer-left">© 2026 Sikhs in India</div>
        <div class="footer-right">Preserving Sikh Heritage & Unity</div>
      </div>
    </div>
  </div>

  <!-- PASSWORD RESET MODAL UI -->
  <div id="reset-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">Reset Password</div>
      <div class="modal-body">
        <p class="modal-desc">Enter the email address linked to your account. We will send you a secure validation link to create a new password.</p>
        <input id="reset-email" type="email" placeholder="Enter your registered Email">
        <div class="modal-actions">
          <button onclick="toggleModal(false)" class="btn-cancel">Cancel</button>
          <button onclick="forgotPassword()" class="btn-action">Send Link</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Native Standard Script: Zero CORS issues locally -->
  <script>
    // 1. Initialize Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
      authDomain: "sikhsinindia-67a6b.firebaseapp.com",
      databaseURL: "https://sikhsinindia-67a6b-default-rtdb.firebaseio.com",
      projectId: "sikhsinindia-67a6b",
      storageBucket: "sikhsinindia-67a6b.firebasestorage.app",
      messagingSenderId: "622603668882",
      appId: "1:622603668882:web:953c6a07864b235fdd054b",
      measurementId: "G-LHNTFNW14H"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // 2. View Interface Toggles
    function toggleModal(show) {
      const modal = document.getElementById("reset-modal");
      if(show) {
        modal.classList.add("active");
        const mainId = document.getElementById("identifier").value.trim();
        if(mainId && mainId.includes("@")) {
          document.getElementById("reset-email").value = mainId;
        }
      } else {
        modal.classList.remove("active");
      }
    }

    // 3. Forgot Password Handler
    async function forgotPassword() {
      const email = document.getElementById("reset-email").value.trim();

      if (!email || !email.includes("@")) {
        alert("Please enter a valid email address.");
        return;
      }

      try {
        await auth.sendPasswordResetEmail(email);
        alert("A password reset link has been successfully sent to your email address.");
        toggleModal(false);
      } catch (error) {
        alert("Error sending reset email: " + error.message);
      }
    }

    // 4. Login Action Handler
    async function login() {
      const id = document.getElementById("identifier").value.trim();
      const pass = document.getElementById("password").value;

      if (!id || !pass) {
        alert("Please fill in all credentials");
        return;
      }

      let email = id;

      if (!id.includes("@")) {
        try {
          const snap = await db.collection("users").where("phone", "==", id).get();

          if (snap.empty) {
            alert("Phone configuration not found");
            return;
          }

          email = snap.docs[0].data().email;
        } catch (err) {
          console.error("Database mismatch error:", err);
          alert("Error resolving identity source mapping.");
          return;
        }
      }

      try {
        // FIXED: Extract userCredential wrapper context safely
        const userCredential = await auth.signInWithEmailAndPassword(email, pass);
        const user = userCredential.user;

        localStorage.setItem('loggedInUserEmail', user.email);
        window.location.href = "03-04-sehaj-path.html";

      } catch (error) {
        alert("Authentication Failed: " + error.message);
      }
    }
  </script>

</body>
