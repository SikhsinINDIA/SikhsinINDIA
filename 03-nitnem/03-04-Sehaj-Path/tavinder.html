  <style>

    @media screen and (max-width: 768px) {
      body { padding: 10px; }
      .portal-container { padding: 15px; }

      label { width: 100%; font-size: 18px; margin-bottom: 5px; }

<body>

  <h1>Sikhs in India Group Membership Hub</h1>
  <h2>Belong, Connect & Thrive</h2>

  <div class="portal-container">
    
    <!-- Tab Controls Switching Views -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login Gateway</button>
      <button class="tab-btn" onclick="switchTab('signup')">Register / Signup</button>
    </div>

    <!-- STATUS DISPLAY MESSAGE -->
    <p id="status" class="status-msg"></p>

    <!-- 1. LOGIN SYSTEM VIEW -->
    <div id="loginSection" class="form-section active">
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-row">
          <label for="loginIdentifier">Email or Phone:</label>
          <input type="text" id="loginIdentifier" placeholder="Enter Registered Email or Mobile" required />
        </div>
        <div class="form-row">
          <label for="loginPassword">Password:</label>
          <input type="password" id="loginPassword" placeholder="Enter Password" required />
        </div>
        <div class="btn-container">
          <button type="submit" class="submit-btn">LOGIN</button>
        </div>
      </form>
    </div>

    <!-- 2. SIGNUP SYSTEM VIEW -->
    <div id="signupSection" class="form-section">
      <form id="signupForm" onsubmit="handleSignup(event)">
        <div class="form-row">
          <label for="email">Email: <span style="color: #f00;">*</span></label>
          <input type="email" id="email" placeholder="Email (used as unique ID)" required />
        </div>
        <div class="form-row">
          <label for="name">Full Name: <span style="color: #f00;">*</span></label>
          <input type="text" id="name" placeholder="Your Full Name" required />
        </div>
        <div class="form-row">
          <label for="password">Password: <span style="color: #f00;">*</span></label>
          <input type="password" id="password" placeholder="Choose alphanumeric password (min 8 chars)" required />
        </div>
        <div class="form-row">
          <label for="mobile">Mobile Number: <span style="color: #f00;">*</span></label>
          <input type="tel" id="mobile" placeholder="Mobile number (9 digits or more)" required />
        </div>
        <div class="form-row">
          <label for="age">Age:</label>
          <input type="number" id="age" placeholder="Your age" />
        </div>
        <div class="form-row">
          <label for="address">Address:</label>
          <input type="text" id="address" placeholder="Your address" maxlength="150" />
        </div>
        <div class="form-row">
          <label for="city">City:</label>
          <input type="text" id="city" placeholder="Your city" maxlength="150" />
        </div>
        <div class="form-row">
          <label for="state">State:</label>
          <input type="text" id="state" placeholder="Your State" maxlength="150" />
        </div>
        <div class="form-row">
          <label for="gender">Gender:</label>
          <select id="gender">
            <option value="">-- Select Gender --</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="btn-container">
          <button type="submit" class="submit-btn">CREATE ACCOUNT</button>
        </div>
      </form>
    </div>

    <h3>If you face any issues, please contact <a href="mailto:sikhsinindia@gmail.com">sikhsinindia@gmail.com</a></h3>
    
    <a href="../index.html" class="back-button">Back</a>
  </div>

  <!-- EmailJS Integration Scripts -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="text/javascript">
    (function(){
      emailjs.init("-jtHOddqV8vT6Z7jg");
    })();
  </script>

  <script>
    // App Firebase Credentials Configuration Matrix
    const firebaseConfig = {
      apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
      authDomain: "sikhsinindia-67a6b.firebaseapp.com",
      projectId: "sikhsinindia-67a6b",
      storageBucket: "sikhsinindia-67a6b.appspot.com",
      messagingSenderId: "622603668882",
      appId: "1:622603668882:web:953c6a07864b235fdd054b",
      measurementId: "G-LHNTFNW14H"
    };

    // Initialize Firebase Services Framework
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // Tab Interface View Controller Swapper
    function switchTab(targetView) {
      document.getElementById("status").innerText = "";
      const tabs = document.querySelectorAll(".tab-btn");
      
      if (targetView === 'login') {
        tabs[0].classList.add("active");
        tabs[1].classList.remove("active");
        document.getElementById("loginSection").classList.add("active");
        document.getElementById("signupSection").classList.remove("active");
      } else {
        tabs[0].classList.remove("active");
        tabs[1].classList.add("active");
        document.getElementById("loginSection").classList.remove("active");
        document.getElementById("signupSection").classList.add("active");
      }
    }

    // Input Validation Infrastructure Helper Modules
    function validateEmail(targetEmail) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(targetEmail);
    }

    function validatePassword(targetPassword) {
      return /^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(targetPassword);
    }

    // 1. Unified Handle Login Workflow 
    async function handleLogin(event) {
      event.preventDefault();
      document.getElementById("status").innerText = "Processing system login validation...";
      
      const identifier = document.getElementById("loginIdentifier").value.trim();
      const pass = document.getElementById("loginPassword").value;
      let targetEmail = identifier;

      try {
        // Cross Reference: If identification field is non-email (Phone lookup route fallback)
        if (!identifier.includes("@")) {
          const querySnapshot = await db.collection("sikhdatabaseindia")
                                        .where("Mobile", "==", Number(identifier))
                                        .get();
          if (querySnapshot.empty) {
            document.getElementById("status").innerText = "❌ Registered mobile number mapping context not found.";
            return;
          }
          targetEmail = querySnapshot.docs[0].data().Email;
        }

        // Firebase Identity Verification Authentication Layer Execute
        await auth.signInWithEmailAndPassword(targetEmail, pass);
        document.getElementById("status").innerText = "🎉 Login successful! Re-routing context workspace...";
        setTimeout(() => { window.location.href = "../index.html"; }, 1500);

      } catch (err) {
        console.error("Login verification malfunction logic caught: ", err);
        document.getElementById("status").innerText = "❌ Verification Failed: " + err.message;
      }
    }

    // 2. Unified Handle Signup & Firestore Sync Workflow
    async function handleSignup(event) {
      event.preventDefault();
      document.getElementById("status").innerText = "Constructing secure user workspace profile context...";

      const email = document.getElementById("email").value.trim();
      const name = document.getElementById("name").value.trim();
      const password = document.getElementById("password").value;
      const mobile = document.getElementById("mobile").value.trim();
      const ageVal = document.getElementById("age").value.trim();
      const address = document.getElementById("address").value.trim();
      const city = document.getElementById("city").value.trim();
      const state = document.getElementById("state").value.trim();
      const gender = document.getElementById("gender").value;

      // Front-End Verification Data Engine Bounds Check
      if (!validateEmail(email)) { alert("Email format standard processing match validation failure."); return; }
      if (!validatePassword(password)) { alert("Password validation schema mismatch. Minimum 8 characters with letters and numbers."); return; }
      if (!/^\d{9,}$/.test(mobile)) { alert("Mobile verification requires 9 numerical characters or more."); return; }
      
      if (ageVal) {
        const checkAge = Number(ageVal);
        if (checkAge <= 1 || checkAge >= 110) { alert("Age metric out of bounds tracking limits constraint."); return; }
      }
      if (address.length > 150) { alert("Address maximum size validation threshold overflow reached."); return; }

      try {
        // Step A: Register Identity inside Firebase Authentication Vault
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        
        // Step B: Set structured parameters data matrix into database collection targets
        const trackingPayload = {
          Email: email,
          Name: name,
          Password: password, // Retained field sync mapping per 01-add-record.html parameters logic architecture
          Mobile: Number(mobile),
          Age: ageVal ? Number(ageVal) : null,
          Address: address,
          City: city,
          State: state,
          Gender: gender,
          Date_created: firebase.firestore.FieldValue.serverTimestamp()
        };

        await db.collection("sikhdatabaseindia").doc(email).set(trackingPayload);
        
        document.getElementById("status").innerText = "🎉 Congratulations! Account generated & data committed to system ledger.";
        
        // Dispatch notifications via dynamic EmailJS modules execution framework
        dispatchNotificationSystem(email, name, mobile, ageVal, address, city, state, gender);
        
        document.getElementById("signupForm").reset();
        setTimeout(() => { switchTab('login'); }, 2000);

      } catch (err) {
        console.error("Account construction workspace runtime processing abort error: ", err);
        document.getElementById("status").innerText = "❌ Registry Fault: " + err.message;
      }
    }

    // Dispatch System Transactional Messages Workflow
    function dispatchNotificationSystem(email, name, mobile, age, address, city, state, gender) {
      const systemicPayload = {
        email: email,
        name: name,
        mobile: mobile,
        age: age,
        address: address,
        city: city,
        state: state,
        gender: gender,
        useremail: email
      };

      // Target Task A: Transmit validation notice payload down to client inbox mapping index
      emailjs.send("service_dlzwpyu", "template_x1uksg8", systemicPayload)
        .then(res => console.log("✅ Confirmation notification route execution success index:", res.status))
        .catch(err => console.error("❌ Notification outbound transmission failure context logic catch:", err));

      // Target Task B: Transmit structural context mirror diagnostic payload down to platform administration index
      const administrationMirrorPayload = { ...systemicPayload, email: "sikhsinindia@gmail.com" };
      emailjs.send("service_dlzwpyu", "template_x1uksg8", administrationMirrorPayload)
        .then(res => console.log("✅ Diagnostics data transaction mirror replication loop success:", res.status))
        .catch(err => console.error("❌ Diagnostics synchronization loop failure engine notification error:", err));
    }
  </script>
</body>
