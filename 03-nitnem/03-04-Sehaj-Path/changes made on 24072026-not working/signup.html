  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
      authDomain: "sikhsinindia-67a6b.firebaseapp.com",
      databaseURL: "https://sikhsinindia-67a6b-default-rtdb.firebaseio.com",
      projectId: "sikhsinindia-67a6b",
      storageBucket: "sikhsinindia-67a6b.firebasestorage.app",
      messagingSenderId: "622603668882",
      appId: "1:622603668882:web:953c6a07864b235fdd054b",
      measurementId: "G-LHNTFNW14H"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function signup() {
      const loginName = document.getElementById("login-name").value.trim();
      const mobileVal = document.getElementById("mobile").value.trim();
      const pass = document.getElementById("password").value;

      if (!loginName || !mobileVal || !pass) {
        alert("Please fill in all details.");
        return;
      }

      const mobileNum = Number(mobileVal);
      if (isNaN(mobileNum)) {
        alert("Please enter a valid numeric mobile number.");
        return;
      }

      try {
        const existingLogin = await db.collection("sehaj_path").where("login", "==", loginName).get();
        if (!existingLogin.empty) {
          alert("Login name is already taken. Please choose another.");
          return;
        }

        const existingMobile = await db.collection("sehaj_path").where("mobile", "==", mobileNum).get();
        if (!existingMobile.empty) {
          alert("Mobile number is already registered.");
          return;
        }

        const now = new Date();
        const dateTimeStr = now.toISOString().replace('T', ' ').substring(0, 19);

        await db.collection("sehaj_path").add({
          login: loginName,
          mobile: mobileNum,
          password: pass,
          date_time: dateTimeStr
        });

        alert("Account registered successfully!");
        localStorage.setItem('loggedInUserEmail', loginName);
        localStorage.setItem('userMobile', mobileNum);

        // Redirect directly to 03-04-sehaj-path.html
        window.location.href = "03-04-sehaj-path.html";

      } catch (error) {
        console.error("Signup error:", error);
        alert("Error registering user: " + error.message);
      }
    }
  </script>

<script>
  (function () {
    var canonicalElem = document.querySelector('link[rel="canonical"]');
    var liveUrl = (window.location.protocol.indexOf('http') === 0)

      : (canonicalElem ? canonicalElem.href : 'https://sikhsinindia.com');

    var rawTitle = document.title;
    var pageUrlEnc = encodeURIComponent(liveUrl);

    var gsbWa = document.getElementById('gsbWhatsappShare');
    if (gsbWa) gsbWa.addEventListener('click', function () {
      window.open('https://api.whatsapp.com/send?text=' + pageTitleEnc + '%20' + pageUrlEnc, '_blank', 'noopener,noreferrer');
    });

    var gsbFb = document.getElementById('gsbFacebookShare');
    if (gsbFb) gsbFb.addEventListener('click', function () {
      window.open('https://www.facebook.com/sharer/sharer.php?u=' + pageUrlEnc, '_blank', 'noopener,noreferrer,width=600,height=400');
    });

    var gsbIg = document.getElementById('gsbInstagramShare');
    if (gsbIg) gsbIg.addEventListener('click', function () {
      if (navigator.share) {
        navigator.share({ title: rawTitle, url: liveUrl }).catch(function () {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(liveUrl).then(function () {
          alert('Link copied to clipboard!\n\nYou can now paste it into Instagram or any app.');
        }).catch(function () { alert('Share URL: ' + liveUrl); });
      } else {
        alert('Share URL: ' + liveUrl);
      }
    });
  })();
