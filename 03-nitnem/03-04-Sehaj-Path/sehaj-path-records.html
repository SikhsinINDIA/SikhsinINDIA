<body>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
      authDomain: "sikhsinindia-67a6b.firebaseapp.com",
      projectId: "sikhsinindia-67a6b",
      storageBucket: "sikhsinindia-67a6b.appspot.com",
      messagingSenderId: "622603668882",
      appId: "1:622603668882:web:953c6a07864b235fdd054b",
      measurementId: "G-LHNTFNW14H"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function formatSeconds(seconds) {
      if (!seconds || isNaN(seconds)) return "0:00";
      const sec = Math.floor(seconds);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) {
        return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      }
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function formatDate(timestamp) {
      if (!timestamp) return "N/A";
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      return date.toLocaleString();
    }

    // Fetch and display records from 'sehaj_path' collection
    function loadSehajPathRecords() {
      const tableBody = document.getElementById('records-table-body');

      db.collection("sehaj_path").onSnapshot((snapshot) => {
        if (snapshot.empty) {
          tableBody.innerHTML = `<tr><td colspan="5" class="no-data">No records found in sehaj_path.</td></tr>`;
          return;
        }

        let html = '';
        snapshot.forEach((doc) => {
          const data = doc.data();

          const docId = doc.id;
          const track = data.last_track || data.ang || 'N/A';
          const time = data.last_time ? formatSeconds(data.last_time) : '0:00';
          const videoId = data.last_video_id || data.video_id || 'N/A';
          const updated = formatDate(data.last_updated);

          html += `
            <tr>
              <td><strong>${docId}</strong></td>
              <td><span class="badge">${track}</span></td>
              <td>${time}</td>
              <td><code>${videoId}</code></td>
              <td>${updated}</td>
            </tr>
          `;
        });

        tableBody.innerHTML = html;
      }, (error) => {
        console.error("Error fetching sehaj_path records: ", error);
        tableBody.innerHTML = `<tr><td colspan="5" class="no-data" style="color: red;">Failed to load records. Check console/permissions.</td></tr>`;
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadSehajPathRecords();
    });
  </script>

<script>
  (function () {
    var canonicalElem = document.querySelector('link[rel="canonical"]');
    var liveUrl = (window.location.protocol.indexOf('http') === 0)
      ? window.location.href
      : (canonicalElem ? canonicalElem.href : 'https://sikhsinindia.com');

    var rawTitle = document.title;
    var pageUrlEnc = encodeURIComponent(liveUrl);
    var pageTitleEnc = encodeURIComponent(rawTitle);

    var gsbWa = document.getElementById('gsbWhatsappShare');
    if (gsbWa) gsbWa.addEventListener('click', function () {
      window.open('https://api.whatsapp.com/send?text=' + pageTitleEnc + '%20' + pageUrlEnc, '_blank', 'noopener,noreferrer');
    });

    var gsbFb = document.getElementById('gsbFacebookShare');
    if (gsbFb) gsbFb.addEventListener('click', function () {
      window.open('https://www.facebook.com/sharer/sharer.php?u=' + pageUrlEnc, '_blank', 'noopener,noreferrer,width=600,height=400');
    });

    var gsbIg = document.getElementById('gsbInstagramShare');
    if (gsbIg) gsbIg.addEventListener('click', function () {
      if (navigator.share) {
        navigator.share({ title: rawTitle, url: liveUrl }).catch(function () {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(liveUrl).then(function () {
          alert('Link copied to clipboard!\n\nYou can now paste it into Instagram or any app.');
        }).catch(function () { alert('Share URL: ' + liveUrl); });
      } else {
        alert('Share URL: ' + liveUrl);
      }
    });
  })();
</script>
