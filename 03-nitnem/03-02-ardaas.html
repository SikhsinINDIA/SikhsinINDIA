        <div class="image-controls">
          <button class="control-btn" onclick="prevImage()">◀ Prev</button>

  <script>
    const ardaasPhotos = [
      {
        src: "https://drive.google.com/thumbnail?id=17wxsi9t-5y0gkmD4vPXL_xIAyDlGJvOT&sz=w1000",
        caption: "Relevance of Ardaas - Part 1"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1LghwD4ERgOGYoiS8O-TZ-QUa0tnMeU_J&sz=w1000",
        caption: "Relevance of Ardaas - Part 2"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1p3dOtbCW67YpexsITxaxVPJmA7xSBu5_&sz=w1000",
        caption: "Relevance of Ardaas - Part 3"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1JErTU62J6YjN72INu-uSXovWSv0xRo8e&sz=w1000",
        caption: "Relevance of Ardaas - Part 4"
      },
      {
        src: "https://drive.google.com/thumbnail?id=115m70wHY_d48l0HaZPmu7AvOXwes4CV5&sz=w1000",
        caption: "Relevance of Ardaas - Part 5"
      },
      {
        src: "https://drive.google.com/thumbnail?id=1xxEtO7DUrAGiEMaY39tvI-pAxt4Rnspn&sz=w1000",
        caption: "Relevance of Ardaas - Part 6"
      }
    ];

    let currentIndex = 0;

    function showImage(index) {
      const img = document.getElementById("ardaasImg");
      img.src = ardaasPhotos[index].src;

      document.getElementById("ardaasCaption").textContent =
        ardaasPhotos[index].caption;

      document.getElementById("imageCounter").textContent =
        (index + 1) + " / " + ardaasPhotos.length;
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % ardaasPhotos.length;
      showImage(currentIndex);
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + ardaasPhotos.length) % ardaasPhotos.length;
      showImage(currentIndex);
    }

    document.addEventListener("DOMContentLoaded", () => showImage(0));
  </script>
