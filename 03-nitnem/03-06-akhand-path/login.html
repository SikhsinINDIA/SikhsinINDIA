<!DOCTYPE html>
<html lang="en">

<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LHNTFNW14H"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-LHNTFNW14H');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Akhand Path | Login</title>
  <meta name="robots" content="noindex, nofollow">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css">

  <style>
    .poster { max-width: 480px; }
    .wrapper { display: flex; flex-direction: column; gap: 14px; }
  </style>
</head>

<body>

  <div class="poster">
    <div class="header">
      <div class="logo-wrap">
        <img class="logo-img" src="../../pictures/00-index/sikhsinindia.png" alt="Sikhs In India Logo">
      </div>
      <div class="hero">
        <div class="hero-title">Akhand <span>Path</span></div>
        <div class="hero-sub">Invitee Login</div>
      </div>
    </div>

    <div class="wrapper">
      <h2>Login to Track Your Attendance</h2>
      <p class="muted" style="margin-bottom:8px;">Use the Login ID and password from your Akhand Path invitation email.</p>

      <div class="form-row">
        <input id="email" type="email" placeholder="Your Login ID (email address)">
      </div>
      <div class="form-row">
        <input id="password" type="password" placeholder="Password">
      </div>

      <button onclick="login()" class="btn-action">Login</button>
      <p id="status" class="muted" style="text-align:center;min-height:18px;"></p>

      <div class="nav-link-wrap">
        <a class="nav-link" id="watchGuestLink" href="index.html">Continue watching as a guest</a>
      </div>
    </div>

    <div class="footer">
      <div class="footer-content">
        <a href="index.html" class="btn-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M5 12l7-7M5 12l7 7" />
          </svg>
          Back to Akhand Path
        </a>
        <div class="footer-left">© 2026 Sikhs in India</div>
        <div class="footer-right">Preserving Sikh Heritage & Unity</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, signInWithEmailAndPassword } from "./firebase.js";

    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session");
    const redirectTarget = "index.html" + (sessionId ? `?session=${encodeURIComponent(sessionId)}` : "");

    document.getElementById("watchGuestLink").href = redirectTarget;

    window.login = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const status = document.getElementById("status");

      if (!email || !password) {
        status.textContent = "Please enter both your Login ID and password.";
        return;
      }

      status.textContent = "Logging in...";
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = redirectTarget;
      } catch (err) {
        status.textContent = "Login failed: " + err.message;
      }
    };
  </script>

</body>
</html>
