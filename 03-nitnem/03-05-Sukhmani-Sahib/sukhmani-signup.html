  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
      authDomain: "sikhsinindia-67a6b.firebaseapp.com",
      projectId: "sikhsinindia-67a6b",
      storageBucket: "sikhsinindia-67a6b.appspot.com",
      messagingSenderId: "622603668882",
      appId: "1:622603668882:web:953c6a07864b235fdd054b",
      measurementId: "G-LHNTFNW14H"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function signup() {
      const email = document.getElementById("email").value.trim().toLowerCase();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !phone || !password) {
        alert("Please fill out all registration fields (Email, Mobile, and Password).");
        return;
      }

      try {
        const existingDoc = await db.collection("sukhmani_sahib")
          .where("email_login", "==", email)
          .get();

        if (!existingDoc.empty) {
          alert("An account with this email address already exists.");
          return;
        }

        const now = new Date();
        const formattedDate = now.getFullYear() + "-" +
          String(now.getMonth() + 1).padStart(2, '0') + "-" +
          String(now.getDate()).padStart(2, '0') + " " +
          String(now.getHours()).padStart(2, '0') + ":" +
          String(now.getMinutes()).padStart(2, '0') + ":" +
          String(now.getSeconds()).padStart(2, '0');

        await db.collection("sukhmani_sahib").add({
          date_time: formattedDate,
          email_login: email,
          mobile: phone,
          password: password,
          last_track: 1,
          last_time: 0,
          last_video_id: "PlRXmCN9xUM",
          last_updated: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("Registration successful! Start your Sukhmani Sahib journey now.");
        window.location.href = "03-05-sukhmani-sahib.html";
      } catch (error) {
        alert("Registration Failed: " + error.message);
      }
    }
  </script>
