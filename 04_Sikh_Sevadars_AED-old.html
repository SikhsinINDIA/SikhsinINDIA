<html lang="en">
<head>

  <title>Sikh Sevadars</title>

    <!-- Firebase Scripts -->

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: black;
      color: #FF9933;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
    }

    #records-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px;
    }

    .sevadar-card {
      background-color: #FF9933;
      color: black;
      border: 2px solid black;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-content {
      flex: 1;
    }

    .card-content img,
    .card-content video {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin-top: 10px;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-left: 16px;
    }

    .card-actions button {
      background-color: black;
      color: #FF9933;
      border: 2px solid #FF9933;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .card-actions button:hover {
      background-color: #FF9933;
      color: black;
    }

    .back-button {
      width: 100px;
      height: 40px;
      font-size: 18px;
      background-color: #FF9933;
      color: black;
      display: block;
      margin: 30px auto;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .back-button:hover {
      background-color: black;
      color: #FF9933;
      border: 2px solid #FF9933;
    }
  </style>
</head>

<body>
  <h1>Sikh Sevadars</h1>
  <div id="records-container"></div>



  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
      authDomain: "sikhsinindia-67a6b.firebaseapp.com",
      projectId: "sikhsinindia-67a6b",
      storageBucket: "sikhsinindia-67a6b.appspot.com",
      messagingSenderId: "622603668882",
      appId: "1:622603668882:web:953c6a07864b235fdd054b",
      measurementId: "G-LHNTFNW14H"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function loadSevadars() {
      const container = document.getElementById('records-container');
      container.innerHTML = '';

      try {
        const querySnapshot = await db.collection("Sikh_Sevadars").get();

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const docId = doc.id;
          // const encodedPhoto = data.Photo ? `/${encodeURI(data.Photo)}` : null;

          const card = document.createElement("div");
          card.className = "sevadar-card";

          card.innerHTML = `
            <div class="card-content">
              <p><strong>${data.Name}</strong><br>
              <strong>Mobile:</strong> ${data.Mobile}<br>
              <strong>Specializes:</strong> ${data.Specializes}<br>
              <strong>City:</strong> ${data.City}<br>
              <strong>State:</strong> ${data.State}</p>
              ${encodedPhoto ? `<img src="${encodedPhoto}" alt="${data.Name}">` : ""}
              ${data.Video ? `<video controls><source src="${data.Video}" type="video/mp4"></video>` : ""}
            </div>
            <div class="card-actions">
              <button onclick="editRecord('${docId}')">Edit</button>
              <button onclick="deleteRecord('${docId}')">Delete</button>
            </div>
          `;

          container.appendChild(card);
        });
      } catch (error) {
        container.innerHTML = "<p>Error loading records. Check console for details.</p>";
        console.error("Error fetching documents: ", error);
      }
    }

    async function deleteRecord(id) {
      if (confirm("Are you sure you want to delete this record?")) {
        try {
          await db.collection("Sikh_Sevadars").doc(id).delete();
          alert("Record deleted successfully.");
          loadSevadars(); // Refresh
        } catch (error) {
          alert("Error deleting record.");
          console.error(error);
        }
      }
    }

    function editRecord(id) {
      alert("Edit functionality not yet implemented for record ID: " + id);
      // You can redirect to an edit form or open a modal here
    }

    function goBack() {
      window.location.href = "./index.html";
    }

    window.onload = loadSevadars;
  </script>

  <button onclick="goBack()" class="back-button">Back</button>
</body>
</html>
