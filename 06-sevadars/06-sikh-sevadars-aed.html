  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --navy: #0d1b3e;
      --navy-mid: #162147;
      --gold: #F7941D;
      --cream: #f5f0e8;
      --gold-light: #F7941D;
      --white: #ffffff;
    }

    /* PAGE BACKGROUND */
    body {
      font-family: 'Lato', sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      padding: 20px 8px;
    }

    /* MAIN CONTAINER */
    .poster {
      width: 100%;
      max-width: 860px;
      background: var(--cream);
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      overflow: hidden;
    }

    /* HEADER WITH LOGO */
    .header {
      display: flex;
      background: var(--navy);
      position: relative;
    }

    .logo-wrap {
      padding: 16px 20px;
    }

    .logo-img {
      height: 90px;
      background: #fff;
      padding: 4px;
      border-radius: 6px;
    }

    .hero {
      flex: 1;
      text-align: center;
      padding: 28px;
      background: linear-gradient(160deg, var(--navy), #1a2a5e);
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(26px, 6vw, 46px);
      font-weight: 900;
      color: #fff;
    }

    .hero-title span {
      color: var(--gold);
    }

    .hero-sub {
      color: rgba(255, 255, 255, .75);
      margin-top: 6px;
      font-style: italic;
    }

    /* GOLD BAR */
    .intro {
      background: linear-gradient(90deg, var(--gold), #ffb347, var(--gold));
      padding: 14px 20px;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--navy);
      font-size: 14px;
      text-align: center;
    }

    /* MAIN WRAPPER */
    .wrapper {
      padding: 28px 36px;
    }

    h2 {
      font-family: 'Playfair Display', serif;
      color: var(--navy);
      text-align: center;
      font-size: 24px;
      margin-bottom: 18px;
    }

    /* GENERIC PANEL CONTAINER (matches quiz setup-container) */
    .panel {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      margin-bottom: 26px;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    /* ADD/EDIT FORM */
    .form-grid {
      display: grid;
      gap: 14px;
    }

    .form-field label {
      display: block;
      font-weight: 700;
      color: var(--navy);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .form-field input[type="text"],
    .form-field input[type="file"] {
      width: 100%;
      padding: 11px 12px;
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 6px;
      background: var(--cream);
      color: var(--navy);
    }

    .form-field input[type="text"]:focus {
      outline: none;
      border-color: var(--gold);
    }

    .form-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    /* BUTTONS (navy fill, gold hover — matches quiz btn-level) */
    .btn-action {
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      background: var(--navy);
      border: 2px solid var(--navy);
      padding: 12px 24px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--navy);
    }

    .btn-action:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-action:disabled:hover {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
    }

    .loader {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top: 2px solid #fff;
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* SEVADAR RECORD CARDS */
    #records-container {
      display: grid;
      gap: 14px;
      margin-top: 4px;
    }

    .sevadar-card {
      background: #fdfcf9;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-left: 5px solid var(--gold);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      transition: all 0.2s;
    }

    .sevadar-card:hover {
      background: var(--cream);
      border-color: var(--gold);
    }

    .sevadar-card img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid var(--gold);
      flex-shrink: 0;
    }

    .sevadar-info {
      flex: 1;
      min-width: 180px;
      text-align: left;
      color: var(--navy);
      font-size: 13px;
      line-height: 1.7;
    }

    .sevadar-info .name {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 17px;
      color: var(--navy);
      display: block;
      margin-bottom: 4px;
    }

    .sevadar-info strong {
      color: var(--navy);
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-small {
      font-family: 'Lato', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      background: var(--navy);
      border: none;
      padding: 9px 16px;
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.2s;
    }

    .btn-small.edit:hover {
      background: var(--gold);
      color: var(--navy);
    }

    .btn-small.delete {
      background: #b71c1c;
    }

    .btn-small.delete:hover {
      background: #8c1414;
    }

    .no-results {
      text-align: center;
      color: #666;
      font-style: italic;
      padding: 20px;
    }

    /* FOOTER */
    .footer {
      background: var(--navy-mid);
      padding: 16px 36px;
      border-top: 2px solid var(--gold);
      margin-top: 30px;
      border-radius: 0 0 4px 4px;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .footer-left {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .footer-right {
      font-size: 10px;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* 3D gold style for the Back button */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'Lato', sans-serif;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--navy);
      background: linear-gradient(135deg, var(--gold-light) 0%, #e8830a 100%);
      border: none;
      border-radius: 5px;
      padding: 9px 18px;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 220, 120, 0.5),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 2px #9a5800,
        0 0 0 3.5px var(--gold);
      transition: filter 0.15s, transform 0.1s;
      flex-shrink: 0;
    }

    .btn-back:hover {
      filter: brightness(1.08);
    }

    .btn-back:active {
      transform: scale(0.97);
    }

    .btn-back svg {
      width: 12px;
      height: 12px;
    }

    /* MOBILE BREAKPOINTS */
    @media(max-width:768px) {
      .header {
        flex-direction: column;
        align-items: center;
      }

      .logo-wrap {
        padding: 16px 20px 4px 20px;
      }

      .hero {
        padding: 18px;
        width: 100%;
      }

      .wrapper {
        padding: 18px 14px;
      }

      .panel {
        padding: 18px;
      }

      .sevadar-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .sevadar-info {
        text-align: center;
      }

      .card-actions {
        flex-direction: row;
        width: 100%;
        justify-content: center;
      }

      .btn-small {
        flex: 1;
        max-width: 140px;
      }

      .footer {
        padding: 14px 12px;
      }

      .footer-content {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="poster">

    <!-- HEADER WITH SIKHSININDIA LOGO -->
    <div class="header">
      <div class="logo-wrap">
        <img class="logo-img" src="../pictures/00-index/sikhsinindia.png" alt="Sikhs In India Logo">
      </div>
      <div class="hero">
        <div class="hero-title">Sevadar <span>Admin</span></div>
        <div class="hero-sub">Add, Edit & Manage Sikh Sevadar Records</div>
      </div>
    </div>

    <div class="intro">
      Authorized dashboard — changes here reflect immediately on the public directory
    </div>

    <div class="wrapper">

      <!-- ADD / EDIT FORM -->
      <div class="panel">
        <h2>Add / Edit Sevadar</h2>
        <form id="sevadar-form" class="form-grid">
          <input type="hidden" id="docId" />

          <div class="form-field">
            <label for="name">Name</label>
            <input type="text" id="name" required>
          </div>
          <div class="form-field">
            <label for="mobile">Mobile</label>
            <input type="text" id="mobile" required>
          </div>
          <div class="form-field">
            <label for="specializes">Specializes In</label>
            <input type="text" id="specializes" required>
          </div>
          <div class="form-field">
            <label for="city">City</label>
            <input type="text" id="city" required>
          </div>
          <div class="form-field">
            <label for="state">State</label>
            <input type="text" id="state" required>
          </div>
          <div class="form-field">
            <label for="photo">Photo URL</label>
            <input type="text" id="photo">
          </div>
          <div class="form-field">
            <label for="photoFile">Upload Photo</label>
            <input type="file" id="photoFile" accept="image/*">
          </div>
          <div class="form-field">
            <label for="video">Video URL</label>
            <input type="text" id="video">
          </div>

          <div class="form-actions">
            <button type="submit" id="submitBtn" class="btn-action">
              <span id="submitText">Submit</span>
              <span id="loader" class="loader" style="display:none;"></span>
            </button>
            <button type="button" class="btn-action" onclick="clearForm()">Clear</button>
          </div>
        </form>
      </div>

      <!-- RECORDS LIST -->
      <div class="panel" id="records">
        <h2>Sikh Sevadars</h2>
        <div id="records-container"></div>
      </div>

    </div>

    <!-- SITE FOOTER FRAME -->
    <div class="footer">
      <div class="footer-content">
        <a href="../06-sevadars/06-sikh-sevadars.html" class="btn-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M19 12H5M5 12l7-7M5 12l7 7" />
          </svg>
          Back
        </a>
        <div class="footer-left">© 2026 Sikhs in India</div>
        <div class="footer-right">Preserving Sikh Heritage & Unity</div>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
      authDomain: "sikhsinindia-67a6b.firebaseapp.com",
      projectId: "sikhsinindia-67a6b",
      storageBucket: "sikhsinindia-67a6b.appspot.com",
      messagingSenderId: "622603668882",
      appId: "1:622603668882:web:953c6a07864b235fdd054b",
      measurementId: "G-LHNTFNW14H"
    };

    firebase.initializeApp(firebaseConfig);
    const storage = firebase.storage();
    const db = firebase.firestore();

    async function loadSevadars() {
      const container = document.getElementById('records-container');
      container.innerHTML = '';

      try {
        const snapshot = await db.collection("Sikh_Sevadars").get();

        if (snapshot.empty) {
          container.innerHTML = "<p class='no-results'>No sevadar records yet.</p>";
          return;
        }

        snapshot.forEach(doc => {
          const data = doc.data();
          const card = document.createElement("div");
          card.className = "sevadar-card";

          card.innerHTML = `
            <img src="${data.Photo || ''}" alt="${data.Name || 'Sevadar Photo'}">
            <div class="sevadar-info">
              <span class="name">${data.Name || ''}</span>
              <strong>Mobile:</strong> ${data.Mobile || ''}<br>
              <strong>Specializes:</strong> ${data.Specializes || ''}<br>
              <strong>City:</strong> ${data.City || ''}, <strong>State:</strong> ${data.State || ''}<br>
              <strong>Video:</strong> ${data.Video || '—'}
            </div>
            <div class="card-actions">
              <button class="btn-small edit" onclick="editSevadar('${doc.id}', ${JSON.stringify(data).replace(/"/g, '&quot;')})">Edit</button>
              <button class="btn-small delete" onclick="deleteSevadar('${doc.id}')">Delete</button>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = "<p class='no-results'>Error loading records.</p>";
      }
    }

    document.getElementById("sevadar-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      setLoading(true);

      const id = document.getElementById("docId").value;
      const photoFile = document.getElementById("photoFile").files[0];

      let photoURL = document.getElementById("photo").value || "";

      try {
        if (photoFile) {
          photoURL = await uploadToCloudinary(photoFile);
        }

        const data = {
          Name: document.getElementById("name").value,
          Mobile: document.getElementById("mobile").value,
          Specializes: document.getElementById("specializes").value,
          City: document.getElementById("city").value,
          State: document.getElementById("state").value,
          Photo: photoURL,
          Video: document.getElementById("video").value,
        };

        if (id) {
          await db.collection("Sikh_Sevadars").doc(id).update(data);
        } else {
          await db.collection("Sikh_Sevadars").add(data);
        }
        clearForm();
        loadSevadars();
      } catch (error) {
        console.error("Error saving record:", error);
      } finally {
        setLoading(false);
      }
    });

    function editSevadar(id, data) {
      document.getElementById("docId").value = id;
      document.getElementById("name").value = data.Name;
      document.getElementById("mobile").value = data.Mobile;
      document.getElementById("specializes").value = data.Specializes;
      document.getElementById("city").value = data.City;
      document.getElementById("state").value = data.State;
      document.getElementById("photo").value = data.Photo || "";
      document.getElementById("video").value = data.Video || "";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteSevadar(id) {
      if (confirm("Are you sure you want to delete this sevadar?")) {
        try {
          await db.collection("Sikh_Sevadars").doc(id).delete();
          loadSevadars();
        } catch (err) {
          console.error("Delete failed:", err);
        }
      }
    }

    function clearForm() {
      document.getElementById("sevadar-form").reset();
      document.getElementById("docId").value = '';
    }

    window.onload = loadSevadars;

    async function uploadToCloudinary(file) {
      const CLOUD_NAME = "dxseeeudw";
      const UPLOAD_PRESET = "sikhsinindia-pictures"; // your unsigned preset

      const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);
      formData.append("folder", "sikh-sevadars");

      const response = await fetch(url, {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        throw new Error("Cloudinary upload failed");
      }

      const data = await response.json();
      return data.secure_url;
    }

    function setLoading(isLoading) {
      const btn = document.getElementById("submitBtn");
      const text = document.getElementById("submitText");
      const loader = document.getElementById("loader");

      if (isLoading) {
        btn.disabled = true;
        text.textContent = "Submitting...";
        loader.style.display = "inline-block";
      } else {
        btn.disabled = false;
        text.textContent = "Submit";
        loader.style.display = "none";
      }
    }
  </script>

</body>
