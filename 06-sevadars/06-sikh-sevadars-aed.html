  <style>

    #form-container {
      padding: 2rem;

    label,
    input,
    textarea {
      display: block;

    input,

    button {

    .sevadar-card {
      background-color: #111;

    }

    .sevadar-card img {
      max-width: 150px;
      height: auto;
      border-radius: 5px;
    }

    .sevadar-card video {
      max-width: 250px;
      margin-top: 0.5rem;
    }

    .loader {
      width: 16px;
      height: 16px;
      border: 3px solid black;
      border-top: 3px solid transparent;
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

<body>
  <header>
    <h1>Sikh Sevadars</h1>
  </header>

  <div id="form-container">
    <h2>Add / Edit Sevadar</h2>
    <form id="sevadar-form">
      <input type="hidden" id="docId" />
      <label>Name: <input type="text" id="name" required></label>
      <label>Mobile: <input type="text" id="mobile" required></label>
      <label>Specializes In: <input type="text" id="specializes" required></label>
      <label>City: <input type="text" id="city" required></label>
      <label>State: <input type="text" id="state" required></label>
      <label>Photo URL: <input type="text" id="photo"></label>
      <label>Upload Photo:
        <input type="file" id="photoFile" accept="image/*">
      </label>

      <label>Video URL: <input type="text" id="video"></label>
      <button type="submit" id="submitBtn">
        <span id="submitText">Submit</span>
        <span id="loader" class="loader" style="display:none;"></span>
      </button>

      <button type="button" onclick="clearForm()">Clear</button>
    </form>
  </div>

  <div id="records">
    <h2>Sikh Sevadars</h2>
    <div id="records-container"></div>
  </div>

  <button type="button" onclick="goBack()"
    style="width: 100px; height: 40px; font-size: 24px; background-color: #FFA500; color: black; display: block; margin: 20px auto 0 auto;">Back</button>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
      authDomain: "sikhsinindia-67a6b.firebaseapp.com",
      projectId: "sikhsinindia-67a6b",
      storageBucket: "sikhsinindia-67a6b.appspot.com",
      messagingSenderId: "622603668882",
      appId: "1:622603668882:web:953c6a07864b235fdd054b",
      measurementId: "G-LHNTFNW14H"
    };

    firebase.initializeApp(firebaseConfig);
    const storage = firebase.storage();
    const db = firebase.firestore();

    async function loadSevadars() {
      const container = document.getElementById('records-container');
      container.innerHTML = '';

      try {
        const snapshot = await db.collection("Sikh_Sevadars").get();
        snapshot.forEach(doc => {
          const data = doc.data();
          const card = document.createElement("div");
          card.className = "sevadar-card";

          card.innerHTML = `
            <p><strong>${data.Name}</strong><br>
            <strong>Mobile:</strong> ${data.Mobile}<br>
            <strong>Specializes:</strong> ${data.Specializes}<br>
            <strong>City:</strong> ${data.City}, <strong>State:</strong> ${data.State}</p>
            <strong>Image:</strong> ${data.Photo}<br>
            <img src="${data.Photo}" alt="Sevadar Photo">
            <br>

            <strong>Video:</strong> ${data.Video}<br>
             <strong>State:</strong> ${data.State}</p>
  
            <button onclick="editSevadar('${doc.id}', ${JSON.stringify(data).replace(/"/g, '&quot;')})">Edit</button>
            <button onclick="deleteSevadar('${doc.id}')">Delete</button>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = "<p>Error loading records.</p>";
      }
    }

    document.getElementById("sevadar-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      setLoading(true);

      const id = document.getElementById("docId").value;
      const photoFile = document.getElementById("photoFile").files[0];

      let photoURL = "";

      try {
        // Upload photo if selected
        // if (photoFile) {
        //   const fileName = `pictures/${Date.now()}_${photoFile.name}`;
        //   const storageRef = storage.ref(fileName);
        //   await storageRef.put(photoFile);
        //   photoURL = await storageRef.getDownloadURL();
        // }

        if (photoFile) {
          photoURL = await uploadToCloudinary(photoFile);
        }

        const data = {
          Name: document.getElementById("name").value,
          Mobile: document.getElementById("mobile").value,
          Specializes: document.getElementById("specializes").value,
          City: document.getElementById("city").value,
          State: document.getElementById("state").value,
          Photo: photoURL,
          Video: document.getElementById("video").value,
        };


        if (id) {
          await db.collection("Sikh_Sevadars").doc(id).update(data);
        } else {
          await db.collection("Sikh_Sevadars").add(data);
        }
        clearForm();
        loadSevadars();
      } catch (error) {
        console.error("Error saving record:", error);
      } finally {
        setLoading(false);
      }
    });

    function editSevadar(id, data) {
      document.getElementById("docId").value = id;
      document.getElementById("name").value = data.Name;
      document.getElementById("mobile").value = data.Mobile;
      document.getElementById("specializes").value = data.Specializes;
      document.getElementById("city").value = data.City;
      document.getElementById("state").value = data.State;
      document.getElementById("photo").value = data.Photo || "";
      document.getElementById("video").value = data.Video || "";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteSevadar(id) {
      if (confirm("Are you sure you want to delete this sevadar?")) {
        try {
          await db.collection("Sikh_Sevadars").doc(id).delete();
          loadSevadars();
        } catch (err) {
          console.error("Delete failed:", err);
        }
      }
    }

    function clearForm() {
      document.getElementById("sevadar-form").reset();
      document.getElementById("docId").value = '';
    }

    function goBack() {
      window.location.href = "../06-sevadars/06-sikh-sevadars.html";
    }

    window.onload = loadSevadars;

    async function uploadToCloudinary(file) {
      const CLOUD_NAME = "dxseeeudw";
      const UPLOAD_PRESET = "sikhsinindia-pictures"; // your unsigned preset

      const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);

      formData.append("folder", "sikh-sevadars");

      const response = await fetch(url, {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        throw new Error("Cloudinary upload failed");
      }

      const data = await response.json();
      return data.secure_url;
    }

    function setLoading(isLoading) {
      const btn = document.getElementById("submitBtn");
      const text = document.getElementById("submitText");
      const loader = document.getElementById("loader");

      if (isLoading) {
        btn.disabled = true;
        text.textContent = "Submitting...";
        loader.style.display = "inline-block";
      } else {
        btn.disabled = false;
        text.textContent = "Submit";
        loader.style.display = "none";
      }
    }

  </script>
</body>

</html>
