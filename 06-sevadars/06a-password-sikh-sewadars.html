  <div class="poster">

      Authorized access only — Sikh Sevadars records management
    </div>

    <div class="wrapper">

      <h1>Sign In</h1>

      <div class="panel">
        <form onsubmit="validateLogin(event)">
          <div class="form-field">
            <label for="username">Username</label>
            <select id="username" name="username" required>
              <option value="Tavinder">Tavinder</option>
            </select>
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
          </div>

          <button type="submit" class="btn-login">Login</button>
          <div class="error" id="error-message"></div>
        </form>
      </div>

    </div>

            stroke-linejoin="round">
            <path d="M19 12H5M5 12l7-7M5 12l7 7" />
          </svg>
          Back
        </a>
        <div class="footer-left">© 2026 Sikhs in India</div>
        <div class="footer-right">Preserving Sikh Heritage & Unity</div>
      </div>
    </div>

  </div>

  <script>
    function validateLogin(event) {
      event.preventDefault(); // Stop form from submitting

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const error = document.getElementById("error-message");

      if (username === "Tavinder" && password === "arora12345") {
        window.location.href = "./06-sikh-sevadars-aed.html";
      } else {
        error.textContent = "Invalid username or password.";
      }
    }
  </script>
