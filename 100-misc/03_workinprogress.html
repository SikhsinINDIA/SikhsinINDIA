  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #0d1b3e;
      --navy-mid: #162147;
      --gold: #F7941D;
      --gold-light: #F7941D;
      --cream: #f5f0e8;
      --white: #ffffff;
    }

    body {
      font-family: 'Lato', sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 8px;
    }

    /* MAIN CONTAINER POSTER SHEET */
    .poster {
      width: 100%;
      max-width: 650px;
      background: var(--cream);
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      overflow: hidden;
      text-align: center;
    }

    /* BRAND HEADER WINDOW */
    .header {
      display: flex;
      background: var(--navy);
      position: relative;
    }

    .logo-wrap {
      padding: 16px 20px;
    }

    .logo-img {
      height: 75px;
      background: #fff;
      padding: 4px;
      border-radius: 6px;
    }

    .hero {
      flex: 1;
      text-align: center;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, var(--navy), #1a2a5e);
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 900;
      color: #fff;
      line-height: 1.2;
    }

    .hero-title span {
      color: var(--gold);
    }

    /* ACCENT METRIC STRIP */
    .intro {
      background: linear-gradient(90deg, var(--gold), #ffb347, var(--gold));
      padding: 12px 20px;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--navy);
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    /* CONTENT WRAPPER */
    .wrapper {
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 5vw, 42px);
      color: var(--navy);
      font-weight: 900;
    }

    .notice-text {
      font-size: 16px;
      color: #444;
      max-width: 480px;
      line-height: 1.6;
    }

    /* IMAGE CONTAINER DISPLAY */
    .image-row {
      width: 100%;
      max-width: 420px;
      margin: 10px 0;
    }

    img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    /* FOOTER CONTROL BAR */
    .footer {
      background: var(--navy-mid);
      padding: 16px 36px;
      border-top: 2px solid var(--gold);
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .footer-left {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* 3D ENGRAVED GOLDEN BACK BUTTON */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'Lato', sans-serif;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--navy);
      background: linear-gradient(135deg, var(--gold-light) 0%, #e8830a 100%);
      border: none;
      border-radius: 5px;
      padding: 9px 18px;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 220, 120, 0.5),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 2px #9a5800,
        0 0 0 3.5px var(--gold);
      transition: filter 0.15s, transform 0.1s;
      flex-shrink: 0;
    }

    .btn-back:hover {
      filter: brightness(1.08);
    }

    .btn-back:active {
      transform: scale(0.97);
    }

    .btn-back svg {
      width: 12px;
      height: 12px;
    }

    @media(max-width: 500px) {
      .header {
        flex-direction: column;
        align-items: center;
      }
      .logo-wrap {
        padding: 16px 20px 4px 20px;
      }
      .hero {
        padding: 16px;
        width: 100%;
      }
      .wrapper {
        padding: 30px 16px;
      }
      .footer-content {
        flex-direction: column-reverse;
        text-align: center;
        gap: 16px;
      }
    }
  </style>
