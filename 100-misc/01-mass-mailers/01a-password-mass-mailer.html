  <script>
    /* Real Firebase sign-in as one of ADMIN_EMAILS (the same accounts as the
       Akhand Path admin login, and the Worker's ADMIN_EMAILS var). The
       Worker only sends mass mail / WhatsApp for that admin's ID token, so
       no password or secret lives in this page's source any more. Firebase
       keeps the session in IndexedDB, shared by every tab on the site. */
    firebase.initializeApp({
      apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
      authDomain: "sikhsinindia-67a6b.firebaseapp.com",
      projectId: "sikhsinindia-67a6b",
      storageBucket: "sikhsinindia-67a6b.appspot.com",
      messagingSenderId: "622603668882",
      appId: "1:622603668882:web:953c6a07864b235fdd054b",
      measurementId: "G-LHNTFNW14H"
    });
    const ADMIN_EMAILS = ["tpsarora@gmail.com", "sikhsinindia@gmail.com"];
    const nextPage = /^[\w-]+\.html$/.test(new URLSearchParams(location.search).get("next") || "")
      ? new URLSearchParams(location.search).get("next") : "01-mass-mailer.html";

    /* Emails a Firebase password-reset link to the admin email typed above.
       Firebase doesn't reveal whether the account exists, so the message is
       worded "if". */
    async function forgotPassword() {
      const email = document.getElementById("username").value.trim().toLowerCase();
      const error = document.getElementById("error-message");
      if (!ADMIN_EMAILS.includes(email)) {
        error.textContent = "Type your admin email above first, then tap Forgot password.";
        return;
      }
      try {
        await firebase.auth().sendPasswordResetEmail(email);
        error.textContent = `If ${email} has an account, a password reset link is on its way. Check your inbox (and spam), set a new password, then log in here.`;
      } catch (err) {
        error.textContent = "Couldn't send the reset email: " + (err.message || err);
      }
    }

    async function validateLogin(event) {
      event.preventDefault();
      const email = document.getElementById("username").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const error = document.getElementById("error-message");

      if (!ADMIN_EMAILS.includes(email)) {
        error.textContent = "That email is not an admin account.";
        return;
      }
      error.textContent = "Signing in...";
      try {
        const { user } = await firebase.auth().signInWithEmailAndPassword(email, password);
        if (!user.emailVerified) {
          // One-time step per admin account: the Worker refuses unverified
          // emails, since Firebase lets anyone register an unclaimed address.
          await user.sendEmailVerification();
          await firebase.auth().signOut();
          error.textContent = `Please verify ${email} first: we've just emailed a verification link. Click it, then log in again.`;
          return;
        }
        window.location.href = "./" + nextPage;
      } catch (err) {
        error.textContent = "Login failed: " + (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" ? "wrong email or password." : (err.message || err));
      }
    }
  </script>
