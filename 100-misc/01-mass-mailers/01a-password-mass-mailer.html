<body>

  <div class="poster">
    <div class="header">
      <div class="logo-wrap">
        <img class="logo-img" src="../../pictures/00-index/sikhsinindia.png" alt="Sikhs In India Logo">
      </div>
      <div class="hero">
        <div class="hero-title">Mass Mailer <span>Login</span></div>
        <div class="hero-sub">Compose &amp; Send Bulk Emails to Registered Members</div>
      </div>
    </div>

    <div class="wrapper">
      <form onsubmit="validateLogin(event)">
        <div class="form-row">
          <label>Username</label>
          <select id="username" required>
            <option value="Tavinder">Tavinder</option>
          </select>
        </div>
        <div class="form-row">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-action">Login</button>
        <p class="error" id="error-message"></p>
      </form>
    </div>

    <div class="footer">
      <div class="footer-content">
        <a href="../../index.html" class="btn-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"

          Back
        </a>
        <div class="footer-left">© 2026 Sikhs in India</div>
        <div class="footer-right">Preserving Sikh Heritage &amp; Unity</div>
      </div>
    </div>
  </div>

  <script>
    function validateLogin(event) {
      event.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const error = document.getElementById("error-message");

      if (username === "Tavinder" && password === "arora12345") {
        // 01-mass-mailer.html checks for this flag on load and redirects back
        // here if it's missing. localStorage (not sessionStorage) so it's
        // shared across every tab, not just the one that logged in.
        // NOTE: still just a client-side flag, not real authentication —
        // anyone who reads this page's code can set it themselves via
        // DevTools. It deters casual browsing, not a determined visitor.
        localStorage.setItem("massMailerAdminAuthed", "1");
        window.location.href = "./01-mass-mailer.html";
      } else {
        error.textContent = "Invalid username or password.";
      }
    }
  </script>
