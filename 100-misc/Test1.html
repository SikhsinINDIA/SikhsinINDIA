<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-LHNTFNW14H');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Drive Photo Album</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .album {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }
    .album img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }
    .album img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>My Google Drive Album</h1>
  <div class="album">
    <img src="https://drive.google.com/file/d/1K8m38JbY1aDBbiNJ2m-U6dDHHhhm8KoU" alt="Photo 1">
    <img src="https://drive.google.com/uc?export=view&id=1K8m38JbY1aDBbiNJ2m-U6dDHHhhm8KoU" alt="Photo 2">
    <img src="https://photos.google.com/album/AF1QipO7yBP04jHPtEjwlPHqK7fYOwqbOtMdQcW6A2I/photo/AF1QipOsKuKXySWEj1Vh4tef7lo1B7NtQRi7Tf5lPIQ" alt="Photo 3">
    <img src="https://drive.google.com/thumbnail?id=FILE_ID&sz=w1000">
  </div>
</body>
</html>
