      align-items: center;
      justify-content: center;

      font-weight: 900;
      color: #fff;
      line-height: 1.2;
    }

      color: var(--gold);
    }

    .intro {

      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--navy);
      font-size: 14px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .wrapper {

      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* HUB DETAILS DECK */
    .card {
      background: var(--white);
      border-radius: 6px;
      padding: 24px 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(13, 27, 62, 0.06);
    }

      border-left: 4px solid var(--navy);
    }

    .address-card p {
      font-size: 16px;
      color: var(--text-main);
      line-height: 1.6;
    }

      font-size: 20px;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .connect-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .connect-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 3px solid var(--gold);
    }

    .connect-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .connect-card h2 img {
      height: 20px;
      width: auto;
      object-fit: contain;
    }

    .connect-value {
      font-size: 15px;
      color: var(--text-main);
      font-weight: 700;
      word-break: break-all;
    }

    .connect-value a {
      color: var(--navy);
      text-decoration: none;
      border-bottom: 1px dashed var(--gold);
      transition: color 0.15s;
    }

    .connect-value a:hover {
      color: var(--gold);
    }

    /* FOOTER CONTROL BAR */
    .footer {
      background: var(--navy-mid);
      padding: 16px 36px;
      border-top: 2px solid var(--gold);
    }

    .footer-content {

      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .footer-left {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* 3D ENGRAVED GOLDEN BACK BUTTON */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'Lato', sans-serif;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;

      flex-shrink: 0;
    }

    .btn-back:hover {
      filter: brightness(1.08);

    .btn-back:active {
      transform: scale(0.97);
    }

    .btn-back svg {
      width: 12px;
      height: 12px;
    }

        text-align: center;
        gap: 16px;
      }
    }
