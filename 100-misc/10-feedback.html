  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #0d1b3e;
      --navy-mid: #162147;
      --gold: #F7941D;
      --gold-light: #F7941D;
      --cream: #f5f0e8;
      --white: #ffffff;
      --input-border: rgba(13, 27, 62, 0.2);

    body {
      font-family: 'Lato', sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 8px;
    }

    /* MAIN CONTAINER POSTER SHEET */
    .poster {
      width: 100%;
      max-width: 750px;
      background: var(--cream);
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      overflow: hidden;
    }

    /* BRAND HEADER WINDOW */
    .header {
      display: flex;
      background: var(--navy);
      position: relative;
    }

    .logo-wrap {
      padding: 16px 20px;
    }

    .logo-img {
      height: 75px;
      background: #fff;
      padding: 4px;
      border-radius: 6px;
    }

    .hero {
      flex: 1;
      text-align: center;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, var(--navy), #1a2a5e);
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 900;
      color: #fff;
      line-height: 1.2;
    }

    .hero-title span {
      color: var(--gold);
    }

    /* ACCENT METRIC STRIP */
    .intro {
      background: linear-gradient(90deg, var(--gold), #ffb347, var(--gold));
      padding: 12px 20px;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--navy);
      font-size: 14px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* CONTENT DISPLAY WRAPPER */
    .wrapper {
      padding: 32px 24px;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 32px;
    }

    /* LEFT BLOCK: VISUAL & QUOTE */
    .sidebar-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: rgba(13, 27, 62, 0.03);
      padding: 24px;
      border-radius: 8px;
      border: 1px dashed rgba(13, 27, 62, 0.1);
    }

    .responsive-image {
      width: 100%;
      height: auto;
      max-width: 240px;
      object-fit: contain;
    }

    .quotes {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      color: var(--navy-mid);
      line-height: 1.4;
    }

    /* RIGHT BLOCK: FORM MODULE */
    .form-panel h2 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: var(--navy);
      margin-bottom: 20px;
      font-weight: 900;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--navy-mid);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 11px 14px;
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      color: #222;
      background: var(--white);
      border: 1px solid var(--input-border);
      border-radius: 5px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(247, 148, 29, 0.15);
    }

    textarea {
      height: 100px;
      resize: none;
    }

    .hidden {
      display: none !important;
    }

    /* ACTIONS & STATUS */
    .btn-submit {
      width: 100%;
      background: var(--navy);
      color: var(--white);
      border: none;
      padding: 12px;
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background: var(--navy-mid);
    }

    .error-message {
      color: #d93838;
      font-size: 11px;
      font-weight: 700;
      margin-top: 4px;
    }

    #status {
      margin-top: 14px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    /* FOOTER CONTROL BAR */
    .footer {
      background: var(--navy-mid);
      padding: 16px 36px;
      border-top: 2px solid var(--gold);
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .footer-left {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* 3D ENGRAVED GOLDEN BACK BUTTON */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'Lato', sans-serif;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--navy);
      background: linear-gradient(135deg, var(--gold-light) 0%, #e8830a 100%);
      border: none;
      border-radius: 5px;
      padding: 9px 18px;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 220, 120, 0.5),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 2px #9a5800,
        0 0 0 3.5px var(--gold);
      transition: filter 0.15s, transform 0.1s;

<body>

  <div class="poster">

    <!-- PLATFORM HEADER BRAND LAYER -->
    <div class="header">

      </div>
      <div class="hero">
        <div class="hero-title">Transmission <span>Console</span></div>
      </div>
    </div>

    <div class="intro">
      Information Gateway &bull; Reader Feedback Repository
    </div>

    <div class="wrapper">

      <!-- LEFT COLUMN: SIDE PANEL METRIC -->
      <div class="sidebar-panel">
        <img src="../pictures/100_Misc/10_Feedback/Your_Feedback_Matters.png" class="responsive-image" alt="Your Feedback Matters">
        <div class="quotes">
          "Strive for continuous improvement, instead of perfection."
        </div>
      </div>

      <!-- RIGHT COLUMN: COMMUNICATIONS PORT -->
      <div class="form-panel">
        <h2>Please share your Feedback</h2>
        
        <form id="feedbackForm" novalidate>
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" maxlength="50" required>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="contact@example.com" required>
          </div>

          <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input type="text" id="mobile" name="mobile" placeholder="Mobile phone number" maxlength="15" required>
          </div>

          <div class="form-group">
            <label for="feedback">Your Feedback</label>
            <textarea id="feedback" name="feedback" maxlength="256" required></textarea>
          </div>

          <input id="honeypot" class="hidden" type="text" />

          <button class="btn-submit" type="button" onclick="sendEmail()">Submit</button>

          <div id="status"></div>
        </form>
      </div>

    </div>

    <!-- SITE FOOTER FRAME -->

      <div class="footer-content">

            stroke-linejoin="round">

  <!-- EmailJS Engine Integrations -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
      emailjs.init("-jtHOddqV8vT6Z7jg");
    })();
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const mobileInput = document.getElementById("mobile");
      const feedbackInput = document.getElementById("feedback");
      const status = document.getElementById("status");

      const errorMessages = {};

      function createErrorElement(input) {
        const errorDiv = document.createElement("div");
        errorDiv.className = "error-message";
        input.parentNode.appendChild(errorDiv);
        errorMessages[input.id] = errorDiv;
      }

      [nameInput, emailInput, mobileInput, feedbackInput].forEach(createErrorElement);

      function setError(input, message) {
        input.style.borderColor = "#d93838";
        errorMessages[input.id].textContent = message;
      }

      function clearError(input) {
        input.style.borderColor = "var(--input-border)";
        errorMessages[input.id].textContent = "";
      }

      function validateName() {
        if (!nameInput.value.trim()) {
          setError(nameInput, "Name is required.");
          return false;
        }
        clearError(nameInput);
        return true;
      }

      function validateEmail() {
        const email = emailInput.value.trim();
        if (!email) {
          setError(emailInput, "Email is required.");
          return false;
        }
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          setError(emailInput, "Enter a valid email (e.g. user@example.com).");
          return false;
        }
        clearError(emailInput);
        return true;
      }

      function validateMobile() {
        const digitsOnly = mobileInput.value.replace(/\D/g, '');
        if (!mobileInput.value.trim()) {
          setError(mobileInput, "Mobile number is required.");
          return false;
        } else if (digitsOnly.length < 9 || digitsOnly.length > 15) {
          setError(mobileInput, "Mobile number must be 9–15 digits.");
          return false;
        }
        clearError(mobileInput);
        return true;
      }

      function validateFeedback() {
        if (!feedbackInput.value.trim()) {
          setError(feedbackInput, "Feedback is required.");
          return false;
        }
        clearError(feedbackInput);
        return true;
      }

      [nameInput, emailInput, mobileInput, feedbackInput].forEach((input) => {
        input.addEventListener("input", () => {
          switch (input.id) {
            case "name": validateName(); break;
            case "email": validateEmail(); break;
            case "mobile": validateMobile(); break;
            case "feedback": validateFeedback(); break;
          }
        });
      });

      window.sendEmail = function () {
        const valid = [validateName(), validateEmail(), validateMobile(), validateFeedback()].every(Boolean);
        if (!valid) {
          status.innerText = "Please correct the highlighted fields.";
          status.style.color = "#d93838";
          return;
        }

        status.innerText = "Processing transmission...";
        status.style.color = "var(--navy)";
        
        const params = {
          name: nameInput.value,
          email: emailInput.value,
          mobile: mobileInput.value,
          feedback: feedbackInput.value
        };

        emailjs.send("service_dlzwpyu", "template_pejcg7q", params)
          .then(function(response) {
            console.log("✅ SUCCESS!", response.status, response.text);
            status.innerText = "Thank you! Your feedback has been sent.";
            status.style.color = "green";
            document.getElementById("feedbackForm").reset();
          })
          .catch(function(error) {
            console.error("❌ FAILED...", error);
            if (error.status === 401 || error.status === 403) {
              status.innerText = "Authorization error — check EmailJS configurations.";
            } else {
              status.innerText = "Something went wrong. Please try again later.";
            }
            status.style.color = "#d93838";
          });
      };
    });
  </script>
