<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sikh Welfare Organizations in India</title>
  <style>
    body {
      background-color: #000;
      color: #FF9933;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .filters {
    flex-direction: column;
    align-items: stretch;
    gap: 0; /* remove flex gap */
    margin-bottom: 1px;
    padding: 0 10px;
    }

    .filter-group {
  .filter-group {
    width: 100%;
    margin-bottom: 1px; /* tighten spacing */
    }

    .filter-group label {
    margin-bottom: 1px;
    font-size: 15px;
    }

    select,
    input[type="text"] {
    width: 100%;
    font-size: 16px;
    padding: 8px 10px;
    }

    #clearFilters {
    width: 100%;
    font-size: 18px;
    padding: 10px;
    margin-top: 4px; /* reduce top margin */
    align-self: stretch;
    }

    #clearFilters:hover {
      background-color: #FF8C00;
    }

    .table-container {
      border: 1px solid #FF9933;
      border-radius: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 600px;
      table-layout: fixed;
    }

    th,
    td {
      border: 1px solid #FF9933;
      padding: 1px;
      text-align: left;
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: break-word;
      max-width: 150px;
      box-sizing: border-box;
    }

    th {
      background-color: #FF9933;
      color: #000;
    }

    tr:nth-child(even) {
      background-color: #1a1a1a;
    }

    tr:hover {
      background-color: #333;
    }

    td.webpage-cell {
      text-align: center;
      padding: 5px;
    }

    .webpage-icon {
      width: 48px;
      height: 48px;
      display: block;
      margin: 0 auto;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .webpage-icon:hover {
      transform: scale(1.1);
    }

    .card-container {
      display: none;
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
    padding: 16px 12px;
    font-size: 16px;
    }

    .card strong {
    font-size: 16px;
    }

    .card a img {
      width: 36px;
      height: 36px;
      vertical-align: middle;
    }

    .back-button {
    width: 90%;
    max-width: 320px;
    font-size: 20px;
    padding: 12px 0;
    margin: 30px auto;
    }

    .back-button:hover {
      background-color: #FF8C00;
    }

    @media (max-width: 768px) {
      .table-container {
        display: none;
      }

      .card-container {
        display: block;
      }

      .filters {
        flex-direction: column;
        align-items: stretch;
        gap: 1px;
        margin-bottom: 1px;
        padding: 0 1px;
      }

      .filter-group {
        width: 100%;
        margin-bottom: 1px;
      }

      .filter-group label {
        margin-bottom: 1px;
        font-size: 15px;
      }

      select,
      input[type="text"] {
        width: 100%;
        font-size: 16px;
        padding: 1px 1px;
      }

      #clearFilters {
        width: 100%;
        font-size: 18px;
        padding: 1px;
        margin-top: 1px;
        align-self: stretch;
      }

      .card {
        padding: 1px 1px;
        font-size: 16px;
      }

      .card strong {
        font-size: 16px;
      }

      .back-button {
        width: 90%;
        max-width: 320px;
        font-size: 20px;
        padding: 1px 0;
        margin: 5px auto;
      }
    }
  </style>
</head>
<body>

  <h1>Sikh Welfare Organizations in India</h1>

  <div class="filters">
    <div class="filter-group">
      <label for="stateFilter">State:</label>
      <select id="stateFilter"><option value="All">All States</option></select>
    </div>
    <div class="filter-group">
      <label for="cityFilter">City:</label>
      <select id="cityFilter"><option value="All">All Cities</option></select>
    </div>
    <div class="filter-group">
      <label for="nameFilter">Name:</label>
      <input type="text" id="nameFilter" placeholder="Search by Name" />
    </div>
    <div class="filter-group">
      <label for="typeFilter">Type:</label>
      <select id="typeFilter"><option value="All">All Types</option></select>
    </div>
    <button id="clearFilters">Clear Filters</button>
  </div>

  <div class="table-container">
    <table id="recordsTable" aria-label="Sikh Welfare Table">
      <thead>
        <tr>
          <th>State</th>
          <th>City</th>
          <th>Name</th>
          <th>Type</th>
          <th>Webpage</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="card-container" id="cardContainer" aria-live="polite"></div>

  <button type="button" onclick="goBack()" class="back-button">
    <b>Back</b>
  </button>
<br>
  <button type="button" onclick="admin()" class="back-button" style="float: right; margin-top: -65px;">
    <b>Admin</b>
  </button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDq35pvLrPM_HwfJq6TEBbKVJqBapaweEU",
      authDomain: "sikhsinindia-67a6b.firebaseapp.com",
      projectId: "sikhsinindia-67a6b",
      storageBucket: "sikhsinindia-67a6b.appspot.com",
      messagingSenderId: "622603668882",
      appId: "1:622603668882:web:953c6a07864b235fdd054b",
      measurementId: "G-LHNTFNW14H"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const welfareCollection = collection(db, "Sikh_Welfare");

    const stateFilter = document.getElementById("stateFilter");
    const cityFilter = document.getElementById("cityFilter");
    const nameFilter = document.getElementById("nameFilter");
    const typeFilter = document.getElementById("typeFilter");
    const clearFiltersBtn = document.getElementById("clearFilters");
    const tableBody = document.getElementById("tableBody");
    const cardContainer = document.getElementById("cardContainer");

    let allRecords = [];

    async function fetchData() {
      tableBody.innerHTML = "";
      cardContainer.innerHTML = "";
      try {
        const querySnapshot = await getDocs(welfareCollection);
        allRecords = [];
        const stateSet = new Set();
        const citySet = new Set();
        const typeSet = new Set();
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          allRecords.push(data);
          if (data.State) stateSet.add(data.State);
          if (data.City) citySet.add(data.City);
          if (data.Type) typeSet.add(data.Type);
        });
        populateFilterOptions(stateFilter, Array.from(stateSet).sort(), "All States");
        populateFilterOptions(cityFilter, Array.from(citySet).sort(), "All Cities");
        populateFilterOptions(typeFilter, Array.from(typeSet).sort(), "All Types");
        displayRecords(allRecords);
      } catch (error) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Error loading records.</td></tr>`;
        cardContainer.innerHTML = `<p style="text-align:center;">Error loading records.</p>`;
      }
    }

    function populateFilterOptions(selectElem, options, defaultLabel) {
      selectElem.innerHTML = `<option value="All">${defaultLabel}</option>`;
      options.forEach(opt => {
        const option = document.createElement("option");
        option.value = opt;
        option.textContent = opt;
        selectElem.appendChild(option);
      });
    }

    function displayRecords(records) {
      tableBody.innerHTML = "";
      cardContainer.innerHTML = "";
      if (records.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No records found.</td></tr>`;
        cardContainer.innerHTML = `<p style="text-align:center;">No records found.</p>`;
        return;
      }
      records.forEach(record => {
        const row = document.createElement("tr");
        ["State", "City", "Name", "Type", "Webpage"].forEach(field => {
          const cell = document.createElement("td");
          if (field === "Webpage" && record[field]) {
            cell.classList.add("webpage-cell");
            const link = document.createElement("a");
            link.href = record[field];
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            const icon = document.createElement("img");
            icon.src = "./pictures/00_Index/Click.png";
            icon.alt = "Open Webpage";
            icon.title = "Open Webpage";
            icon.className = "webpage-icon";
            link.appendChild(icon);
            cell.appendChild(link);
          } else {
            cell.textContent = record[field] || "";
          }
          row.appendChild(cell);
        });
        tableBody.appendChild(row);

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML += `<p><strong>State:</strong> ${record.State || ""}</p>`;
        card.innerHTML += `<p><strong>City:</strong> ${record.City || ""}</p>`;
        card.innerHTML += `<p><strong>Name:</strong> ${record.Name || ""}</p>`;
        card.innerHTML += `<p><strong>Type:</strong> ${record.Type || ""}</p>`;
        if (record.Webpage) {
          const link = document.createElement("a");
          link.href = record.Webpage;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.title = "Open Webpage";
          const icon = document.createElement("img");
          icon.src = "./pictures/00_Index/Click.png";
          icon.alt = "Open Webpage";
          link.appendChild(icon);
          card.appendChild(link);
        }
        cardContainer.appendChild(card);
      });
    }

    function filterRecords() {
      const stateVal = stateFilter.value;
      const cityVal = cityFilter.value;
      const typeVal = typeFilter.value;
      const nameVal = nameFilter.value.trim().toLowerCase();
      const filtered = allRecords.filter(record => {
        return (stateVal === "All" || record.State === stateVal)
            && (cityVal === "All" || record.City === cityVal)
            && (typeVal === "All" || record.Type === typeVal)
            && (nameVal === "" || (record.Name && record.Name.toLowerCase().includes(nameVal)));
      });
      displayRecords(filtered);
    }

    stateFilter.addEventListener("change", filterRecords);
    cityFilter.addEventListener("change", filterRecords);
    typeFilter.addEventListener("change", filterRecords);
    nameFilter.addEventListener("input", filterRecords);
    clearFiltersBtn.addEventListener("click", () => {
      stateFilter.value = "All";
      cityFilter.value = "All";
      typeFilter.value = "All";
      nameFilter.value = "";
      displayRecords(allRecords);
    });

    fetchData();
  </script>

  <script>
    function goBack() {
      window.location.href = "./index.html";
    }

    function admin() {
      window.location.href = "./05a_Password.html";
    }
  </script>

</body>
</html>
