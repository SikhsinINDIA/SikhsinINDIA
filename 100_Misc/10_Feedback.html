<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Author -->
  <meta name="author" content="Sikhs in India">

  <!-- Robots -->
  <meta name="robots" content="index, follow">

  <!-- Open Graph meta tags for social media -->
  <meta property="og:title" content="Sikh Heritage & Traditions | Gurudwaras, Guru Nanak & Sikh Scriptures, Sikhs in India: History, Culture & Present | SikhsInIndia.com">
  <meta property="og:description" content="Explore the rich Sikh heritage in India, including traditions, Gurudwaras, teachings of Guru Nanak, Guru Gobind Singh, Sikh scriptures like Japji Sahib and Guru Granth Sahib Ji.">
  <meta property="og:image" content="https://sikhsinindia.com/sikhsinindia.jpg">
  <meta property="og:url" content="https://sikhsinindia.com">
  <meta property="og:type" content="website">

  <title>Feedback | SikhsInIndia.com</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../pictures/favicon.ico">
  <link rel="stylesheet" href="commonstyles.css">

  <style>
    :root {
      --primary-color: #FF9933; /* Kesari (Orange) */
      --text-color: #000000;    /* Black */
      --hover-bg-color: #000000;
      --hover-text-color: #FF9933;
      --input-border: #FF9933;
    }

    body {
      background-color: #fffdf5;
      color: var(--text-color);
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .hidden {
      display: none;
    }

    .center-text {
      text-align: center;
      color: var(--text-color);
    }

    nav.nav {
      background-color: var(--primary-color);
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    nav.nav a {
      color: var(--text-color);
      font-weight: bold;
      text-decoration: none;
    }

    nav.nav a:hover {
      color: var(--hover-text-color);
    }

    .contact_container {
      display: flex;
      flex-direction: column;
      margin: 20px;
    }

    @media (min-width: 600px) {
      .contact_container {
        flex-direction: row;
      }
    }

    .contact_container > * {
      flex-grow: 1;
      flex-basis: 0;
      min-width: 0;
      margin: 0 10px;
    }

    .quotes {
      font-weight: bold;
      font-size: larger;
      padding: 1px;
      margin: 5px;
      text-align: center;
      color: var(--text-color);
    }

    .contact-image {
      display: flex;
      margin-top: 20px;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .responsive-image {
      width: 100%;
      height: auto;
      max-width: 600px;
      object-fit: contain;
    }

    .contact-form {
      width: 100%;
    }

    form {
      display: flex;
      flex-direction: column;
      width: 80%;
      margin-top: 30px;
      padding-bottom: 10px;
    }

    input,
    button,
    textarea {
      margin-top: 5px;
      margin-bottom: 5px;
      padding: 8px;
      width: 100%;
      border: 2px solid var(--input-border);
      border-radius: 4px;
      box-sizing: border-box;
      background-color: white;
      color: var(--text-color);
    }

    button {
      cursor: pointer;
      font-weight: bold;
      font-size: larger;
      background-color: var(--primary-color);
      color: var(--text-color);
      border: 2px solid var(--text-color);
      padding: 8px 16px;
      transition: 0.4s;
      width: 100%;
    }

    button:hover:enabled {
      background-color: var(--hover-bg-color);
      color: var(--hover-text-color);
      border-color: var(--hover-bg-color);
    }

    .error-message {
      color: red;
      font-size: 0.9em;
      margin-bottom: 5px;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .contact_container {
        margin: 20px;
      }

      form {
        max-width: 90%;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    }
  </style>
</head>

<body>
  <h1 class="visually-hidden">Feedback</h1>

  <div class="contact_container">
    <div class="contact-image">
      <img src="../pictures/100_Misc/10_Feedback/Your_Feedback_Matters.png" class="responsive-image" alt="Your Feedback Matters">
      <div class="quotes">
        "Strive for continuous improvement, instead of perfection."
      </div>
    </div>

    <div class="contact-form">
      <h2 class="center-text">Please share your Feedback</h2>
      <form class="contact" id="feedbackForm">
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" maxlength="50" required>
        </div>

        <div>
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="contact@example.com" required>
        </div>

        <div>
          <label for="mobile">Mobile Number</label>
          <input type="text" id="mobile" name="mobile" placeholder="mobile" maxlength="15" required>
        </div>

        <div>
          <label for="feedback">Your Feedback</label>
          <textarea id="feedback" name="feedback" maxlength="256" required></textarea>
        </div>

        <input id="honeypot" class="hidden" type="text" />

        <button type="button" onclick="sendEmail()">Submit</button>

        <div id="status" class="center-text"></div>
      </form>
    </div>
  </div>

  <!-- EmailJS -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
      emailjs.init("YOUR_PUBLIC_KEY_HERE"); // Replace with your EmailJS public key
    })();
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const mobileInput = document.getElementById("mobile");
      const feedbackInput = document.getElementById("feedback");
      const status = document.getElementById("status");

      const errorMessages = {};

      function createErrorElement(input) {
        const errorDiv = document.createElement("div");
        errorDiv.className = "error-message";
        input.parentNode.appendChild(errorDiv);
        errorMessages[input.id] = errorDiv;
      }

      [nameInput, emailInput, mobileInput, feedbackInput].forEach(createErrorElement);

      function setError(input, message) {
        input.style.borderColor = "red";
        errorMessages[input.id].textContent = message;
      }

      function clearError(input) {
        input.style.borderColor = "var(--input-border)";
        errorMessages[input.id].textContent = "";
      }

      function validateName() {
        if (!nameInput.value.trim()) {
          setError(nameInput, "Name is required.");
          return false;
        }
        clearError(nameInput);
        return true;
      }

function validateEmail() {
  const email = emailInput.value.trim();

  if (!email) {
    setError(emailInput, "Email is required.");
    return false;
  }

  if (emailInput.type === "email" && !emailInput.checkValidity()) {
    setError(emailInput, "Enter a valid email (e.g. user@example.com).");
    return false;
  }

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if (!emailRegex.test(email)) {
    setError(emailInput, "Enter a valid email (e.g. user@example.com).");
    return false;
  }

  clearError(emailInput);
  return true;
}


      function validateMobile() {
        const digitsOnly = mobileInput.value.replace(/\D/g, '');
        if (!mobileInput.value.trim()) {
          setError(mobileInput, "Mobile number is required.");
          return false;
        } else if (digitsOnly.length < 9 || digitsOnly.length > 15) {
          setError(mobileInput, "Mobile number must be 9–15 digits.");
          return false;
        }
        clearError(mobileInput);
        return true;
      }

      function validateFeedback() {
        if (!feedbackInput.value.trim()) {
          setError(feedbackInput, "Feedback is required.");
          return false;
        }
        clearError(feedbackInput);
        return true;
      }

      [nameInput, emailInput, mobileInput, feedbackInput].forEach((input) => {
        input.addEventListener("input", () => {
          switch (input.id) {
            case "name": validateName(); break;
            case "email": validateEmail(); break;
            case "mobile": validateMobile(); break;
            case "feedback": validateFeedback(); break;
          }
        });
      });

      window.sendEmail = function () {
        const valid = [validateName(), validateEmail(), validateMobile(), validateFeedback()].every(Boolean);
        if (!valid) {
          status.innerText = "Please correct the highlighted fields.";
          status.style.color = "red";
          return;
        }

        status.innerText = "";
        const params = {
          name: nameInput.value,
          email: emailInput.value,
          mobile: mobileInput.value,
          feedback: feedbackInput.value
        };

        emailjs.send("service_dlzwpyu", "template_pejcg7q", params)
          .then(function(response) {
            console.log("✅ SUCCESS!", response.status, response.text);
            status.innerText = "Thank you! Your feedback has been sent.";
            status.style.color = "green";
            document.getElementById("feedbackForm").reset();
          })
          .catch(function(error) {
            console.error("❌ FAILED...", error);

            if (error.status === 401 || error.status === 403) {
              status.innerText = "Authorization error — check EmailJS Public Key or allowed domains.";
            } else if (error.text && error.text.includes("CORS")) {
              status.innerText = "CORS error — add your site domain in EmailJS allowed origins.";
            } else {
              status.innerText = "Something went wrong. Please try again later.";
            }
            status.style.color = "red";
          });
      };
    });
  </script>

  <a href="../index.html" class="back-button" 
    style="width: 150px; height: 36px; font-size: 24px; background-color: #FF9933; 
           color: black; display: block; margin: 20px auto 0 auto; text-align: center; 
           line-height: 30px; border-radius: 8px; text-decoration: none; 
           border: 2px solid black;">
    <b>Back</b>
  </a>
</body>
</html>
